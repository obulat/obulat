<title>Element Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a child's own science toy, bright and friendly, never babyish
   IDEA a sticker album: every element read aloud by the child earns its star sticker
   PICTURE the full periodic table as chunky coloured tiles; each opens a spinning 3D atom or molecule
   COLOUR white or night ground, bold blue header band, ten bright category colours, gold stars
   TYPE Nunito 900 for names and symbols, Nunito 600 for text (Latin, Turkish and Cyrillic)
   LAYOUT laptop or tablet: header band, then the table across the full width, legend below; phone: the table scrolls sideways in its own box */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#11131f);--ink:light-dark(#1b1d33,#f1f2fa);--soft:light-dark(#f2f4fc,#1c1f32);--line:light-dark(#d9deef,#30355a);--mute:light-dark(#555a78,#aab0d0);--brand:#3550f0;--star:#ffb300;--tink:#1b1d33}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.c-alk{--c:#ff6b6b}.c-ae{--c:#ffa94d}.c-tm{--c:#ffd43b}.c-ptm{--c:#a9e34b}.c-mtl{--c:#63e6be}.c-nm{--c:#4dabf7}.c-hal{--c:#b197fc}.c-ng{--c:#f783ac}.c-lan{--c:#ffc078}.c-act{--c:#e599f7}
.top{background:var(--brand);color:#fff;margin-top:calc(-1*env(safe-area-inset-top,0px));padding:calc(env(safe-area-inset-top,0px) + 14px) max(4vw,16px,env(safe-area-inset-right,0px)) 14px max(4vw,16px,env(safe-area-inset-left,0px))}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
h1{margin:0;font-size:clamp(28px,4vw,44px);font-weight:900;line-height:1.05;letter-spacing:-.02em}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;background:rgba(255,255,255,.16);border-radius:999px;padding:4px}
.seg button{padding:9px 16px;border-radius:999px;font-weight:800;min-height:44px;white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:var(--brand)}
.stars{display:flex;align-items:center;gap:6px;background:#fff;color:var(--tink);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:900;font-size:20px}
.stars svg{width:26px;height:26px;fill:var(--star)}
.gear{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
.gear svg{width:22px;height:22px;fill:#fff}
.settings{margin-top:12px;background:#fff;color:var(--tink);border-radius:18px;padding:16px 18px;display:grid;gap:10px;max-width:560px;margin-left:auto}
.settings h2{margin:0;font-size:18px}
.settings label{display:flex;gap:10px;align-items:center}
.settings input{width:22px;height:22px}
.settings .rst{justify-self:start;background:#ffe3e3;color:#a11;padding:8px 14px;border-radius:12px;font-weight:800}
.settings .vnote{color:#a35200;font-size:14px}
main{padding:18px max(4vw,16px,env(safe-area-inset-right,0px)) 32px max(4vw,16px,env(safe-area-inset-left,0px))}
.quiz{background:var(--soft);border:2px solid var(--line);border-radius:22px;padding:14px 20px;margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.quiz .qp{color:var(--mute);font-weight:800}
.qword{font-size:clamp(34px,6vw,60px);font-weight:900;line-height:1.05;letter-spacing:-.01em}
.qbtns{display:flex;gap:10px;margin-left:auto}
.pill{background:var(--brand);color:#fff;border-radius:14px;padding:10px 18px;font-weight:800;min-height:44px}
.pill.alt{background:var(--soft);color:var(--ink);border:2px solid var(--line)}
.qmsg{flex-basis:100%;font-size:20px;font-weight:800;min-height:30px}
.qmsg.ok{color:#2b8a3e}.qmsg.bad{color:#c92a2a}
.scroll{overflow-x:auto;padding-bottom:6px}
.pt{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));grid-template-rows:repeat(7,auto) 14px auto auto;gap:4px;min-width:740px}
.el{container-type:inline-size;position:relative;aspect-ratio:1/1.12;background:var(--c,#ccc);color:var(--tink);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;transition:transform .15s,opacity .2s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.el:active{transform:scale(.93)}
.el small{position:absolute;top:2px;left:5px;font-size:11px;font-weight:800;opacity:.75}
.el b{font-size:clamp(14px,40cqi,30px);font-weight:900;line-height:1}
.el i{font-style:normal;font-size:clamp(9px,14cqi,12px);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@container (max-width:64px){.el i{display:none}}
.el.ph{opacity:.55;font-size:12px;font-weight:800;box-shadow:none}
.el.got::after{content:"";position:absolute;top:-5px;right:-5px;width:18px;height:18px;background:var(--star);border:2px solid var(--bg);border-radius:50%;clip-path:polygon(50% 0,63% 35%,100% 38%,71% 60%,80% 98%,50% 77%,20% 98%,29% 60%,0 38%,37% 35%)}
.pt[data-hl] .el:not(.hl){opacity:.22}
.el.right{animation:pop .6s}
.el.wrong{animation:shake .4s}
@keyframes pop{40%{transform:scale(1.35);box-shadow:0 0 0 6px #51cf66}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.under{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:18px;margin-top:16px;align-items:start}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend button{background:var(--c);color:var(--tink);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;min-height:40px}
.legend[data-hl] button:not(.on){opacity:.4}
.prog{background:var(--soft);border-radius:18px;padding:12px 16px}
.prog b{font-size:18px}
.bar{height:12px;background:var(--line);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--star);border-radius:99px;transition:width .4s}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:0 max(4vw,16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(4vw,16px,env(safe-area-inset-left,0px))}
.sbar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px}
.sbar .nav{display:flex;gap:8px}
.sl{background:var(--soft);border:2px solid var(--line);margin-left:auto}
.sl button[aria-pressed=true]{background:var(--brand);color:#fff}
.sbar .nav button{width:48px;height:48px;border-radius:14px;background:var(--soft);border:2px solid var(--line);font-size:26px;font-weight:900;line-height:1}
.dgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.view{position:sticky;top:76px;height:calc(100svh - 100px);min-height:380px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#26306a,#0b0e22 75%);touch-action:none;user-select:none}
.view canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.vcap{position:absolute;left:16px;right:16px;bottom:14px;color:#fff;pointer-events:none;display:grid;gap:2px}
.vcap b{font-size:22px;font-weight:900}
.vcap span{font-size:15px;color:#c8cff5}
.vhint{position:absolute;top:12px;left:16px;color:#aab3e8;font-size:14px;pointer-events:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:24px}
.namecard{display:flex;gap:18px;align-items:center}
.bigtile{flex:none;width:112px;height:124px;border-radius:20px;background:var(--c);color:var(--tink);display:grid;place-items:center;position:relative;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.bigtile small{position:absolute;top:8px;left:12px;font-size:18px;font-weight:900}
.bigtile b{font-size:56px;font-weight:900}
.name{font-size:clamp(38px,5.6vw,64px);font-weight:900;line-height:1.05;letter-spacing:-.01em;overflow-wrap:anywhere}
.name span{transition:color .1s}
.name span.lit{color:var(--brand)}
:root[data-theme=dark] .name span.lit{color:#8ea0ff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .name span.lit{color:#8ea0ff}}
.cat{display:inline-block;margin-top:6px;background:var(--c);color:var(--tink);border-radius:999px;padding:3px 12px;font-weight:800;font-size:15px}
.readrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.listen,.iread{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;border-radius:18px;padding:12px 20px;min-height:58px;font-size:20px;font-weight:900}
.listen{background:var(--brand);color:#fff}
.listen svg,.iread svg{width:28px;height:28px;fill:currentColor;flex:none}
.listen:disabled{background:var(--soft);color:var(--mute);border:2px solid var(--line);cursor:default}
.listen .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--brand) 22%,transparent)}
.listen:disabled .fill{animation:fillup var(--wait,4s) linear forwards}
@keyframes fillup{to{width:100%}}
.listen>*:not(.fill){position:relative}
.iread{background:var(--star);color:var(--tink)}
.iread.done{background:var(--soft);color:var(--ink);border:2px solid var(--line)}
.iread.done svg{fill:var(--star)}
.note{color:var(--mute);margin:10px 0 0}
.note.warn{color:#c25e00}
.fact{margin-top:18px;background:var(--soft);border-radius:20px;padding:16px 18px}
.words{font-size:clamp(20px,2.4vw,25px);line-height:1.5;font-weight:700}
.words button{padding:0 2px;border-radius:6px}
.words button.on{background:var(--star);color:var(--tink)}
.along{margin-top:10px;display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:8px 16px;font-weight:800;min-height:44px}
.along svg{width:20px;height:20px;fill:currentColor}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:10px;margin-top:18px}
.stats div{border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.stats span{display:block;color:var(--mute);font-size:14px;font-weight:700}
.stats b{font-size:24px;font-weight:900;white-space:nowrap}
.stats .p b{color:#e03131}.stats .e b{color:#1c7ed6}
h3{margin:22px 0 8px;font-size:20px;font-weight:900}
.shells{display:flex;flex-wrap:wrap;gap:8px}
.shells span{background:#1c7ed6;color:#fff;border-radius:999px;min-width:44px;text-align:center;padding:6px 12px;font-weight:900;font-size:18px}
.mols{display:flex;flex-wrap:wrap;gap:10px}
.mols button{border:2px solid var(--line);border-radius:16px;padding:8px 14px;min-height:52px;text-align:left;display:grid;line-height:1.2}
.mols button b{font-size:19px;font-weight:900}
.mols button span{font-size:14px;color:var(--mute)}
.mols button[aria-pressed=true]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.moldesc{margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--star);color:var(--tink);font-weight:900;font-size:22px;padding:12px 24px;border-radius:999px;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:up .3s}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}
@media(max-width:899px){.dgrid{grid-template-columns:minmax(0,1fr)}.view{position:relative;top:0;height:46svh;min-height:300px}}
@media(max-width:640px){.under{grid-template-columns:minmax(0,1fr)}.bigtile{width:84px;height:94px}.bigtile b{font-size:40px}.qbtns{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="topin">
    <h1 id="t-title">Element Explorer</h1>
    <div class="ctrls">
      <div class="seg" id="langs" role="group" aria-label="Language">
        <button data-l="en">English</button><button data-l="ru">Русский</button><button data-l="tr">Türkçe</button>
      </div>
      <div class="seg" id="modes" role="group">
        <button data-m="table" id="t-table">Table</button><button data-m="quiz" id="t-quiz">Find it!</button>
      </div>
      <div class="stars" aria-live="polite"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7.5.6-5.7 4.9 1.8 7.4L12 18l-6.6 3.9 1.8-7.4L1.5 9.6 9 9z"/></svg><b id="starN">0</b></div>
      <button class="gear" id="gearBtn" aria-label="Settings" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 000-2l2.1-1.6-2-3.5-2.5 1a7 7 0 00-1.7-1L15 3.3h-4l-.4 2.6a7 7 0 00-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 000 2l-2.1 1.6 2 3.5 2.5-1a7 7 0 001.7 1l.4 2.6h4l.4-2.6a7 7 0 001.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z" transform="translate(-1 0)"/></svg></button>
    </div>
  </div>
  <div class="settings" id="settings" hidden>
    <h2 id="t-settings">For grown-ups</h2>
    <label><input type="checkbox" id="optRF" checked> <span id="t-rf"></span></label>
    <label><input type="checkbox" id="optSlow"> <span id="t-slow"></span></label>
    <div class="vnote" id="vnote1"></div>
    <button class="rst" id="resetBtn"></button>
  </div>
</header>

<main>
  <section class="quiz" id="quiz" hidden aria-live="polite">
    <span class="qp" id="q-prompt"></span>
    <div class="qword" id="q-word"></div>
    <div class="qbtns"><button class="pill alt" id="q-hint" hidden></button><button class="pill" id="q-skip"></button></div>
    <div class="qmsg" id="q-msg"></div>
  </section>
  <div class="scroll"><div class="pt" id="ptable"></div></div>
  <div class="under">
    <div class="legend" id="legend"></div>
    <div class="prog"><b id="progL"></b><div class="bar"><i id="progBar"></i></div></div>
  </div>
</main>

<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="ename">
  <div class="sbar">
    <button class="pill alt" id="back">← <span id="t-back">Table</span></button>
    <div class="seg sl" id="langs2" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="ru">RU</button><button data-l="tr">TR</button></div>
    <div class="nav"><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button></div>
  </div>
  <div class="dgrid">
    <div class="view" id="view">
      <div class="vhint" id="vhint"></div>
      <div class="nogl" id="nogl" hidden></div>
      <div class="vcap"><b id="vtitle"></b><span id="vsub"></span></div>
    </div>
    <div class="info">
      <div class="namecard">
        <div class="bigtile" id="bigtile"><small id="btN"></small><b id="btS"></b></div>
        <div><div class="name" id="ename"></div><span class="cat" id="ecat"></span></div>
      </div>
      <div class="readrow">
        <button class="listen" id="listen"><span class="fill"></span><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/></svg><span id="listenL"></span></button>
        <button class="iread" id="iread"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7.5.6-5.7 4.9 1.8 7.4L12 18l-6.6 3.9 1.8-7.4L1.5 9.6 9 9z"/></svg><span id="ireadL"></span></button>
      </div>
      <p class="note" id="rnote"></p>
      <div class="fact">
        <div class="words" id="factWords"></div>
        <button class="along" id="along"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span id="alongL"></span></button>
      </div>
      <div class="stats" id="stats"></div>
      <h3 id="t-shells"></h3><div class="shells" id="shells"></div>
      <h3 id="t-mols"></h3><div class="mols" id="mols"></div>
      <div class="fact moldesc" id="moldesc" hidden><div class="words" id="molWords"></div></div>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function shellsOf(z){
  const s=[0,0,0,0,0,0,0];let e=z;
  for(const[n,c]of ORDER){if(e<=0)break;const k=Math.min(c,e);s[n-1]+=k;e-=k}
  const m=MOVE[z]; if(m){s[m[0]-1]-=m[2];s[m[1]-1]+=m[2]}
  while(s.length&&!s[s.length-1])s.pop(); return s;
}

/* short facts for well-known elements: [en, ru, tr] */
const FACT={
1:["Hydrogen is the lightest element. The Sun is made mostly of hydrogen.","Водород — самый лёгкий элемент. Солнце почти целиком состоит из водорода.","Hidrojen en hafif elementtir. Güneş çoğunlukla hidrojenden oluşur."],
2:["Helium is lighter than air, so helium balloons float up.","Гелий легче воздуха, поэтому шарики с гелием летят вверх.","Helyum havadan hafiftir, bu yüzden helyum balonları yukarı uçar."],
3:["Lithium is inside the batteries of phones and tablets.","Литий есть в батарейках телефонов и планшетов.","Lityum, telefon ve tabletlerin pillerinde bulunur."],
6:["Carbon is in every living thing. Diamonds and pencil lead are both made of carbon.","Углерод есть во всём живом. И алмаз, и грифель карандаша сделаны из углерода.","Karbon her canlıda vardır. Elmas da kurşun kalemin ucu da karbondan yapılır."],
7:["Most of the air we breathe is nitrogen.","Воздух, которым мы дышим, — это в основном азот.","Soluduğumuz havanın çoğu azottur."],
8:["We need oxygen to breathe. Plants make it with the help of sunlight.","Нам нужен кислород, чтобы дышать. Растения делают его на солнечном свету.","Nefes almak için oksijene ihtiyacımız var. Bitkiler onu güneş ışığıyla üretir."],
9:["Fluorine helps keep teeth strong. It is in toothpaste.","Фтор помогает зубам быть крепкими. Он есть в зубной пасте.","Flor dişlerin güçlü kalmasına yardım eder. Diş macununda bulunur."],
10:["Neon glows bright orange-red in glass tube signs.","Неон ярко светится красно-оранжевым светом в стеклянных трубках вывесок.","Neon, tabelalardaki cam tüplerde parlak kırmızı-turuncu ışık saçar."],
11:["Sodium is half of table salt. Pure sodium is a metal so soft you can cut it with a knife.","Натрий — половина поваренной соли. Чистый натрий такой мягкий, что его режут ножом.","Sodyum sofra tuzunun yarısıdır. Saf sodyum bıçakla kesilebilen yumuşak bir metaldir."],
12:["Magnesium burns with a dazzling white light, like in fireworks.","Магний горит ослепительно белым светом, как в фейерверках.","Magnezyum, havai fişeklerdeki gibi göz kamaştırıcı beyaz bir ışıkla yanar."],
13:["Aluminium is light and shiny. Cans and kitchen foil are made of it.","Алюминий лёгкий и блестящий. Из него делают банки и фольгу.","Alüminyum hafif ve parlaktır. Kutular ve mutfak folyosu ondan yapılır."],
14:["Silicon is in sand and inside every computer chip.","Кремний есть в песке и в каждом компьютерном чипе.","Silisyum kumda ve her bilgisayar çipinde bulunur."],
15:["Phosphorus is in the strip you strike a match on. It is also in your bones.","Фосфор есть на коробке, о которую чиркают спичкой. А ещё он есть в твоих костях.","Fosfor, kibritin sürtüldüğü şeritte bulunur. Kemiklerinde de vardır."],
16:["Sulfur is yellow. It gives rotten eggs their bad smell.","Сера жёлтого цвета. Из-за неё тухлые яйца так плохо пахнут.","Kükürt sarı renklidir. Çürük yumurtanın kötü kokusu ondan gelir."],
17:["Chlorine keeps swimming pool water clean.","Хлор помогает сохранять воду в бассейне чистой.","Klor, yüzme havuzu suyunu temiz tutar."],
18:["Argon is inside some light bulbs. It joins with almost nothing.","Аргон есть внутри некоторых лампочек. Он почти ни с чем не соединяется.","Argon bazı ampullerin içinde bulunur. Neredeyse hiçbir şeyle birleşmez."],
19:["Bananas have lots of potassium.","В бананах много калия.","Muzda bol miktarda potasyum vardır."],
20:["Calcium makes your bones and teeth strong. Milk has lots of it.","Кальций делает кости и зубы крепкими. Его много в молоке.","Kalsiyum kemiklerini ve dişlerini güçlendirir. Sütte bolca bulunur."],
22:["Titanium is strong and light. It is used in planes and rockets.","Титан прочный и лёгкий. Его используют в самолётах и ракетах.","Titanyum güçlü ve hafiftir. Uçaklarda ve roketlerde kullanılır."],
26:["Iron helps your blood carry oxygen around your body. Magnets pull on iron!","Железо помогает крови переносить кислород по телу. А ещё его притягивает магнит!","Demir, kanın vücutta oksijen taşımasına yardım eder. Mıknatıslar demiri çeker!"],
28:["Nickel is in many coins.","Никель есть во многих монетах.","Nikel birçok madeni parada bulunur."],
29:["Copper is reddish. Electricity runs through copper wires.","Медь рыжеватого цвета. По медным проводам бежит электричество.","Bakır kırmızımsıdır. Elektrik bakır tellerden akar."],
30:["Zinc protects iron from rusting.","Цинк защищает железо от ржавчины.","Çinko demiri paslanmaktan korur."],
35:["Bromine is one of only two elements that are liquid at room temperature.","Бром — один из двух элементов, которые жидкие при комнатной температуре.","Brom, oda sıcaklığında sıvı olan iki elementten biridir."],
47:["Silver carries electricity better than any other metal.","Серебро проводит электричество лучше всех металлов.","Gümüş, elektriği en iyi ileten metaldir."],
50:["Tin cans are made of steel with a thin coat of tin.","Консервные банки покрывают тонким слоем олова.","Konserve kutuları ince bir kalay tabakasıyla kaplanır."],
53:["Iodine is added to salt to keep us healthy.","Иод добавляют в соль, чтобы мы были здоровыми.","Sağlıklı kalmamız için tuza iyot eklenir."],
74:["Tungsten melts at the highest temperature of all metals.","Вольфрам плавится при самой высокой температуре из всех металлов.","Tungsten, tüm metaller arasında en yüksek sıcaklıkta erir."],
78:["Platinum is a rare metal. It is used in jewellery and car parts.","Платина — редкий металл. Из неё делают украшения и детали машин.","Platin nadir bir metaldir. Takılarda ve araba parçalarında kullanılır."],
79:["Gold never rusts, so ancient gold treasure still shines today.","Золото не ржавеет, поэтому древние золотые сокровища блестят до сих пор.","Altın paslanmaz, bu yüzden eski altın hazineler bugün hâlâ parlar."],
80:["Mercury is a metal that is liquid at room temperature.","Ртуть — металл, который жидкий при комнатной температуре.","Cıva, oda sıcaklığında sıvı olan bir metaldir."],
82:["Lead is a very heavy metal. Pencil lead has no lead in it at all. It is carbon!","Свинец — очень тяжёлый и мягкий металл.","Kurşun çok ağır bir metaldir. Kurşun kalemin içinde kurşun yoktur, karbon vardır!"],
92:["Uranium is used to make electricity in nuclear power plants.","Уран используют на атомных электростанциях, чтобы получать электричество.","Uranyum, nükleer santrallerde elektrik üretmek için kullanılır."],
101:["Mendelevium is named after Dmitri Mendeleev, who made the first periodic table.","Менделевий назван в честь Дмитрия Менделеева, создателя периодической таблицы.","Mendelevyum, periyodik tabloyu oluşturan Dmitri Mendeleyev'in adını taşır."]};

}
let spkTimer=0;
function speak(text,{start,word,end}={}){
  clearInterval(spkTimer);
  if(!hasTTS){end&&end();return}
  try{speechSynthesis.cancel()}catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=LOC[S.lang];const v=voiceFor(S.lang);if(v)u.voice=v;
  u.rate=S.slow?.62:.85;u.pitch=1.05;
  let gotB=false;
  u.onstart=()=>{start&&start();
    if(word){const ws=[...text.matchAll(/\S+/g)];let i=0;const per=(S.slow?560:420);
      spkTimer=setInterval(()=>{if(gotB||i>=ws.length){clearInterval(spkTimer);return}word(ws[i++].index)},per)}};
  u.onboundary=e=>{if(e.name&&e.name!=='word')return;gotB=true;word&&word(e.charIndex)};
  u.onend=u.onerror=()=>{clearInterval(spkTimer);end&&end()};
  speechSynthesis.speak(u);
}
function karaoke(el,text){
  const spans=[...el.children];spans.forEach(s=>s.classList.remove('lit'));
  let t0=0,iv=0;
  speak(text,{start:()=>{t0=performance.now();const per=(S.slow?150:110);let i=0;clearInterval(iv);iv=setInterval(()=>{if(i<spans.length)spans[i++].classList.add('lit');else clearInterval(iv)},per)},
    end:()=>{clearInterval(iv);spans.forEach(s=>s.classList.add('lit'));setTimeout(()=>spans.forEach(s=>s.classList.remove('lit')),700)}});
}
function renderWords(box,text){
  const ws=[...text.matchAll(/\S+/g)];

}
document.addEventListener('click',e=>{
  const b=e.target.closest('.words button');if(!b)return;
  b.parentNode.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  speak(b.textContent.replace(/[.,!?:;«»“”—()]/g,''),{end:()=>b.classList.remove('on')});
});

    h+=`<button class="el c-${catOf(z)}${read.has(z)?' got':''}" data-z="${z}" style="grid-row:${r};grid-column:${c}" aria-label="${esc(nm(z))}"><small>${z}</small><b>${SYM[z-1]}</b><i>${esc(nm(z))}</i></button>`}

  $('#ptable').innerHTML=h;
  $('#legend').innerHTML=Object.keys(CAT.en).map(k=>`<button class="c-${k}" data-c="${k}">${esc(CAT[S.lang][k][1])}</button>`).join('');

}

  if(!S.read.includes(cur)){S.read.push(cur);S.stars+=1;save();toast('★ '+L().sticker);renderTable()}
  setRead(true,true);clearTimeout(rfTimer);$('#listen').disabled=false;$('#listenL').textContent=L().listen;
  karaoke($('#ename'),nm(cur));
};
$('#along').onclick=()=>readAlong($('#factWords'));
$('#mols').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  $('#mols').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  const i=+b.dataset.m;
  if(i<0){showAtom();if(molsFor(cur).length)$('#moldesc').hidden=true;return}
  const m=MOLS[i];showMol(m);$('#moldesc').hidden=false;renderWords($('#molWords'),`${m.n[S.lang]}. ${m.d[S.lang]}`);
});
function closeEl(){$('#sheet').hidden=true;document.body.style.overflow='';V.on=false;clearTimeout(rfTimer);try{speechSynthesis.cancel()}catch(e){}
  const b=document.querySelector(`.el[data-z="${cur}"]`);b&&b.focus({preventScroll:false})}
$('#back').onclick=()=>{location.hash='table'};
$('#prev').onclick=()=>{location.hash='el-'+(cur>1?cur-1:118)};
$('#next').onclick=()=>{location.hash='el-'+(cur<118?cur+1:1)};
document.addEventListener('keydown',e=>{if($('#sheet').hidden)return;if(e.key==='Escape')$('#back').click();if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});
function route(){const m=/^#el-(\d{1,3})$/.exec(location.hash);const z=m?+m[1]:0;if(z>=1&&z<=118)openEl(z);else if(!$('#sheet').hidden)closeEl()}
window.addEventListener('hashchange',route);

/* ---------- 3D viewer ---------- */
const V={on:false,zoom:1,size:3,spins:[],last:0,pts:new Map()};
const CPK={H:0xffffff,C:0x555555,N:0x3d6bff,O:0xff3b3b,F:0x7cf05a,Cl:0x3ee03e,Br:0xb33a2a,I:0x9b2fb5,S:0xffd92e,P:0xff8c1a,Na:0xb06cff,K:0x9a4fe0,B:0xffb3b3,Si:0xe6c7a0,Ca:0x7aa0a0,Mg:0x9be36b,Li:0xd08cff};
const RAD={H:.28};const BIG=['Cl','Br','I','S','P','Na','K','Ca','Si','Mg'];
function initV(){
  if(V.r)return true; if(!window.THREE){$('#nogl').hidden=false;$('#nogl').textContent=L().noGL;return false}
  try{V.r=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){$('#nogl').hidden=false;$('#nogl').textContent=L().noGL;return false}
  V.r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const box=$('#view');box.prepend(V.r.domElement);
  V.scene=new THREE.Scene();V.cam=new THREE.PerspectiveCamera(40,1,.1,200);
  V.scene.add(new THREE.HemisphereLight(0xffffff,0x334466,.85));
  const d=new THREE.DirectionalLight(0xffffff,.9);d.position.set(4,6,8);V.scene.add(d);
  V.group=new THREE.Group();V.scene.add(V.group);
  const ro=new ResizeObserver(fit);ro.observe(box);
  const el=V.r.domElement;
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);V.pts.set(e.pointerId,[e.clientX,e.clientY]);V.last=performance.now()});
  el.addEventListener('pointermove',e=>{if(!V.pts.has(e.pointerId))return;const p=V.pts.get(e.pointerId),n=[e.clientX,e.clientY];
    if(V.pts.size===1){V.group.rotation.y+=(n[0]-p[0])*.01;V.group.rotation.x+=(n[1]-p[1])*.01}
    else if(V.pts.size===2){const o=[...V.pts.entries()].find(([k])=>k!==e.pointerId)[1];const d0=Math.hypot(p[0]-o[0],p[1]-o[1]),d1=Math.hypot(n[0]-o[0],n[1]-o[1]);if(d0>0){V.zoom=Math.min(3,Math.max(.5,V.zoom*d1/d0));place()}}
    V.pts.set(e.pointerId,n);V.last=performance.now()});
  const up=e=>{V.pts.delete(e.pointerId);V.last=performance.now()};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();V.zoom=Math.min(3,Math.max(.5,V.zoom*(e.deltaY<0?1.1:.9)));place()},{passive:false});
  let prev=performance.now();
  const loop=t=>{requestAnimationFrame(loop);const dt=Math.min(.05,(t-prev)/1000);prev=t;if(!V.on)return;
    const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!still)V.spins.forEach(s=>s.g.rotation.z+=s.v*dt);
    if(!still&&!V.pts.size&&t-V.last>1500)V.group.rotation.y+=.3*dt;
    V.r.render(V.scene,V.cam)};
  requestAnimationFrame(loop);
  return true;
}
function fit(){if(!V.r)return;const b=$('#view'),w=b.clientWidth,h=b.clientHeight;if(!w||!h)return;V.r.setSize(w,h,false);V.cam.aspect=w/h;V.cam.updateProjectionMatrix();place()}
function place(){const a=V.cam.aspect||1;let d=V.size/Math.tan(20*Math.PI/180)*1.08;if(a<1)d/=a;V.cam.position.set(0,0,d/V.zoom);V.cam.lookAt(0,0,0)}
function clearV(){V.spins=[];V.group.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose()}});V.group.clear();V.group.rotation.set(.35,-.4,0);V.zoom=1}
const mat=(c,em)=>new THREE.MeshStandardMaterial({color:c,roughness:.35,metalness:.05,emissive:em||0x000000,emissiveIntensity:em?.6:0});
function showAtom(){
  const z=cur,t=L(),sh=shellsOf(z),A=Math.max(z,Math.round(+MASS[z-1]));
  $('#vtitle').textContent=`${t.atom}: ${nm(z)}`;$('#vsub').textContent=fill(t.atomSub,{p:z,ne:A-z,e:z});
  if(!initV())return;V.on=true;clearV();
  const rn=.16,R=A===1?0:rn*1.25*Math.cbrt(A);
  const g=new THREE.SphereGeometry(rn,16,12),pm=mat(0xff4d4d),nmt=mat(0xb7c0cc);
  for(let i=0;i<A;i++){const r=R*Math.cbrt((i+.5)/A),y=1-2*(i+.5)/A,rr=Math.sqrt(1-y*y),th=i*2.39996;
    const isP=Math.floor((i+1)*z/A)>Math.floor(i*z/A);
    const m=new THREE.Mesh(g,isP?pm:nmt);m.position.set(r*rr*Math.cos(th),r*y,r*rr*Math.sin(th));V.group.add(m)}
  const eg=new THREE.SphereGeometry(.085,14,10),em=mat(0x6fd3ff,0x2aa8ff),rm=new THREE.MeshBasicMaterial({color:0x7f8cff,transparent:true,opacity:.45});
  let rmax=R+.4;
  sh.forEach((n,i)=>{const r=R+.55+i*.5;rmax=r;
    const tilt=new THREE.Group();tilt.rotation.set(i*.62+.2,i*1.07,0);V.group.add(tilt);
    tilt.add(new THREE.Mesh(new THREE.TorusGeometry(r,.012,6,160),rm));
    const spin=new THREE.Group();tilt.add(spin);
    for(let k=0;k<n;k++){const a=k/n*Math.PI*2,e=new THREE.Mesh(eg,em);e.position.set(r*Math.cos(a),r*Math.sin(a),0);spin.add(e)}
    V.spins.push({g:spin,v:(i%2?-1:1)*1.1/Math.sqrt(i+1)})});
  V.size=rmax+.2;fit();
}
function label(txt){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.font='900 64px Nunito, system-ui, sans-serif';x.textAlign='center';x.textBaseline='middle';x.lineWidth=10;x.strokeStyle='rgba(10,12,30,.85)';x.strokeText(txt,64,68);x.fillStyle='#fff';x.fillText(txt,64,68);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}));s.scale.set(.55,.55,1);s.renderOrder=5;return s;
}
function showMol(m){
  $('#vtitle').textContent=m.n[S.lang];$('#vsub').textContent=m.f+' · '+fill(L().molSub,{n:m.a.length});
  if(!initV())return;V.on=true;clearV();
  const cx=m.a.reduce((s,a)=>s+a[1],0)/m.a.length,cy=m.a.reduce((s,a)=>s+a[2],0)/m.a.length,cz=m.a.reduce((s,a)=>s+a[3],0)/m.a.length;
  const P=m.a.map(a=>new THREE.Vector3(a[1]-cx,a[2]-cy,a[3]-cz));
  let rmax=0;
  m.a.forEach((a,i)=>{const r=RAD[a[0]]||(BIG.includes(a[0])?.55:.42);
    const s=new THREE.Mesh(new THREE.SphereGeometry(r,32,24),mat(CPK[a[0]]||0xff5fa2));s.position.copy(P[i]);V.group.add(s);
    const l=label(a[0]);l.position.copy(P[i]);V.group.add(l);rmax=Math.max(rmax,P[i].length()+r)});
  const bm=mat(0xd6dbef),im=new THREE.MeshBasicMaterial({color:0xaab4e8,transparent:true,opacity:.6});
  m.b.forEach(([i,j,o])=>{const a=P[i],b=P[j],dir=b.clone().sub(a),len=dir.length();dir.normalize();
    let perp=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,0,1));if(perp.length()<.1)perp.crossVectors(dir,new THREE.Vector3(0,1,0));perp.normalize();
    const n=Math.max(1,o),gap=.14;
    for(let k=0;k<n;k++){const off=perp.clone().multiplyScalar((k-(n-1)/2)*gap);
      const cyl=new THREE.Mesh(new THREE.CylinderGeometry(o?(n>1?.05:.08):.03,o?(n>1?.05:.08):.03,len,14),o?bm:im);
      cyl.position.copy(a).add(b).multiplyScalar(.5).add(off);cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);V.group.add(cyl)}});
  V.size=Math.max(1.6,rmax);fit();
}

/* ---------- boot ---------- */
applyLang();setMode('table');route();
}
</script>
