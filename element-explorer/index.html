const ORGT={
membrane:{name:["Cell membrane","Клеточная мембрана","Hücre zarı"],job:["The gate","Ворота","Kapı"],
easy:["A thin skin around the cell. It lets good things in and sends waste out.","Тонкая плёнка вокруг клетки. Она впускает нужное и выпускает лишнее.","Hücreyi saran ince bir zar. İyi şeyleri içeri alır, atıkları dışarı atar."],
sci:["A double layer of lipids with proteins in it. It is selectively permeable: it chooses which substances may enter or leave.","Двойной слой липидов с белками. Мембрана избирательно проницаема: она решает, какие вещества впустить, а какие выпустить.","Proteinler içeren çift katlı bir yağ (lipit) tabakasıdır. Seçici geçirgendir: hangi maddelerin girip çıkacağını seçer."]},
wall:{name:["Cell wall","Клеточная стенка","Hücre duvarı"],job:["Strong wall","Крепкая стена","Sağlam duvar"],
easy:["A strong box around a plant cell. It helps plants stand up tall.","Крепкая коробка вокруг клетки растения. Она помогает растению стоять прямо.","Bitki hücresini saran sağlam bir kutu. Bitkinin dik durmasına yardım eder."],
sci:["Found in plant cells, outside the membrane. It is made of cellulose and gives the cell shape, support and protection.","Есть у клеток растений, снаружи от мембраны. Она состоит из целлюлозы и придаёт клетке форму, прочность и защиту.","Bitki hücrelerinde, hücre zarının dışında bulunur. Selülozdan yapılmıştır; hücreye şekil, destek ve koruma sağlar."]},
cytoplasm:{name:["Cytoplasm","Цитоплазма","Sitoplazma"],job:["The jelly","Желе","Jöle"],
easy:["A soft jelly that fills the cell. All the parts float in it.","Мягкое желе внутри клетки. В нём плавают все части клетки.","Hücreyi dolduran yumuşak bir jöle. Bütün parçalar onun içinde yüzer."],
sci:["A watery gel between the membrane and the nucleus. Many chemical reactions happen here, and a network of protein fibers (the cytoskeleton) holds organelles in place.","Водянистый гель между мембраной и ядром. Здесь идут многие химические реакции, а органоиды держатся на сети белковых нитей (цитоскелете).","Hücre zarı ile çekirdek arasındaki sulu, jöle kıvamında maddedir. Birçok kimyasal tepkime burada olur; organeller hücre iskeleti denen protein ağıyla yerinde tutulur."]},
nucleus:{name:["Nucleus","Ядро","Çekirdek"],job:["The boss","Начальник","Yönetici"],
easy:["The boss of the cell. It keeps the instructions that tell the cell what to do.","Главная часть клетки. В ядре хранятся инструкции, что клетке делать.","Hücrenin yöneticisi. Hücreye ne yapacağını söyleyen talimatları saklar."],
sci:["Holds the DNA, the cell's genetic instructions, inside a double membrane called the nuclear envelope. It controls the cell's activity and growth.","Хранит ДНК — наследственную информацию клетки. Ядро окружено двойной оболочкой и управляет жизнью и ростом клетки.","Hücrenin kalıtım bilgisi olan DNA'yı çift katlı çekirdek zarının içinde saklar. Hücrenin faaliyetlerini ve büyümesini yönetir."]},
mito:{name:["Mitochondria","Митохондрии","Mitokondri"],job:["Power station","Электростанция","Enerji santrali"],
easy:["The power stations. They turn food into energy so the cell can work.","Электростанции клетки. Они превращают пищу в энергию для работы.","Hücrenin enerji santrali. Besinleri hücrenin kullanacağı enerjiye çevirir."],
sci:["In cellular respiration, mitochondria use glucose and oxygen to make ATP, the cell's energy currency. They even have their own DNA.","При клеточном дыхании митохондрии используют глюкозу и кислород и получают АТФ — главный источник энергии клетки. У них есть своя ДНК.","Hücresel solunumda glikoz ve oksijeni kullanarak hücrenin enerji kaynağı olan ATP'yi üretir. Kendine ait DNA'sı da vardır."]},
ribo:{name:["Ribosomes","Рибосомы","Ribozom"],job:["Tiny factories","Крошечные фабрики","Minik fabrikalar"],
easy:["Tiny factories. They build proteins, the building blocks the cell needs.","Крошечные фабрики. Они делают белки — детали, из которых строится клетка.","Minik fabrikalar. Hücrenin ihtiyaç duyduğu proteinleri üretir."],
sci:["Ribosomes read mRNA, a copy of a gene, and link amino acids together into proteins. Some float freely; others sit on the rough ER.","Рибосомы читают мРНК — копию гена — и соединяют аминокислоты в белок. Одни плавают свободно, другие сидят на шероховатой ЭПС.","Ribozomlar bir genin kopyası olan mRNA'yı okur ve amino asitleri birleştirerek protein yapar. Bazıları serbestçe yüzer, bazıları granüllü ER'nin üzerinde bulunur."]},
er:{name:["Endoplasmic reticulum","Эндоплазматическая сеть","Endoplazmik retikulum"],job:["Roads","Дороги","Yollar"],
easy:["A maze of roads inside the cell. Things move along it from place to place.","Сеть дорожек внутри клетки. По ней вещества перемещаются с места на место.","Hücrenin içindeki yollar ağı. Maddeler bu yollarda bir yerden bir yere taşınır."],
sci:["A network of folded membranes. Rough ER is covered with ribosomes and makes proteins; smooth ER makes lipids and helps remove harmful substances.","Сеть мембранных каналов. Шероховатая ЭПС покрыта рибосомами и делает белки, а гладкая ЭПС делает липиды и обезвреживает вредные вещества.","Zarlardan oluşan bir kanal ağıdır. Granüllü ER ribozomlarla kaplıdır ve protein üretir; granülsüz ER yağ (lipit) üretir ve zararlı maddeleri temizlemeye yardım eder."]},
golgi:{name:["Golgi apparatus","Аппарат Гольджи","Golgi cisimciği"],job:["Post office","Почта","Postane"],
easy:["The post office. It packs things into little bags and sends them out.","Почта клетки. Она упаковывает вещества в маленькие пузырьки и отправляет их.","Hücrenin postanesi. Maddeleri küçük keseciklere paketler ve gönderir."],
sci:["Receives proteins from the ER, then modifies, sorts and packages them into vesicles that carry them around the cell or out of it.","Получает белки из ЭПС, дорабатывает, сортирует и упаковывает их в пузырьки, которые везут их по клетке или наружу.","ER'den gelen proteinleri alır, değiştirir, sınıflandırır ve keseciklere paketler. Kesecikler bu maddeleri hücrenin içine ya da dışına taşır."]},
lyso:{name:["Lysosomes","Лизосомы","Lizozom"],job:["Cleaners","Уборщики","Temizlikçiler"],
easy:["The cleaners. They break down old parts and trash so they can be used again.","Уборщики клетки. Они разбирают старые части и мусор, чтобы всё пошло в дело.","Hücrenin temizlikçileri. Eski parçaları ve atıkları parçalayıp geri dönüştürür."],
sci:["Small sacs filled with digestive enzymes. They break down worn-out organelles, food particles and germs. They are found mainly in animal cells.","Маленькие пузырьки с пищеварительными ферментами. Они расщепляют старые органоиды, частицы пищи и микробов. Есть в основном в клетках животных.","Sindirim enzimleriyle dolu küçük keseciklerdir. Yıpranmış organelleri, besin parçacıklarını ve mikropları parçalar. Daha çok hayvan hücrelerinde bulunur."]},
vacuole:{name:["Vacuole","Вакуоль","Koful"],job:["Storage tank","Хранилище","Depo"],
easy:["A storage tank. Plant cells have one big one full of water.","Хранилище клетки. У растений есть одна большая вакуоль с водой.","Hücrenin deposu. Bitki hücrelerinde suyla dolu büyük bir koful vardır."],
sci:["Stores water, food and waste. A plant cell's large central vacuole pushes on the wall and keeps the cell firm (turgor). Animal cells have small vacuoles.","Запасает воду, питательные вещества и отходы. Большая центральная вакуоль растений давит на стенку и делает клетку упругой (тургор). У животных вакуоли маленькие.","Su, besin ve atık maddeleri depolar. Bitki hücresindeki büyük koful, hücre duvarına baskı yaparak hücreyi diri tutar (turgor basıncı). Hayvan hücrelerinde kofullar küçüktür."]},
chloro:{name:["Chloroplasts","Хлоропласты","Kloroplast"],job:["Solar kitchen","Солнечная кухня","Güneş mutfağı"],
easy:["Green solar kitchens. They use sunlight, water and air to make sugar for the plant.","Зелёные солнечные кухни. С помощью света, воды и воздуха они готовят сахар для растения.","Yeşil güneş mutfakları. Güneş ışığı, su ve havayı kullanarak bitki için şeker yapar."],
sci:["Contain green chlorophyll and carry out photosynthesis: using light energy, they turn carbon dioxide and water into glucose and oxygen. Found in plants and algae.","Содержат зелёный хлорофилл и проводят фотосинтез: с помощью энергии света превращают углекислый газ и воду в глюкозу и кислород. Есть у растений и водорослей.","Yeşil renkli klorofil içerir ve fotosentez yapar: ışık enerjisiyle karbondioksit ve suyu glikoz ve oksijene dönüştürür. Bitki ve alg hücrelerinde bulunur."]},
centri:{name:["Centrioles","Центриоли","Sentrozom"],job:["Splitting helpers","Помощники деления","Bölünme yardımcıları"],
easy:["Little helpers. When the cell splits in two, they help share the instructions fairly.","Маленькие помощники. Когда клетка делится надвое, они помогают поровну разделить инструкции.","Küçük yardımcılar. Hücre ikiye bölünürken talimatları eşit paylaştırmaya yardım eder."],
sci:["A pair of tube-shaped structures near the nucleus in animal cells. During cell division they organize the spindle fibers that pull chromosomes apart.","Пара трубчатых телец возле ядра в клетках животных. При делении клетки они помогают построить веретено деления, которое растаскивает хромосомы.","Hayvan hücrelerinde çekirdeğin yanında bulunur ve iki silindir biçimli sentriolden oluşur. Hücre bölünmesinde kromozomları ayıran iğ ipliklerini düzenler."]}
};
const CELLT={
whatT:["What is a cell?","Что такое клетка?","Hücre nedir?"],
what:["Every living thing is made of cells. Cells are so tiny that you need a microscope to see them. Your body has trillions of them, and each one is like a tiny busy city.","Всё живое состоит из клеток. Клетки такие крошечные, что их видно только в микроскоп. В твоём теле триллионы клеток, и каждая похожа на маленький город, где все заняты делом.","Bütün canlılar hücrelerden oluşur. Hücreler o kadar küçüktür ki onları ancak mikroskopla görebiliriz. Vücudunda trilyonlarca hücre var ve her biri küçük, hareketli bir şehir gibidir."],
diffT:["Plant cell or animal cell?","Клетка растения или животного?","Bitki hücresi mi, hayvan hücresi mi?"],
diff:["Both have a membrane, cytoplasm, a nucleus and mitochondria. Plant cells also have a strong cell wall, green chloroplasts that make food from sunlight, and one big vacuole full of water. Animal cells are rounder and softer, and they have centrioles and lysosomes.","У обеих есть мембрана, цитоплазма, ядро и митохондрии. А у клетки растения есть ещё крепкая клеточная стенка, зелёные хлоропласты, которые делают пищу из солнечного света, и одна большая вакуоль с водой. Клетки животных круглее и мягче, в них есть центриоли и лизосомы.","İkisinde de hücre zarı, sitoplazma, çekirdek ve mitokondri bulunur. Bitki hücresinde ayrıca sağlam bir hücre duvarı, güneş ışığıyla besin yapan yeşil kloroplastlar ve suyla dolu büyük bir koful vardır. Hayvan hücreleri daha yuvarlak ve yumuşaktır; sentrozom ve lizozom içerir."],
lookT:["How do we see cells?","Как увидеть клетки?","Hücreleri nasıl görürüz?"],
look:["We look at cells with a microscope, which makes tiny things look much bigger. Try a thin piece of onion skin or a gentle scrape from inside your cheek!","Клетки рассматривают в микроскоп: он делает крошечное большим. Попробуй посмотреть на тонкую кожицу лука или на клетки с внутренней стороны щеки!","Hücreleri, küçük şeyleri çok büyük gösteren mikroskopla inceleriz. İnce bir soğan zarına ya da yanağının iç yüzeyinden alınan hücrelere bakmayı dene!"]
};

let spkTimer=0;
function speak(text,{start,word,end}={}){
  clearInterval(spkTimer);
  if(!hasTTS){end&&end();return}
  try{speechSynthesis.cancel()}catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=LOC[S.lang];const v=voiceFor(S.lang);if(v)u.voice=v;
  u.rate=S.slow?.62:.85;u.pitch=1.05;

      spkTimer=setInterval(()=>{if(gotB||i>=ws.length){clearInterval(spkTimer);return}word(ws[i++].index)},per)}};
  u.onboundary=e=>{if(e.name&&e.name!=='word')return;gotB=true;word&&word(e.charIndex)};
  u.onend=u.onerror=()=>{clearInterval(spkTimer);end&&end()};

  const prompt=role==='kid'?`<span class="qp">${esc(t.duFind)}</span><div class="qword${useSyl()?' sy':''}">${useSyl()?sylText(nm(q.z)):esc(nm(q.z))}</div>`
    :`<span class="qp">${esc(q.at==='num'?t.duNum:t.duSym)}</span><div class="qword">${q.at==='num'?q.z:SYM[q.z-1]}</div>`;
  const cls=z=>(done&&z===q.z?' right':'')+(DU.pick[p]===z&&z!==q.z?' no':'');
  const ch=role==='kid'?q.kid.map(z=>`<button class="duc el c-${catOf(z)}${cls(z)}" data-p="${p}" data-z="${z}" ${lk||done?'disabled':''}><small>${z}</small><b>${SYM[z-1]}</b><i>${esc(nm(z))}</i></button>`)
    :q.adult.map(z=>`<button class="duc dua${cls(z)}" data-p="${p}" data-z="${z}" ${lk||done||wait?'disabled':''}>${esc(nm(z))}</button>`);
  const msg=done?(DU.won===p?t.duWin:DU.won===-1?t.duNone:t.duLose):lk?t.duWrong:wait?t.duWait:'';
  return `<div class="duhalf ${role}${DU.won===p?' won':''}"><div class="dutop"><b>${esc(duName(p))}</b><span>★ ${DU.sc[p]}</span></div>${prompt}<div class="duch ${role}">${ch.join('')}</div><div class="dumsg">${esc(msg)}</div>${wait?`<div class="duwbar"><i style="animation-duration:${(DU.head*1000-(Date.now()-DU.t0))/1000}s"></i></div>`:''}</div>`}
function duStart(seed){DU.qs=makeQs(seed);DU.qi=0;DU.sc=[0,0];DU.err='';duRound()}
function duRound(){DU.lock=[false,false];DU.won=-1;DU.pick=[null,null];DU.t0=Date.now();DU.st='play';if(panel==='duel')renderDuel()}
function duApplyAnswer(p,z){const q=DU.qs[DU.qi];if(DU.won!==-1||DU.lock[p])return false;DU.pick[p]=z;if(z===q.z){DU.won=p;DU.sc[p]++}else DU.lock[p]=true;return true}
function duOver(){return DU.won!==-1||DU.lock.every(Boolean)}
function duAfter(){
  if(!duOver())return;
  if(DU.won!==-1&&!DU.net&&DU.roles[DU.won]==='kid'||DU.net&&DU.won===DU.me){S.stars+=1;save();progress()}
  if(DU.net&&!DU.host)return;
  setTimeout(()=>{const end=DU.qi>=DU.qs.length-1;
    if(DU.net)DU.net.emit('duel.n',{qi:DU.qi+1,end}).catch(()=>{});else duNext(DU.qi+1,end)},1800)}
function duNext(qi,end){if(end){DU.st='end';renderDuel();return}DU.qi=qi;duRound()}
$('#du-box').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const rp=b.closest('[data-rp]');if(rp&&b.dataset.role){DU.roles[+rp.dataset.rp]=b.dataset.role;renderDuel();return}
  if(b.dataset.h!==undefined&&b.closest('#du-head')){DU.head=+b.dataset.h;renderDuel();return}
  if(b.id==='du-local'){duLeave();duStart(Date.now());return}
  if(b.id==='du-cancel'){duLeave();DU.st='setup';renderDuel();return}
  if(b.id==='du-again'){if(DU.net)DU.net.emit('duel.start',{seed:1+Math.floor(Math.random()*1e9),roles:DU.roles,head:DU.head}).catch(()=>{});else duStart(Date.now());return}
  if(b.id==='du-create'){DU.code=String(1000+Math.floor(Math.random()*9000));await duJoin(true);return}
  if(b.id==='du-joinGo'){const c=($('#du-code').value||'').replace(/\D/g,'');if(c.length!==4){DU.err=L().duBadCode;renderDuel();return}DU.code=c;await duJoin(false);return}
  if(b.classList.contains('duc')){const p=+b.dataset.p,z=+b.dataset.z,q=DU.qs[DU.qi];if(DU.roles[p]==='adult'&&Date.now()-DU.t0<DU.head*1000)return;
    if(DU.net){if(p!==DU.me||DU.won!==-1||DU.lock[p])return;DU.net.emit('duel.a',{i:DU.qi,z}).catch(()=>{});return}
    if(duApplyAnswer(p,z)){renderDuel();duAfter()}}
});

function duLeave(){if(DU.net){try{DU.net.leave()}catch(_){}}DU.net=null;DU.host=false}
async function duJoin(host){
  const t=L();DU.err='';let r;
  try{if(ROOM)r=await ROOM.join('duel-'+DU.code);else{for(let k=0;;k++){try{r=await peerTransport(DU.code,host);break}catch(e){if(host&&k<3&&e&&e.type==='unavailable-id'){DU.code=String(1000+Math.floor(Math.random()*9000));continue}throw e}}}}
  catch(e){DU.err=e&&e.type==='peer-unavailable'?t.duNoGame:t.duNetFail;DU.net=null;renderDuel();return}
  DU.net=r;DU.host=host;DU.me=host?0:1;DU.st='wait';renderDuel();
  const myRole=DU.roles[0];
  r.presence({role:myRole,host}).catch(()=>{});
  const others=()=>r.peers().filter(x=>!x.isMe&&x.presence&&(x.presence.role==='kid'||x.presence.role==='adult'));
  r.onPeers(()=>{const o=others();
    if(DU.host&&DU.st==='wait'&&o.length){DU.roles=[myRole,o[0].presence.role];r.emit('duel.start',{seed:1+Math.floor(Math.random()*1e9),roles:DU.roles,head:DU.head}).catch(()=>{})}
    if(DU.st==='play'&&!o.length){duLeave();DU.st='setup';DU.err=t.duLeft;renderDuel()}});
  r.on('duel.start',m=>{const d=m.data||{},ro=Array.isArray(d.roles)?d.roles:[];if(!m.isMe&&DU.host)return;
    DU.roles=[ro[0]==='adult'?'adult':'kid',ro[1]==='adult'?'adult':'kid'];DU.head=[0,3,6].includes(d.head)?d.head:3;duStart(+d.seed||1)});
  r.on('duel.a',m=>{if(!DU.host)return;const d=m.data||{};if(d.i!==DU.qi)return;const p=m.isMe?0:1,z=+d.z;if(!(z>=1&&z<=118))return;
    if(DU.roles[p]==='adult'&&Date.now()-DU.t0<DU.head*1000-400)return;
    if(duApplyAnswer(p,z)){r.emit('duel.r',{i:DU.qi,won:DU.won,lock:DU.lock,sc:DU.sc,pick:DU.pick}).catch(()=>{});renderDuel();duAfter()}});
  r.on('duel.r',m=>{if(DU.host)return;const d=m.data||{};if(d.i!==DU.qi)return;
    const n=v=>v===0||v===1?v:-1;DU.won=n(d.won);DU.lock=(Array.isArray(d.lock)?d.lock:[0,0]).slice(0,2).map(Boolean);DU.sc=(Array.isArray(d.sc)?d.sc:[0,0]).slice(0,2).map(v=>Math.max(0,Math.min(10,v|0)));
    DU.pick=(Array.isArray(d.pick)?d.pick:[null,null]).slice(0,2).map(v=>v>=1&&v<=118?v|0:null);renderDuel();duAfter()});
  r.on('duel.n',m=>{const d=m.data||{};if(d.end){DU.st='end';renderDuel();return}if((d.qi|0)===DU.qi+1)duNext(d.qi|0,false)});
}

/* ---------- two devices without Claude: WebRTC peer to peer (PeerJS only introduces the devices) ---------- */
function peerTransport(code,host){return new Promise((res,rej)=>{
  const id='elx-duel-'+code,hs={},pcb=[],mine={};let conn=null,theirs=null,done=false;
  const fire=()=>pcb.forEach(f=>{try{f()}catch(e){}});
  const deliver=(m,isMe)=>(hs[m.topic]||[]).forEach(h=>h({topic:m.topic,data:m.data,isMe,sameTab:isMe}));
  let peer;
  const api={emit:(topic,data)=>{const m={topic,data};deliver(m,true);if(conn&&conn.open)conn.send(m);return Promise.resolve()},
    on:(topic,h)=>{(hs[topic]=hs[topic]||[]).push(h);return()=>{}},
    presence:p=>{Object.assign(mine,p);if(conn&&conn.open)conn.send({topic:'_p',data:mine});return Promise.resolve()},
    peers:()=>[{isMe:true,presence:mine}].concat(theirs?[{isMe:false,presence:theirs}]:[]),
    onPeers:f=>{pcb.push(f);return()=>{}},
    leave:()=>{try{conn&&conn.close()}catch(e){}try{peer.destroy()}catch(e){}return Promise.resolve()}};
  const wire=c=>{conn=c;c.on('open',()=>{c.send({topic:'_p',data:mine});fire()});
    c.on('data',m=>{if(!m||typeof m!=='object'||typeof m.topic!=='string')return;if(m.topic==='_p'){theirs=m.data&&typeof m.data==='object'?m.data:{};fire();return}deliver(m,false)});
    c.on('close',()=>{theirs=null;conn=null;fire()})};
  try{peer=host?new window.Peer(id):new window.Peer()}catch(e){rej(e);return}
  peer.on('error',e=>{if(!done){done=true;try{peer.destroy()}catch(_){}rej(e)}});
  peer.on('open',()=>{
    if(host){peer.on('connection',c=>{if(conn){c.close();return}wire(c)});done=true;res(api);return}
    const c=peer.connect(id,{reliable:true});wire(c);
    c.on('open',()=>{if(!done){done=true;res(api)}});
    setTimeout(()=>{if(!done){done=true;try{peer.destroy()}catch(_){}rej({type:'peer-unavailable'})}},15000)});
})}

async function arStart(){
  if(!initV())return;const r=V.r,ov=$('#arOv');
  try{AR.s=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:ov}})}catch(e){toast(L().arNo);return}

  r.xr.enabled=true;r.xr.setReferenceSpaceType('local');await r.xr.setSession(AR.s);

  const ret=new THREE.Mesh(new THREE.RingGeometry(.05,.065,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff}));ret.matrixAutoUpdate=false;ret.visible=false;V.scene.add(ret);AR.ret=ret;

  AR.s.addEventListener('end',arEnd);
  let last=0;
  r.setAnimationLoop((t,frame)=>{const dt=last?Math.min(.05,(t-last)/1000):.016;last=t;
    if(frame&&AR.hit){const res=frame.getHitTestResults(AR.hit);if(res.length){const pose=res[0].getPose(r.xr.getReferenceSpace());ret.visible=true;ret.matrix.fromArray(pose.transform.matrix)}else ret.visible=false}
    V.spins.forEach(s=>s.g.rotation.z+=s.v*dt);V.tick.forEach(f=>f(t/1000));V.group.rotation.y+=.3*dt;r.render(V.scene,V.cam)});
}
function arEnd(){const r=V.r;r.setAnimationLoop(null);r.xr.enabled=false;
  if(AR.ret){V.scene.remove(AR.ret);AR.ret.geometry.dispose();AR.ret.material.dispose();AR.ret=null}
  if(AR.saved){V.group.position.copy(AR.saved.p);V.group.scale.copy(AR.saved.s);V.group.rotation.copy(AR.saved.r)}V.group.visible=true;
  AR.hit=null;AR.s=null;$('#arOv').hidden=true;fit()}

  if(!MV.parts){MV.parts=[];const cols=8;for(let i=0;i<N;i++){const lx=W*.2+(i%cols)*(r*2.3),ly=H-r*1.5-Math.floor(i/cols)*(r*2.3);MV.parts.push({x:lx,y:ly,lx,ly,vx:0,vy:0})}}

    const T=MV.temp,st=mState(T),sp=(T+40)/40;ctx.clearRect(0,0,W,H);
    for(const p of MV.parts){
      if(st==='solid'){p.x+=(p.lx-p.x)*.2+(Math.random()-.5)*sp*1.2;p.y+=(p.ly-p.y)*.2+(Math.random()-.5)*sp*1.2;p.vx=p.vy=0}
      else{const v=st==='gas'?sp*3:sp*1.1;p.vx+=(Math.random()-.5)*v;p.vy+=(Math.random()-.5)*v+(st==='liquid'?.25:0);const lim=st==='gas'?v*4:v*1.6;p.vx=Math.max(-lim,Math.min(lim,p.vx));p.vy=Math.max(-lim,Math.min(lim,p.vy));

      ctx.beginPath();ctx.arc(p.x-r*.35,p.y-r*.55,r*.32,0,7);ctx.arc(p.x+r*.35,p.y-r*.55,r*.32,0,7);ctx.fillStyle='#fff';ctx.fill()}};

    for(let i=0;i<w.length;i++){const rr=r+(d?i:0),cc=c+(d?0:i),g=grid.get(key(rr,cc));
      if(g){if(g!==w[i])return -1;cross++}else if(grid.has(d?key(rr,cc-1):key(rr-1,cc))||grid.has(d?key(rr,cc+1):key(rr+1,cc)))return -1}
    return cross};
  const put=(x,W,r,c,d)=>{for(let i=0;i<W.length;i++)grid.set(key(r+(d?i:0),c+(d?0:i)),W[i]);placed.push({...x,W,r,c,d})};
  for(const x of pool){if(placed.length>=7)break;const W=UP(x.w);
    if(!placed.length){put(x,W,0,0,0);continue}
    let best=null;
    for(const p of placed)for(let i=0;i<p.W.length;i++)for(let j=0;j<W.length;j++){if(p.W[i]!==W[j])continue;const d=1-p.d,r=p.r+(p.d?i:0)-(d?j:0),c=p.c+(p.d?0:i)-(d?0:j),f=fits(W,r,c,d);
      if(f>0&&(!best||f>best.f||(f===best.f&&Math.random()<.4)))best={r,c,d,f}}

  const boxes=[...R.W].map((ch,i)=>`<span class="rbox${R.done?' ok':''}">${esc(R.fill[i]||'')}</span>`).join('');
  $('#pz-body').innerHTML=`<section class="tstage"><div class="tfig"><p class="qp rlead">${esc(p.rebusP)}</p><div class="rrow">${R.parts.map(card).join('<span class="rplus">+</span>')}</div>
     <p class="rlegend"><span class="rbadge first">▶</span> ${esc(p.first)} · <span class="rbadge last">◀</span> ${esc(p.last)}</p><div class="rboxes">${boxes}</div></div>
   <div class="tcard"><div class="prompt">${R.hint>=1?`<div class="words" id="pz-cat" data-text="${esc(p['cat_'+R.x.cat])}">${wordsHTML(p['cat_'+R.x.cat])}</div>`:`<span class="qp">${esc(p.rebusP)}</span>`}
     <div class="row">${R.done?`<button class="pill" id="pz-newr">${esc(p.newP)}</button>`:`<button class="pill alt" id="pz-rhint" ${R.hint>=3?'disabled':''}><svg class="ic" aria-hidden="true"><use href="#i-lightbulb"/></svg>${esc(p.hint)}${R.hint?' · '+R.hint+'/3':''}</button>`}</div></div>
     ${R.done?`<div class="prompt">${bigWord(R.x.w)}</div>`:`<div class="bank">${R.bank.map((ch,i)=>`<button data-rch="${i}">${esc(ch)}</button>`).join('')}<button data-rdel="1" aria-label="⌫"><svg class="ic" aria-hidden="true"><use href="#i-delete"/></svg></button></div>`}
     <div class="msg ${PZ.ok?'ok':'bad'}">${esc(PZ.msg)}</div></div></section>`}
function rebusInput(ch){const R=PZ.rb;if(R.done||R.fill.length>=R.W.length)return;R.fill.push(ch);
  if(R.fill.length===R.W.length){if(R.fill.join('')===R.W){R.done=true;tStar(Math.max(1,3-R.hint));PZ.msg=PL().solved;PZ.ok=true;say('',R.x.w)}else{PZ.msg=PL().tryAgain;PZ.ok=false;R.fill=[]}}
  renderPuzzles()}
function renderPuzzles(){const p=PL();
  if(!$('#pz-modes')||$('#pz-modes').dataset.lang!==S.lang){$('#tp-puzzles').innerHTML=modeBar('pz-modes',[['cross','grid-3x3',p.cross],['rebus','image',p.rebus]],PZ.mode)+`<div id="pz-body"></div>`;$('#pz-modes').dataset.lang=S.lang}
  document.querySelectorAll('#pz-modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===PZ.mode));
  if(PZ.mode==='cross'){if(!PZ.words.length||PZ.lang!==S.lang){PZ.lang=S.lang;buildCross();PZ.bank=bankFor(PZ.words[0].W)}renderCross()}
  else{if(!PZ.rb||PZ.rlang!==S.lang){PZ.rlang=S.lang;buildRebus()}renderRebus()}}
$('#tp-puzzles').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.closest('#pz-modes')){PZ.mode=b.dataset.v;PZ.msg='';renderPuzzles();return}
  if(b.id==='pz-new'){buildCross();PZ.bank=bankFor(PZ.words[0].W);renderPuzzles();return}
  if(b.id==='pz-newr'){buildRebus();renderPuzzles();return}
  if(b.id==='pz-hint'){crossHint();return}
  if(b.id==='pz-rhint'){PZ.rb.hint=Math.min(3,PZ.rb.hint+1);renderPuzzles();return}
  if(b.dataset.wi){selWord(+b.dataset.wi);return}
  if(b.dataset.k){const i=PZ.words.findIndex(w=>wCells(w).includes(b.dataset.k)&&!w.done);if(i>=0&&i!==PZ.sel)selWord(i);return}
  if(b.dataset.ch!==undefined){crossInput(PZ.bank[+b.dataset.ch]);return}
  if(b.dataset.del){crossDel();return}
  if(b.dataset.rch!==undefined){rebusInput(PZ.rb.bank[+b.dataset.rch]);return}
  if(b.dataset.rdel){PZ.rb.fill.pop();PZ.msg='';renderPuzzles()}});
TOPIC_RENDER.puzzles=renderPuzzles;
if(location.search.includes('debug')){window.__pz=()=>PZ;window.__rb=()=>{buildRebus();return PZ.rb.W}}

/* ---------- sheet panels ---------- */
let panel='';
function showPanel(name,view){panel=name;const sh=$('#sheet');sh.dataset.p=name;sh.hidden=false;document.body.style.overflow='hidden';sh.classList.toggle('noview',!view);
  ['info','build','mbuild','home','heavy','grown','shellsx','duel','lab'].forEach(p=>{$('#'+p).hidden=p!==name});$('#nav').hidden=name!=='info';if(!view)V.on=false;
  markModes(name==='info'?mode:'');sh.scrollTop=0;sh.classList.remove('barup');hideTip()}
$('#shelf').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)location.hash=b.dataset.go});
const zOf=e=>SYM.indexOf(e)+1;
const hex=e=>'#'+(CPK[e]??0xff5fa2).toString(16).padStart(6,'0');
const inkOn=e=>{const c=CPK[e]??0xff5fa2,l=.299*(c>>16)+.587*((c>>8)&255)+.114*(c&255);return l<140?'#fff':'#14162a'};

/* ---------- build a molecule ---------- */
const MB_EASY=['H2O','CO2','CH4','NH3','O2','H2','N2','HCl','NaCl','CO','H2S','O3','HF','Cl2','H2O2','C2H2'];
const MB_SCI=['C2H5OH','H2SO4','C6H6','SF6','BF3','SiH4','P4','KCl','MgO','CaO','LiF','Br2','I2'];
const parseF=f=>{const c={};for(const[,e,n]of f.matchAll(/([A-Z][a-z]?)(\d*)/g))c[e]=(c[e]||0)+(+n||1);return c};
const fmtF=f=>f.replace(/(\d+)/g,'<sub>$1</sub>')+' = '+Object.entries(parseF(f)).map(([e,n])=>`${n} ${e}`).join(' + ');
const MB={goal:null,tray:{},done:false,showF:false,pal:[]};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function openMB(){showPanel('mbuild',true);if(!MB.goal)newMB();else renderMB()}
function newMB(){const pool=S.sci?MB_EASY.concat(MB_SCI):MB_EASY;let f;do f=pool[Math.floor(Math.random()*pool.length)];while(MB.goal&&f===MB.goal.f);
  MB.goal=MOLS.find(m=>m.f===f);MB.tray={};MB.done=false;MB.showF=false;
  const need=Object.keys(parseF(f)),extra=shuffle(['H','C','N','O','Cl','Na','S'].filter(e=>!need.includes(e))).slice(0,Math.max(2,5-need.length));
  MB.pal=shuffle(need.concat(extra));renderMB()}
function renderMB(){
  const t=L(),g=MB.goal,need=parseF(g.f),m=$('#m-msg');
  setWord($('#m-goal'),g.n[S.lang]);
  $('#m-formula').innerHTML=MB.showF?fmtF(g.f):esc(t.showF);
  $('#m-pal').innerHTML=MB.pal.map(e=>`<button class="atomb" data-a="${e}" style="--c:${hex(e)};color:${inkOn(e)}">${e}<small>${esc(nm(zOf(e)))}</small></button>`).join('');
  const tr=Object.entries(MB.tray).filter(([,n])=>n>0);
  $('#m-tray').innerHTML=tr.length?tr.map(([e,n])=>`<button data-r="${e}"><i style="--c:${hex(e)}"></i>${e} × ${n} <span aria-hidden="true">−</span></button>`).join(''):`<span class="help">${esc(t.trayEmpty)}</span>`;
  const ok=Object.keys(need).every(e=>MB.tray[e]===need[e])&&tr.every(([e])=>need[e]);
  if(ok){m.textContent=t.goalDone.split(/[!.]/)[0]+'!';m.className='bmsg ok';
    const txt=`${g.n[S.lang]}. ${g.d[S.lang]}`;$('#m-desc').hidden=false;renderWords($('#m-words'),txt);showMol(g);
    if(!MB.done){MB.done=true;S.stars+=2;if(!S.mols.includes(g.f))S.mols.push(g.f);save();progress();toast('★ +2');say(`mol/${S.lang}/${g.f}`,txt)}}
  else{$('#m-desc').hidden=true;const over=tr.find(([e,n])=>!need[e]||n>need[e]);m.textContent=over?fill(t.tooMany,{x:nm(zOf(over[0]))}):'';m.className='bmsg';drawLoose()}
}
function drawLoose(tray=MB.tray,title=MB.goal.n[S.lang]+' ?'){
  const list=[];Object.entries(tray).forEach(([e,n])=>{for(let i=0;i<n;i++)list.push(e)});
  $('#vtitle').textContent=title;$('#vsub').textContent=fill(L().molSub,{n:list.length});
  if(!initV())return;V.on=true;clearV(true);
  const R=list.length>1?1.1+list.length*.09:0;
  list.forEach((e,i)=>{const r=RAD[e]||(BIG.includes(e)?.55:.42),a=i/Math.max(1,list.length)*Math.PI*2;
    const s=new THREE.Mesh(new THREE.SphereGeometry(r,28,20),mat(CPK[e]||0xff5fa2));s.position.set(R*Math.cos(a),R*Math.sin(a)*.7,R*Math.sin(a)*.5);V.group.add(s);
    const l=label(e);l.position.copy(s.position);V.group.add(l)});
  V.size=2.4;fit();
}
$('#m-pal').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||MB.done)return;const a=b.dataset.a;if((MB.tray[a]||0)<12){MB.tray[a]=(MB.tray[a]||0)+1;renderMB()}});
$('#m-tray').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b||MB.done)return;MB.tray[b.dataset.r]--;renderMB()});
$('#m-formula').onclick=()=>{MB.showF=!MB.showF;renderMB()};
$('#m-new').onclick=newMB;

/* ---------- find it at home ---------- */
const HM={list:null};
function openHome(){showPanel('home',false);if(!HM.list)newHunt();else renderHome()}
function newHunt(){const idx=shuffle(HOME.map((_,i)=>i)),nf=idx.filter(i=>!S.found.includes(i));HM.list=(nf.length>=6?nf:idx).slice(0,6);renderHome()}
function renderHome(){const t=L();
  $('#h-grid').innerHTML=HM.list.map(i=>{const h=HOME[i],f=S.found.includes(i),w=h.n[S.lang];
    return `<div class="hcard${f?' found':''}"><div class="em${h.e==='ring'?' gold':''}"><svg class="ic" aria-hidden="true"><use href="#i-${h.e}"/></svg></div><button class="it${useSyl()?' sy':''}" data-hs="${i}">${useSyl()?sylText(w):esc(w)}</button><div class="els">${h.z.map(z=>`<button class="c-${catOf(z)}" data-el="${z}">${SYM[z-1]} · ${esc(nm(z))}</button>`).join('')}</div><button class="pill fb${f?' alt':''}" data-f="${i}">${f?'★ '+esc(t.found):esc(t.foundIt)}</button></div>`}).join('')}
$('#h-grid').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.el){location.hash='el-'+b.dataset.el;return}
  if(b.dataset.hs){say(`home/${S.lang}/${b.dataset.hs}`,HOME[b.dataset.hs].n[S.lang]);return}
  const i=+b.dataset.f;if(!S.found.includes(i)){S.found.push(i);S.stars+=1;save();progress();toast('★ +1');renderHome()}});
$('#h-new').onclick=newHunt;

/* ---------- which is heavier ---------- */
const HV={a:0,b:0,ans:0,th:0};
function openHeavy(){showPanel('heavy',false);if(!HV.a)newHeavy();else renderHeavy()}
function newHeavy(){let a,b;const pool=S.sci?SYM.map((_,i)=>i+1):POOL;
  if(S.sci&&Math.random()<.3)[a,b]=[[18,19],[27,28],[52,53],[90,91]][Math.floor(Math.random()*4)];
  else do{a=pool[Math.floor(Math.random()*pool.length)];b=pool[Math.floor(Math.random()*pool.length)]}while(Math.abs(MASS[a-1]-MASS[b-1])<.5);
  if(Math.random()<.5)[a,b]=[b,a];Object.assign(HV,{a,b,ans:0,th:0});$('#w-msg').textContent='';$('#w-msg').className='bmsg';renderHeavy()}
function scaleSVG(th){
  const cx=300,cy=60,Lb=200,E=[-1,1].map(k=>[cx+k*Lb*Math.cos(th),cy+k*Lb*Math.sin(th)]);
  const pan=([x,y],z)=>`<path d="M${x} ${y}L${x-60} ${y+105}M${x} ${y}L${x+60} ${y+105}" stroke="var(--mute)" stroke-width="3"/><g class="c-${catOf(z)}"><rect x="${x-36}" y="${y+33}" width="72" height="72" rx="14" style="fill:var(--c)"/><text x="${x}" y="${y+82}" text-anchor="middle" font-size="34" font-weight="900" fill="#1b1d33">${SYM[z-1]}</text></g><path d="M${x-80} ${y+105}h160a80 24 0 0 1-160 0z" style="fill:var(--line)"/>`;
  return `<path d="M300 60L262 262H338Z" style="fill:var(--line)"/><line x1="${E[0][0]}" y1="${E[0][1]}" x2="${E[1][0]}" y2="${E[1][1]}" style="stroke:var(--ink)" stroke-width="10" stroke-linecap="round"/><circle cx="300" cy="60" r="13" style="fill:var(--star)"/>`+pan(E[0],HV.a)+pan(E[1],HV.b);
}
function renderHeavy(){const t=L(),svg=$('#w-svg');svg.innerHTML=scaleSVG(HV.th);svg.setAttribute('aria-label',t.heavyQ);
  $('#w-pick').innerHTML=[HV.a,HV.b].map(z=>`<button class="c-${catOf(z)}" data-w="${z}"><b>${SYM[z-1]}</b><span>${useSyl()?`<span class="sy">${sylText(nm(z))}</span>`:esc(nm(z))}</span><small>${HV.ans?esc(MASS[z-1]):''}</small></button>`).join('')}
function tilt(to){const from=HV.th,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);HV.th=from+(to-from)*e;$('#w-svg').innerHTML=scaleSVG(HV.th);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
$('#w-pick').addEventListener('click',e=>{const b=e.target.closest('[data-w]');if(!b||HV.ans)return;const z=+b.dataset.w,o=z===HV.a?HV.b:HV.a,t=L(),m=$('#w-msg');
  const heavy=+MASS[z-1]>+MASS[o-1];HV.ans=z;S.heavy[heavy?0:1]++;
  if(heavy){S.stars+=1;const y=t.yes;m.textContent=y[Math.floor(Math.random()*y.length)]+(z<o?' '+t.surprise:'');m.className='bmsg ok';progress()}
  else{m.textContent=t.heavyNo+(o<z?' '+t.surprise:'');m.className='bmsg'}
  save();renderHeavy();tilt(+MASS[HV.b-1]>+MASS[HV.a-1]?.17:-.17)});
$('#w-next').onclick=newHeavy;

/* ---------- grown-ups: report, voices, recording ---------- */
function openGrown(){showPanel('grown',false);renderGrown()}
function renderGrown(){const t=L(),lg=S.log,vals=Object.values(lg),wk=Date.now()-7*864e5;
  const qr=vals.reduce((a,v)=>a+v[3],0),qw=vals.reduce((a,v)=>a+v[1],0);
  $('#rep').innerHTML=[[t.rStickers,S.read.length+' / 118'],[t.rWeek,vals.filter(v=>v[4]>wk).length],[t.rStars,S.stars],[t.rQuiz,qr+qw?Math.round(qr/(qr+qw)*100)+'%':'—'],[t.rMols,S.mols.length],[t.rHome,S.found.length+' / '+HOME.length],[t.rHeavy,S.heavy[0]+' / '+(S.heavy[0]+S.heavy[1])]].map(([k,v])=>`<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('');
  const tr=Object.entries(lg).map(([z,v])=>[+z,v[0]+2*v[1]+2*v[2]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,12);
  $('#trickyL').textContent=tr.length?t.rTricky:t.rNone;$('#tricky').innerHTML=tr.map(([z])=>`<span>${esc(nm(z))}</span>`).join('');
  $('#vpick').innerHTML=['en','ru','tr'].map(l=>{const vs=voicesFor(l),cv=voiceFor(l);return `<div class="vrow"><b>${{en:'English',ru:'Русский',tr:'Türkçe'}[l]}</b>${vs.length?`<select data-l="${l}" aria-label="${l}">${vs.map(v=>`<option value="${esc(v.voiceURI)}"${v===cv?' selected':''}>${esc(v.name)}</option>`).join('')}</select>`:`<span class="help">${esc(t.noVoiceShort)}</span>`}<button class="pill alt" data-test="${l}">${esc(t.test)}</button></div>`}).join('');
  $('#voiceHelp').innerHTML=t.voiceHelp;
  const n=Object.keys(PACK).length;$('#packNote').textContent=n?fill(t.packN,{n}):t.packNone;$('#packSave').hidden=!(n&&'caches' in window&&document.querySelector('link[rel=manifest]'));
  $('#fontClear').hidden=!document.documentElement.classList.contains('schoolfont');$('#fontState').textContent=document.documentElement.classList.contains('schoolfont')?t.fontOn:'';
  $('#recNote').textContent=S.rec?(navigator.mediaDevices&&window.MediaRecorder?t.recOk:t.recNo):'';
  voiceNotes();
}
$('#vpick').addEventListener('change',e=>{const s=e.target.closest('select');if(s){S.voice[s.dataset.l]=s.value;save()}});
$('#vpick').addEventListener('click',e=>{const b=e.target.closest('[data-test]');if(!b)return;const l=b.dataset.test,old=S.lang;S.lang=l;speak(NAMES[l][7]+'. '+factText(8,l));S.lang=old});
$('#packSave').onclick=async()=>{try{const c=await caches.open('elx-voices');await c.addAll(Object.values(PACK).map(p=>packBase+p));$('#packNote').textContent=L().packSaved}catch(e){$('#packNote').textContent=String(e.message||e)}};
let rec=null;
async function updRec(){const t=L(),kn=`name/${S.lang}/${cur}`,kf=`fact/${S.lang}/${cur}`;
  if(!rec){$('#recName').textContent=(await idbGet(kn))?t.recRedo+' · '+t.recName.split(' ').pop():t.recName;$('#recFact').textContent=(await idbGet(kf))?t.recRedo+' · '+t.recFact.split(' ').pop():t.recFact}
  $('#recDel').textContent=t.recDel}
async function recToggle(kind,btn){
  if(rec){rec.stop();return}
  const key=`${kind}/${S.lang}/${cur}`;let st;
  try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast(L().recNo);return}
  const mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m));
  let r;try{r=new MediaRecorder(st,mt?{mimeType:mt}:{})}catch(e){st.getTracks().forEach(x=>x.stop());toast(L().recNo);return}
  const ch=[];r.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  r.onstop=async()=>{st.getTracks().forEach(x=>x.stop());rec=null;btn.classList.remove('on');const blob=new Blob(ch,{type:r.mimeType||mt||'audio/webm'});
    if(blob.size>1500){try{await idbSet(key,blob);say(key,'')}catch(e){toast(String(e.message||e))}}updRec()};
  rec=r;stopAll();btn.classList.add('on');btn.textContent=L().recStop;r.start();
}
$('#recName').onclick=e=>recToggle('name',e.currentTarget);
$('#recFact').onclick=e=>recToggle('fact',e.currentTarget);
$('#recDel').onclick=async()=>{for(const k of ['name','fact'])try{await idbSet(`${k}/${S.lang}/${cur}`,null)}catch(e){}updRec()};
if(document.querySelector('link[rel=manifest]')&&'serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}

/* ---------- boot ---------- */
applyLang();setMode('table');setTopic(S.topic||'elements');route();
}
