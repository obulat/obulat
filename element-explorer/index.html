const NAT={
1:{occ:"compounds",shape:"pair",t:["Hydrogen is mostly joined with oxygen in water. A tiny bit floats as pairs of hydrogen atoms, and the Sun is full of it.","Водород почти всегда соединён с кислородом в воде. Совсем немного его бывает в виде пар атомов, а Солнце почти всё из водорода.","Hidrojen çoğunlukla oksijenle birleşip suyu oluşturur. Çok azı ikili atomlar hâlinde bulunur. Güneş'in çoğu da hidrojendir."]},
2:{occ:"free",shape:"single",t:["Helium is always alone, as single atoms. It hides under the ground in natural gas, and a tiny bit is in the air.","Гелий всегда один, отдельными атомами. Он прячется под землёй в природном газе, и чуть-чуть его есть в воздухе.","Helyum hep yalnızdır, tek tek atomlar hâlinde bulunur. Yer altında doğal gazın içinde saklanır, havada da çok azı vardır."]},
3:{occ:"compounds",shape:"metal",t:["Lithium never stays alone in nature. It is joined with other atoms in rocks like spodumene and in very salty lake water.","Литий в природе никогда не бывает один. Он соединён с другими атомами в камнях, например в сподумене, и в очень солёных озёрах.","Lityum doğada asla yalnız kalmaz. Spodümen gibi taşlarda ve çok tuzlu göl sularında başka atomlarla birleşmiş hâlde bulunur."]},
4:{occ:"compounds",shape:"metal",t:["Beryllium is always joined with other atoms. It is inside the mineral beryl, and green emeralds are a kind of beryl.","Бериллий всегда соединён с другими атомами. Он есть в минерале берилле, а зелёный изумруд — это тоже берилл.","Berilyum hep başka atomlarla birleşiktir. Beril adlı mineralin içinde bulunur. Yeşil zümrüt de bir çeşit berildir."]},
5:{occ:"compounds",shape:"network",t:["Boron is never found alone in nature. It is joined with other atoms in minerals like borax, found in dry salty lakes.","Бор в природе один не встречается. Он соединён с другими атомами в минералах, например в буре, которую находят у высохших солёных озёр.","Bor doğada yalnız bulunmaz. Kuruyan tuzlu göllerde bulunan boraks gibi minerallerde başka atomlarla birleşiktir. Türkiye'de çok boraks vardır."]},
6:{occ:"free",shape:"network",t:["Carbon can be found pure, as diamond and graphite. Much more is joined with other atoms in living things, coal, and limestone.","Углерод бывает чистым: это алмаз и графит. Но гораздо больше его соединено с другими атомами в живых существах, угле и известняке.","Karbon saf hâlde elmas ve grafit olarak bulunur. Çok daha fazlası canlılarda, kömürde ve kireçtaşında başka atomlarla birleşiktir."]},
7:{occ:"free",shape:"pair",t:["Nitrogen floats in the air as pairs of atoms. Most of the air we breathe is nitrogen. It is also in every living thing.","Азот летает в воздухе парами атомов. Большая часть воздуха — это азот. Ещё он есть во всех живых существах.","Azot havada ikili atomlar hâlinde uçuşur. Soluduğumuz havanın çoğu azottur. Bütün canlıların içinde de azot vardır."]},
8:{occ:"free",shape:"pair",t:["Oxygen floats in the air as pairs of atoms, and we breathe it. Even more is joined with other atoms in water and rocks.","Кислород летает в воздухе парами атомов, и мы им дышим. А ещё больше его соединено с другими атомами в воде и камнях.","Oksijen havada ikili atomlar hâlinde bulunur ve onu soluruz. Daha da fazlası suda ve taşlarda başka atomlarla birleşiktir."]},
9:{occ:"compounds",shape:"pair",t:["Fluorine never stays alone in nature. It is joined with calcium in a pretty mineral called fluorite.","Фтор в природе никогда не бывает один. Он соединён с кальцием в красивом минерале флюорите.","Flor doğada asla yalnız kalmaz. Florit adlı güzel bir mineralde kalsiyumla birleşmiş hâlde bulunur."]},
10:{occ:"free",shape:"single",t:["Neon is always alone, as single atoms. A tiny bit of it floats in the air.","Неон всегда один, отдельными атомами. Немножко неона есть в воздухе.","Neon hep yalnızdır, tek tek atomlar hâlinde bulunur. Havada çok azı vardır."]},
11:{occ:"compounds",shape:"metal",t:["Sodium never stays alone in nature. It is always joined with other atoms, like chlorine in sea salt.","Натрий в природе никогда не бывает один. Он всегда соединён с другими атомами, например с хлором в морской соли.","Sodyum doğada asla yalnız kalmaz. Hep başka atomlarla birleşiktir, örneğin deniz tuzunda klorla."]},
12:{occ:"compounds",shape:"metal",t:["Magnesium is always joined with other atoms. It is in sea water, in rocks like dolomite, and in green leaves.","Магний всегда соединён с другими атомами. Он есть в морской воде, в камнях вроде доломита и в зелёных листьях.","Magnezyum hep başka atomlarla birleşiktir. Deniz suyunda, dolomit gibi taşlarda ve yeşil yapraklarda bulunur."]},
13:{occ:"compounds",shape:"metal",t:["Aluminium is never found alone in nature. It is joined with other atoms in clay, many rocks, and an ore called bauxite.","Алюминий в природе один не встречается. Он соединён с другими атомами в глине, во многих камнях и в руде боксите.","Alüminyum doğada yalnız bulunmaz. Kilde, birçok taşta ve boksit adlı cevherde başka atomlarla birleşiktir."]},
14:{occ:"compounds",shape:"network",t:["Silicon is never alone in nature. It is joined with oxygen in sand, quartz, and most rocks.","Кремний в природе один не бывает. Он соединён с кислородом в песке, кварце и почти во всех камнях.","Silisyum doğada yalnız olmaz. Kumda, kuvarsta ve çoğu taşta oksijenle birleşmiş hâlde bulunur."]},
15:{occ:"compounds",shape:"molecule",t:["Phosphorus is never alone in nature. It is joined with other atoms in a rock called apatite, and in our bones and teeth.","Фосфор в природе один не бывает. Он соединён с другими атомами в камне апатите, а ещё в наших костях и зубах.","Fosfor doğada yalnız olmaz. Apatit adlı taşta, ayrıca kemiklerimizde ve dişlerimizde başka atomlarla birleşiktir."]},
16:{occ:"free",shape:"molecule",t:["Sulfur can be found pure, as yellow crystals near volcanoes. It is also joined with metals in many ores.","Сера бывает чистой: жёлтые кристаллы рядом с вулканами. Ещё она соединена с металлами во многих рудах.","Kükürt saf hâlde, yanardağların yakınında sarı kristaller olarak bulunur. Birçok cevherde de metallerle birleşiktir."]},
17:{occ:"compounds",shape:"pair",t:["Chlorine never stays alone in nature. It is joined with sodium in salt, in the sea and in salt mines.","Хлор в природе никогда не бывает один. Он соединён с натрием в соли — в море и в соляных шахтах.","Klor doğada asla yalnız kalmaz. Denizde ve tuz madenlerinde, tuzun içinde sodyumla birleşiktir."]},
18:{occ:"free",shape:"single",t:["Argon is always alone, as single atoms. It floats in the air: there is more argon in air than any other noble gas.","Аргон всегда один, отдельными атомами. Он есть в воздухе, и его там больше, чем других благородных газов.","Argon hep yalnızdır, tek tek atomlar hâlinde bulunur. Havada vardır, hem de diğer soy gazlardan daha çok."]},
19:{occ:"compounds",shape:"metal",t:["Potassium never stays alone in nature. It is joined with other atoms in rocks, sea water, and in plants like bananas.","Калий в природе никогда не бывает один. Он соединён с другими атомами в камнях, морской воде и в растениях, например в бананах.","Potasyum doğada asla yalnız kalmaz. Taşlarda, deniz suyunda ve muz gibi bitkilerde başka atomlarla birleşiktir."]},
20:{occ:"compounds",shape:"metal",t:["Calcium is always joined with other atoms. It is in limestone, chalk, marble, sea shells, and our bones.","Кальций всегда соединён с другими атомами. Он есть в известняке, меле, мраморе, ракушках и наших костях.","Kalsiyum hep başka atomlarla birleşiktir. Kireçtaşında, tebeşirde, mermerde, deniz kabuklarında ve kemiklerimizde bulunur."]},
21:{occ:"compounds",shape:"metal",t:["Scandium is always joined with other atoms. It is spread thinly in many rocks and is rarely found in one place.","Скандий всегда соединён с другими атомами. Он рассыпан понемногу во многих камнях, и большие запасы встречаются редко.","Skandiyum hep başka atomlarla birleşiktir. Birçok taşta azar azar dağılmıştır, bir yerde çok bulunması nadirdir."]},
22:{occ:"compounds",shape:"metal",t:["Titanium is always joined with other atoms. It is in black sand and minerals like ilmenite and rutile.","Титан всегда соединён с другими атомами. Он есть в чёрном песке и в минералах ильмените и рутиле.","Titanyum hep başka atomlarla birleşiktir. Siyah kumda, ilmenit ve rutil gibi minerallerde bulunur."]},
23:{occ:"compounds",shape:"metal",t:["Vanadium is always joined with other atoms. It is in iron ores, in a red mineral called vanadinite, and even in oil.","Ванадий всегда соединён с другими атомами. Он есть в железных рудах, в красном минерале ванадините и даже в нефти.","Vanadyum hep başka atomlarla birleşiktir. Demir cevherlerinde, vanadinit adlı kırmızı mineralde ve hatta petrolde bulunur."]},
24:{occ:"compounds",shape:"metal",t:["Chromium is joined with other atoms in nature. Almost all of it comes from a dark ore called chromite.","Хром в природе соединён с другими атомами. Почти весь хром добывают из тёмной руды хромита.","Krom doğada başka atomlarla birleşiktir. Neredeyse hepsi kromit adlı koyu renkli cevherden çıkarılır."]},
25:{occ:"compounds",shape:"metal",t:["Manganese is always joined with other atoms. It is in black rocks like pyrolusite and in round lumps on the sea floor.","Марганец всегда соединён с другими атомами. Он есть в чёрных камнях, например в пиролюзите, и в круглых комочках на дне океана.","Mangan hep başka atomlarla birleşiktir. Piroluzit gibi siyah taşlarda ve okyanus dibindeki yuvarlak yumrularda bulunur."]},
26:{occ:"free",shape:"metal",t:["Iron is mostly joined with oxygen in red and black rocks like hematite. Pure iron falls from space in meteorites.","Железо в основном соединено с кислородом в красных и чёрных камнях, например в гематите. А чистое железо падает из космоса в метеоритах.","Demir çoğunlukla hematit gibi kırmızı ve siyah taşlarda oksijenle birleşiktir. Saf demir ise göktaşlarıyla uzaydan düşer."]},
27:{occ:"compounds",shape:"metal",t:["Cobalt is always joined with other atoms. It is found together with copper and nickel in their ores.","Кобальт всегда соединён с другими атомами. Его находят вместе с медью и никелем в их рудах.","Kobalt hep başka atomlarla birleşiktir. Bakır ve nikel cevherlerinde onlarla birlikte bulunur."]},
28:{occ:"compounds",shape:"metal",t:["On Earth, nickel is mostly joined with other atoms in ores. In metal meteorites from space, it is mixed with pure iron.","На Земле никель в основном соединён с другими атомами в рудах. А в железных метеоритах он смешан с чистым железом.","Dünya'da nikel çoğunlukla cevherlerde başka atomlarla birleşiktir. Uzaydan gelen metal göktaşlarında saf demirle karışıktır."]},
29:{occ:"free",shape:"metal",t:["Copper can be found pure, as shiny reddish lumps in rocks. Most copper is joined with other atoms in ores like malachite.","Медь бывает чистой: блестящие красноватые самородки в камнях. Но больше всего меди соединено с другими атомами в рудах, например в малахите.","Bakır saf hâlde, taşların içinde parlak kırmızımsı parçalar olarak bulunur. Çoğu ise malahit gibi cevherlerde başka atomlarla birleşiktir."]},
30:{occ:"compounds",shape:"metal",t:["Zinc is always joined with other atoms in nature. Most of it comes from a mineral called sphalerite, or zinc blende.","Цинк в природе соединён с другими атомами. Больше всего его добывают из минерала сфалерита, или цинковой обманки.","Çinko doğada hep başka atomlarla birleşiktir. Çoğu sfalerit adlı mineralden çıkarılır."]},
31:{occ:"compounds",shape:"metal",t:["Gallium is always joined with other atoms. Tiny bits hide in bauxite and zinc ores, and people collect it from there.","Галлий всегда соединён с другими атомами. Капельки его прячутся в бокситах и цинковых рудах, оттуда его и добывают.","Galyum hep başka atomlarla birleşiktir. Çok azı boksit ve çinko cevherlerinde saklanır, oradan elde edilir."]},
32:{occ:"compounds",shape:"network",t:["Germanium is always joined with other atoms. Tiny bits hide in zinc ores and coal.","Германий всегда соединён с другими атомами. Немного его прячется в цинковых рудах и в угле.","Germanyum hep başka atomlarla birleşiktir. Çok azı çinko cevherlerinde ve kömürde saklanır."]},
33:{occ:"free",shape:"network",t:["Arsenic is mostly joined with sulfur and metals in rocks. Sometimes it is found pure, as grey crystals.","Мышьяк в основном соединён с серой и металлами в камнях. Иногда его находят чистым, в виде серых кристаллов.","Arsenik çoğunlukla taşlarda kükürt ve metallerle birleşiktir. Bazen saf hâlde, gri kristaller olarak bulunur."]},
34:{occ:"compounds",shape:"molecule",t:["Selenium is joined with other atoms in nature. Tiny bits hide in copper ores and in soil.","Селен в природе соединён с другими атомами. Немного его прячется в медных рудах и в почве.","Selenyum doğada başka atomlarla birleşiktir. Çok azı bakır cevherlerinde ve toprakta saklanır."]},
35:{occ:"compounds",shape:"pair",t:["Bromine never stays alone in nature. It is joined with other atoms in sea water and very salty lakes.","Бром в природе никогда не бывает один. Он соединён с другими атомами в морской воде и в очень солёных озёрах.","Brom doğada asla yalnız kalmaz. Deniz suyunda ve çok tuzlu göllerde başka atomlarla birleşiktir."]},
36:{occ:"free",shape:"single",t:["Krypton is always alone, as single atoms. A very tiny bit of it floats in the air.","Криптон всегда один, отдельными атомами. Совсем чуть-чуть его есть в воздухе.","Kripton hep yalnızdır, tek tek atomlar hâlinde bulunur. Havada çok çok azı vardır."]},
37:{occ:"compounds",shape:"metal",t:["Rubidium never stays alone in nature. Tiny bits are joined with other atoms in rocks, together with lithium and potassium.","Рубидий в природе никогда не бывает один. Немного его соединено с другими атомами в камнях, рядом с литием и калием.","Rubidyum doğada asla yalnız kalmaz. Çok azı taşlarda, lityum ve potasyumla birlikte başka atomlara bağlıdır."]},
38:{occ:"compounds",shape:"metal",t:["Strontium is always joined with other atoms. It is in minerals called celestine and strontianite.","Стронций всегда соединён с другими атомами. Он есть в минералах целестине и стронцианите.","Stronsiyum hep başka atomlarla birleşiktir. Selestin ve stronsiyanit adlı minerallerde bulunur."]},
39:{occ:"compounds",shape:"metal",t:["Yttrium is always joined with other atoms. It is in rare minerals like xenotime and monazite, often in sand.","Иттрий всегда соединён с другими атомами. Он есть в редких минералах ксенотиме и монаците, часто в песке.","İtriyum hep başka atomlarla birleşiktir. Ksenotim ve monazit gibi nadir minerallerde, çoğu zaman kumda bulunur."]},
40:{occ:"compounds",shape:"metal",t:["Zirconium is always joined with other atoms. It is in a hard mineral called zircon, found as grains in sand.","Цирконий всегда соединён с другими атомами. Он есть в твёрдом минерале цирконе, крупинки которого лежат в песке.","Zirkonyum hep başka atomlarla birleşiktir. Kumda taneler hâlinde bulunan zirkon adlı sert mineralin içindedir."]},
41:{occ:"compounds",shape:"metal",t:["Niobium is never alone in nature. It is joined with other atoms in minerals called pyrochlore and columbite.","Ниобий в природе не бывает один. Он прячется в минералах пирохлоре и колумбите.","Niyobyum doğada hiç yalnız bulunmaz. Piroklor ve kolumbit adlı minerallerin içinde saklanır."]},
42:{occ:"compounds",shape:"metal",t:["Molybdenum almost never lives alone. Most of it hides in a soft, shiny grey mineral called molybdenite.","Молибден почти никогда не бывает один. Чаще всего он прячется в мягком блестящем сером минерале молибдените.","Molibden neredeyse hiç yalnız bulunmaz. Çoğu, molibdenit adlı yumuşak, parlak gri bir mineralde saklanır."]},
43:{occ:"trace",shape:"metal",t:["Technetium is radioactive and slowly disappears. Only the tiniest traces form in uranium ores; people make it in nuclear reactors.","Технеций радиоактивный и постепенно распадается. В урановых рудах есть лишь крошечные следы, а получают его в ядерных реакторах.","Teknesyum radyoaktiftir ve yavaş yavaş bozunur. Uranyum cevherlerinde yalnızca çok küçük izleri vardır; insanlar onu nükleer reaktörlerde üretir."]},
44:{occ:"free",shape:"metal",t:["Ruthenium is sometimes found as tiny metal grains mixed with platinum and osmium. Most of it comes from platinum and nickel ores.","Рутений иногда встречается в виде крошечных металлических зёрен вместе с платиной и осмием. Но чаще его добывают из платиновых и никелевых руд.","Rutenyum bazen platin ve osmiyumla karışık küçük metal taneleri hâlinde bulunur. Çoğu platin ve nikel cevherlerinden elde edilir."]},
45:{occ:"free",shape:"metal",t:["Rhodium is very rare. Sometimes it is found as tiny metal grains with platinum, but mostly it hides in platinum and nickel ores.","Родий очень редкий. Иногда он встречается крошечными металлическими зёрнами вместе с платиной, но чаще прячется в платиновых и никелевых рудах.","Rodyum çok nadirdir. Bazen platinle birlikte küçük metal taneleri hâlinde bulunur, ama çoğu platin ve nikel cevherlerinde saklanır."]},
46:{occ:"free",shape:"metal",t:["Palladium can be found as pure metal grains, often with platinum. But most of it comes from nickel and copper ores.","Палладий бывает в природе чистым металлом в виде зёрен, часто вместе с платиной. Но больше всего его добывают из медно-никелевых руд.","Paladyum doğada saf metal taneleri hâlinde, çoğu zaman platinle birlikte bulunabilir. Ama çoğu nikel ve bakır cevherlerinden elde edilir."]},
47:{occ:"free",shape:"metal",t:["Silver is sometimes found pure, as shiny wires and lumps in rocks. More often it is joined with sulfur in silver ores.","Серебро иногда находят чистым: блестящими проволочками и самородками в камнях. Чаще оно соединено с серой в серебряных рудах.","Gümüş bazen saf hâlde, taşların içinde parlak teller ve külçeler olarak bulunur. Daha sık kükürtle birleşmiş hâlde gümüş cevherlerinde bulunur."]},
48:{occ:"compounds",shape:"metal",t:["Cadmium is never alone in nature. It hides in zinc ores, and rarely forms its own yellow mineral, greenockite.","Кадмий в природе не бывает один. Он прячется в цинковых рудах, а изредка образует свой жёлтый минерал гринокит.","Kadmiyum doğada yalnız bulunmaz. Çinko cevherlerinde saklanır, nadiren de grinokit adlı sarı bir mineral oluşturur."]},
49:{occ:"compounds",shape:"metal",t:["Indium is almost never alone. Tiny amounts hide in zinc ores, especially in a mineral called sphalerite.","Индий почти никогда не бывает один. Его крошечные количества прячутся в цинковых рудах, особенно в минерале сфалерите.","İndiyum neredeyse hiç yalnız bulunmaz. Çok küçük miktarları çinko cevherlerinde, özellikle sfalerit adlı mineralde saklanır."]},
50:{occ:"compounds",shape:"metal",t:["Tin is almost never alone in nature. It hides in a brown or black stone called cassiterite.","Олово почти никогда не бывает в природе одно. Оно прячется в буром или чёрном камне — касситерите.","Kalay doğada neredeyse hiç yalnız bulunmaz. Kasiterit adlı kahverengi ya da siyah bir taşta saklanır."]},
51:{occ:"compounds",shape:"metal",t:["Antimony is rarely found pure. Mostly it is joined with sulfur in stibnite, a grey mineral with long shiny needles.","Сурьма редко встречается чистой. Чаще она соединена с серой в сером минерале с длинными блестящими иглами — антимоните.","Antimon nadiren saf hâlde bulunur. Çoğu zaman kükürtle birleşerek uzun, parlak iğneleri olan antimonit adlı gri bir mineral oluşturur."]},
52:{occ:"free",shape:"molecule",t:["Tellurium is sometimes found as pure silvery crystals. More often it is joined with gold, silver or copper in ores.","Теллур иногда встречается чистым, в виде серебристых кристаллов. Чаще он соединён с золотом, серебром или медью в рудах.","Tellür bazen saf, gümüş renkli kristaller hâlinde bulunur. Daha sık altın, gümüş ya da bakırla birleşmiş olarak cevherlerde bulunur."]},
53:{occ:"compounds",shape:"pair",t:["Iodine is never alone in nature. It is dissolved in sea water, seaweed collects it, and it is also in salty underground water.","Иод в природе не бывает один. Он растворён в морской воде, его накапливают водоросли, а ещё он есть в солёных подземных водах.","İyot doğada yalnız bulunmaz. Deniz suyunda çözünmüş hâldedir ve deniz yosunları onu biriktirir; tuzlu yeraltı sularında da bulunur."]},
54:{occ:"free",shape:"single",t:["Xenon floats alone, as single atoms, in the air. There is very little of it, so it is a rare gas.","Ксенон летает в воздухе сам по себе, отдельными атомами. Его там очень мало, поэтому это редкий газ.","Ksenon havada tek başına, ayrı ayrı atomlar hâlinde dolaşır. Havada çok az bulunur, bu yüzden nadir bir gazdır."]},
55:{occ:"compounds",shape:"metal",t:["Caesium is never alone in nature. It is joined with other atoms, mainly in a rare stone called pollucite.","Цезий в природе не бывает один. Он соединён с другими атомами, больше всего его в редком минерале поллуците.","Sezyum doğada hiç yalnız bulunmaz. Diğer atomlarla birleşmiş hâldedir; en çok pollusit adlı nadir bir taşta bulunur."]},
56:{occ:"compounds",shape:"metal",t:["Barium is never alone in nature. Most of it is in a heavy white mineral called barite.","Барий в природе не бывает один. Больше всего его в тяжёлом белом минерале барите.","Baryum doğada yalnız bulunmaz. Çoğu, barit adlı ağır, beyaz bir mineralde bulunur."]},
57:{occ:"compounds",shape:"metal",t:["Lanthanum is never alone in nature. It hides with its rare earth cousins in minerals called monazite and bastnäsite.","Лантан в природе не бывает один. Он прячется вместе с другими редкоземельными элементами в минералах монаците и бастнезите.","Lantan doğada yalnız bulunmaz. Diğer nadir toprak elementleriyle birlikte monazit ve bastnazit adlı minerallerde saklanır."]},
58:{occ:"compounds",shape:"metal",t:["Cerium is never alone in nature. It is the most common rare earth metal and hides in monazite and bastnäsite.","Церий в природе не бывает один. Это самый распространённый редкоземельный металл, он прячется в монаците и бастнезите.","Seryum doğada yalnız bulunmaz. En yaygın nadir toprak metalidir ve monazit ile bastnazit minerallerinde saklanır."]},
59:{occ:"compounds",shape:"metal",t:["Praseodymium is never alone in nature. It lives mixed with other rare earth metals in monazite and bastnäsite.","Празеодим в природе не бывает один. Он перемешан с другими редкоземельными металлами в монаците и бастнезите.","Praseodim doğada yalnız bulunmaz. Monazit ve bastnazit minerallerinde diğer nadir toprak metalleriyle karışık hâlde bulunur."]},
60:{occ:"compounds",shape:"metal",t:["Neodymium is never alone in nature. It is dug up with other rare earth metals from monazite and bastnäsite.","Неодим в природе не бывает один. Его добывают вместе с другими редкоземельными металлами из монацита и бастнезита.","Neodim doğada yalnız bulunmaz. Diğer nadir toprak metalleriyle birlikte monazit ve bastnazit minerallerinden çıkarılır."]},
61:{occ:"trace",shape:"metal",t:["Promethium is radioactive and falls apart fast. Only a few atoms exist in uranium ores; people make it in nuclear reactors.","Прометий радиоактивный и быстро распадается. В урановых рудах его ничтожно мало, а получают его в ядерных реакторах.","Prometyum radyoaktiftir ve hızla bozunur. Uranyum cevherlerinde yok denecek kadar az bulunur; insanlar onu nükleer reaktörlerde üretir."]},
62:{occ:"compounds",shape:"metal",t:["Samarium is never alone in nature. It hides in monazite and bastnäsite, and in samarskite, the black mineral it is named after.","Самарий в природе не бывает один. Он прячется в монаците, бастнезите и в чёрном минерале самарските, от которого получил имя.","Samaryum doğada yalnız bulunmaz. Monazit ve bastnazit minerallerinde, bir de adını aldığı siyah samarskit mineralinde saklanır."]},
63:{occ:"compounds",shape:"metal",t:["Europium is never alone in nature. Tiny amounts hide in monazite and bastnäsite with other rare earth metals.","Европий в природе не бывает один. Его крошечные доли прячутся в монаците и бастнезите вместе с другими редкоземельными металлами.","Evropiyum doğada yalnız bulunmaz. Çok küçük miktarları, diğer nadir toprak metalleriyle birlikte monazit ve bastnazitte saklanır."]},
64:{occ:"compounds",shape:"metal",t:["Gadolinium is never alone in nature. It is mixed with other rare earth metals in monazite and bastnäsite.","Гадолиний в природе не бывает один. Он смешан с другими редкоземельными металлами в монаците и бастнезите.","Gadolinyum doğada yalnız bulunmaz. Monazit ve bastnazitte diğer nadir toprak metalleriyle karışık hâlde bulunur."]},
65:{occ:"compounds",shape:"metal",t:["Terbium is never alone in nature. It hides in a mineral called xenotime and in special clays, with other rare earth metals.","Тербий в природе не бывает один. Он прячется в минерале ксенотиме и в особых глинах вместе с другими редкоземельными металлами.","Terbiyum doğada yalnız bulunmaz. Diğer nadir toprak metalleriyle birlikte ksenotim adlı mineralde ve özel killerde saklanır."]},
66:{occ:"compounds",shape:"metal",t:["Dysprosium is never alone in nature. It is found in xenotime, monazite and special clays, mixed with other rare earth metals.","Диспрозий в природе не бывает один. Его находят в ксенотиме, монаците и особых глинах вместе с другими редкоземельными металлами.","Disprosyum doğada yalnız bulunmaz. Ksenotim, monazit ve özel killerde, diğer nadir toprak metalleriyle karışık hâlde bulunur."]},
67:{occ:"compounds",shape:"metal",t:["Holmium is never alone in nature. Small amounts hide in monazite and xenotime with other rare earth metals.","Гольмий в природе не бывает один. Его немного в монаците и ксенотиме, где он живёт вместе с другими редкоземельными металлами.","Holmiyum doğada yalnız bulunmaz. Az miktarda, diğer nadir toprak metalleriyle birlikte monazit ve ksenotimde saklanır."]},
68:{occ:"compounds",shape:"metal",t:["Erbium is never alone in nature. It hides in xenotime and in special clays, together with its rare earth cousins.","Эрбий в природе не бывает один. Он прячется в ксенотиме и в особых глинах вместе со своими редкоземельными родственниками.","Erbiyum doğada yalnız bulunmaz. Nadir toprak akrabalarıyla birlikte ksenotimde ve özel killerde saklanır."]},
69:{occ:"compounds",shape:"metal",t:["Thulium is never alone, and it is one of the rarest rare earth metals. Tiny amounts hide in xenotime and monazite.","Тулий в природе не бывает один, и это один из самых редких редкоземельных металлов. Его крохи прячутся в ксенотиме и монаците.","Tulyum doğada yalnız bulunmaz ve en az bulunan nadir toprak metallerinden biridir. Çok küçük miktarları ksenotim ve monazitte saklanır."]},
70:{occ:"compounds",shape:"metal",t:["Ytterbium is never alone in nature. It hides in xenotime and monazite, and was first found in rocks from the Swedish village Ytterby.","Иттербий в природе не бывает один. Он прячется в ксенотиме и монаците, а впервые его нашли в камнях у шведской деревни Иттербю.","İterbiyum doğada yalnız bulunmaz. Ksenotim ve monazitte saklanır; ilk kez İsveç'teki Ytterby köyünün taşlarında bulunmuştur."]},
71:{occ:"compounds",shape:"metal",t:["Lutetium is never alone in nature. It is one of the rarest rare earth metals and hides in tiny amounts in xenotime and monazite.","Лютеций в природе не бывает один. Это один из самых редких редкоземельных металлов, он есть понемногу в ксенотиме и монаците.","Lutesyum doğada yalnız bulunmaz. En az bulunan nadir toprak metallerinden biridir ve ksenotim ile monazitte çok az miktarda bulunur."]},
72:{occ:"compounds",shape:"metal",t:["Hafnium is never alone in nature. It always hides inside the mineral zircon, together with its twin-like cousin zirconium.","Гафний в природе не бывает один. Он всегда прячется в минерале цирконе вместе со своим «близнецом» цирконием.","Hafniyum doğada yalnız bulunmaz. Her zaman zirkon mineralinin içinde, ikizi gibi olan zirkonyumla birlikte saklanır."]},
73:{occ:"compounds",shape:"metal",t:["Tantalum is almost never alone in nature. It hides in a dark mineral called tantalite, part of an ore called coltan.","Тантал почти никогда не бывает в природе один. Он прячется в тёмном минерале танталите, который входит в руду колтан.","Tantal doğada neredeyse hiç yalnız bulunmaz. Koltan cevherinin bir parçası olan tantalit adlı koyu renkli bir mineralde saklanır."]},
74:{occ:"compounds",shape:"metal",t:["Tungsten is never alone in nature. It hides in heavy minerals called wolframite and scheelite.","Вольфрам в природе не бывает один. Он прячется в тяжёлых минералах вольфрамите и шеелите.","Tungsten doğada yalnız bulunmaz. Volframit ve şelit adlı ağır minerallerde saklanır."]},
75:{occ:"compounds",shape:"metal",t:["Rhenium is never alone and is one of the rarest metals. Tiny amounts hide in molybdenite, the main ore of molybdenum.","Рений в природе не бывает один, это один из самых редких металлов. Его крохи прячутся в молибдените — главной руде молибдена.","Renyum doğada yalnız bulunmaz ve en nadir metallerden biridir. Çok küçük miktarları, molibdenin ana cevheri olan molibdenitte saklanır."]},
76:{occ:"free",shape:"metal",t:["Osmium is sometimes found as pure metal grains mixed with iridium, in river sand and in platinum ores.","Осмий иногда встречается в виде металлических зёрен, смешанных с иридием, в речном песке и платиновых рудах.","Osmiyum bazen iridyumla karışık saf metal taneleri hâlinde, nehir kumlarında ve platin cevherlerinde bulunur."]},
77:{occ:"free",shape:"metal",t:["Iridium is sometimes found as tiny metal grains mixed with osmium or platinum. There is very little of it in Earth's rocks.","Иридий иногда встречается в виде крошечных металлических зёрен вместе с осмием или платиной. В земных камнях его очень мало.","İridyum bazen osmiyum ya da platinle karışık küçük metal taneleri hâlinde bulunur. Yer kabuğundaki taşlarda çok azdır."]},
78:{occ:"free",shape:"metal",t:["Platinum is often found pure, as grains and even nuggets in river sand. Some is joined with other atoms in nickel ores.","Платину часто находят чистой — зёрнами и даже самородками в речном песке. Часть её соединена с другими атомами в никелевых рудах.","Platin çoğu zaman saf hâlde, nehir kumlarında taneler ve hatta külçeler olarak bulunur. Bir kısmı nikel cevherlerinde başka atomlarla birleşmiştir."]},
79:{occ:"free",shape:"metal",t:["Gold is usually found pure, as shiny nuggets, flakes and grains in rocks and river sand.","Золото обычно находят чистым — блестящими самородками, чешуйками и крупинками в камнях и речном песке.","Altın genellikle saf hâlde, taşlarda ve nehir kumlarında parlak külçeler, pullar ve taneler olarak bulunur."]},
80:{occ:"free",shape:"metal",t:["Mercury is a liquid metal. Small drops of pure mercury are sometimes found in rocks, but most of it is in red cinnabar.","Ртуть — жидкий металл. Иногда в камнях находят капельки чистой ртути, но больше всего её в красном минерале киновари.","Cıva sıvı bir metaldir. Bazen taşlarda saf cıva damlacıkları bulunur, ama çoğu kırmızı zinober mineralindedir."]},
81:{occ:"compounds",shape:"metal",t:["Thallium is never alone in nature. It hides in tiny amounts inside other stones, mostly ores of zinc and lead.","Таллий в природе не бывает один. Он прячется в небольших количествах в других камнях, чаще всего в рудах цинка и свинца.","Talyum doğada asla yalnız bulunmaz. Başka taşların içinde, çoğunlukla çinko ve kurşun cevherlerinde çok az miktarda saklanır."]},
82:{occ:"compounds",shape:"metal",t:["Lead is almost never alone in nature. Joined with sulfur, it hides in a shiny grey stone called galena.","Свинец в природе почти никогда не бывает один. Вместе с серой он прячется в блестящем сером камне — галените.","Kurşun doğada neredeyse hiç yalnız bulunmaz. Kükürtle birleşerek galen adlı parlak gri bir taşta saklanır."]},
83:{occ:"free",shape:"metal",t:["Bismuth is sometimes found pure in nature, as bits of shiny metal. More often it is joined with sulfur in a stone called bismuthinite.","Висмут иногда встречается в природе чистым, кусочками блестящего металла. Но чаще он соединён с серой в камне висмутине.","Bizmut doğada bazen saf hâlde, parlak metal parçaları olarak bulunur. Daha sık ise kükürtle birleşip bizmutinit adlı bir taşta bulunur."]},
84:{occ:"trace",shape:"metal",t:["Polonium is radioactive and very rare. Only tiny traces form inside uranium ore as uranium slowly breaks apart.","Полоний радиоактивен и очень редок. Крошечные его следы появляются в урановой руде, когда уран медленно распадается.","Polonyum radyoaktiftir ve çok nadirdir. Uranyum yavaşça bozunurken uranyum cevherinde çok küçük izleri oluşur."]},
85:{occ:"trace",shape:"unknown",t:["Astatine is one of the rarest elements on Earth. Only a tiny pinch exists in uranium ores, and it breaks apart fast.","Астат — один из самых редких элементов на Земле. В урановых рудах его ничтожно мало, и он быстро распадается.","Astatin, Dünya'daki en nadir elementlerden biridir. Uranyum cevherlerinde çok çok az bulunur ve hızla bozunur."]},
86:{occ:"free",shape:"single",t:["Radon is a gas of single atoms. It slowly seeps out of rocks and soil into the air. It is radioactive.","Радон — газ из отдельных атомов. Он понемногу выходит из горных пород и почвы в воздух. Он радиоактивен.","Radon, tek tek atomlardan oluşan bir gazdır. Kayalardan ve topraktan yavaş yavaş havaya sızar. Radyoaktiftir."]},
87:{occ:"trace",shape:"unknown",t:["Francium is extremely rare. Only tiny traces exist in uranium ore, and each atom breaks apart within minutes.","Франций очень-очень редок. Его крошечные следы есть в урановой руде, и каждый атом распадается за считаные минуты.","Fransiyum son derece nadirdir. Uranyum cevherinde yalnızca çok küçük izleri vardır ve her atomu dakikalar içinde bozunur."]},
88:{occ:"trace",shape:"metal",t:["Radium is found only in tiny traces in uranium ore. Marie Curie needed tons of ore to get a tiny bit of it.","Радий встречается только крошечными следами в урановой руде. Мария Кюри переработала тонны руды, чтобы добыть совсем немного радия.","Radyum, uranyum cevherinde yalnızca çok küçük izler hâlinde bulunur. Marie Curie biraz radyum elde etmek için tonlarca cevher işledi."]},
89:{occ:"trace",shape:"metal",t:["Actinium is found only in tiny traces in uranium ore. It is radioactive and glows a soft blue in the dark.","Актиний встречается только крошечными следами в урановой руде. Он радиоактивен и в темноте слабо светится голубым.","Aktinyum, uranyum cevherinde yalnızca çok küçük izler hâlinde bulunur. Radyoaktiftir ve karanlıkta hafif mavi parlar."]},
90:{occ:"compounds",shape:"metal",t:["Thorium is never alone in nature. It is joined with other atoms in minerals like monazite sand and thorianite.","Торий в природе не бывает один. Он соединён с другими атомами в минералах, например в монацитовом песке и торианите.","Toryum doğada yalnız bulunmaz. Monazit kumu ve toryanit gibi minerallerde başka atomlarla birleşmiş hâldedir."]},
91:{occ:"trace",shape:"metal",t:["Protactinium is very rare. Only tiny traces of it form inside uranium ore.","Протактиний очень редок. Лишь крошечные его следы образуются в урановой руде.","Protaktinyum çok nadirdir. Uranyum cevherinde yalnızca çok küçük izleri oluşur."]},
92:{occ:"compounds",shape:"metal",t:["Uranium is never alone in nature. Joined with oxygen, it makes a heavy black stone called uraninite, or pitchblende.","Уран в природе не бывает один. Вместе с кислородом он образует тяжёлый чёрный камень — уранинит, или урановую смолку.","Uranyum doğada yalnız bulunmaz. Oksijenle birleşerek uraninit adlı ağır, siyah bir taş oluşturur."]},
93:{occ:"trace",shape:"metal",t:["Neptunium is almost not found in nature: only ultra-tiny traces in uranium ore. Scientists make it in nuclear reactors.","Нептуний в природе почти не встречается: лишь ничтожные следы есть в урановой руде. Учёные получают его в ядерных реакторах.","Neptünyum doğada neredeyse hiç yoktur. Uranyum cevherinde yalnızca çok çok küçük izleri bulunur. Bilim insanları onu nükleer reaktörlerde üretir."]},
94:{occ:"trace",shape:"metal",t:["Plutonium has only ultra-tiny traces in uranium ore. Almost all plutonium is made by people in nuclear reactors.","Плутоний в природе — лишь ничтожные следы в урановой руде. Почти весь плутоний люди получают в ядерных реакторах.","Plütonyum doğada yalnızca uranyum cevherinde çok çok küçük izler hâlinde bulunur. Plütonyumun neredeyse tamamını insanlar nükleer reaktörlerde üretir."]},
95:{occ:"synthetic",shape:"metal",t:["Americium is not found in nature. People make it in nuclear reactors, and a tiny bit is inside many smoke alarms.","Америций в природе не встречается. Его получают в ядерных реакторах, и крошечная его частичка есть во многих датчиках дыма.","Amerikyum doğada bulunmaz. İnsanlar onu nükleer reaktörlerde üretir. Birçok duman dedektöründe ondan çok küçük bir parça vardır."]},
96:{occ:"synthetic",shape:"metal",t:["Curium is not found in nature. Scientists first made it in 1944, and now it is made in nuclear reactors.","Кюрий в природе не встречается. Учёные впервые получили его в 1944 году, а теперь его делают в ядерных реакторах.","Küriyum doğada bulunmaz. Bilim insanları onu ilk kez 1944'te üretti, şimdi nükleer reaktörlerde yapılıyor."]},
97:{occ:"synthetic",shape:"metal",t:["Berkelium is not found in nature. Scientists in Berkeley, USA, first made it in 1949. Only tiny amounts have ever been made.","Берклий в природе не встречается. Его впервые получили учёные в городе Беркли (США) в 1949 году. Его сделали совсем немного.","Berkelyum doğada bulunmaz. İlk kez 1949'da ABD'nin Berkeley şehrinde üretildi. Bugüne kadar çok az yapıldı."]},
98:{occ:"synthetic",shape:"metal",t:["Californium is not found in nature. People make tiny amounts of it in special nuclear reactors.","Калифорний в природе не встречается. Люди получают его совсем понемногу в особых ядерных реакторах.","Kaliforniyum doğada bulunmaz. İnsanlar onu özel nükleer reaktörlerde çok az miktarda üretir."]},
99:{occ:"synthetic",shape:"metal",t:["Einsteinium is not found in nature. It was first found in 1952, in dust left by a nuclear test. Now specks are made in reactors.","Эйнштейний в природе не встречается. Его впервые нашли в 1952 году в пыли после ядерного испытания. Сейчас его крупинки получают в реакторах.","Aynştaynyum doğada bulunmaz. İlk kez 1952'de bir nükleer denemeden kalan tozda bulundu. Bugün reaktörlerde çok küçük miktarlarda üretilir."]},
100:{occ:"synthetic",shape:"unknown",t:["Fermium is not found in nature. Like einsteinium, it was first found in dust from a 1952 nuclear test. Only tiny amounts were ever made.","Фермий в природе не встречается. Как и эйнштейний, его нашли в пыли после ядерного испытания 1952 года. Его получали лишь в ничтожных количествах.","Fermiyum doğada bulunmaz. Aynştaynyum gibi o da ilk kez 1952'deki bir nükleer denemenin tozunda bulundu. Hep çok az miktarda üretildi."]},
101:{occ:"synthetic",shape:"unknown",t:["Mendelevium is not found in nature. Scientists in Berkeley, USA, first made it in 1955: just 17 atoms!","Менделевий в природе не встречается. Учёные в Беркли (США) впервые получили его в 1955 году — всего 17 атомов!","Mendelevyum doğada bulunmaz. Bilim insanları onu ilk kez 1955'te ABD'deki Berkeley'de üretti: yalnızca 17 atom!"]},
102:{occ:"synthetic",shape:"unknown",t:["Nobelium is not found in nature. Scientists in Dubna, Russia, made it by smashing atoms together. Its atoms break apart in less than an hour.","Нобелий в природе не встречается. Учёные в Дубне получили его, сталкивая атомы друг с другом. Его атомы распадаются меньше чем за час.","Nobelyum doğada bulunmaz. Bilim insanları onu Rusya'daki Dubna'da atomları çarpıştırarak üretti. Atomları bir saatten kısa sürede bozunur."]},
103:{occ:"synthetic",shape:"unknown",t:["Lawrencium is not found in nature. Scientists make it a few atoms at a time by smashing atoms together in a big machine.","Лоуренсий в природе не встречается. Учёные получают его по нескольку атомов, сталкивая атомы на большой установке.","Lavrensiyum doğada bulunmaz. Bilim insanları onu, büyük bir makinede atomları çarpıştırarak birkaç atom hâlinde üretir."]},
104:{occ:"synthetic",shape:"unknown",t:["Rutherfordium is not found in nature. Scientists in Russia and the USA made it in the 1960s, only a few atoms at a time.","Резерфордий в природе не встречается. Учёные в СССР и США получили его в 1960-х годах, всего по нескольку атомов.","Rutherfordiyum doğada bulunmaz. Rusya ve ABD'deki bilim insanları onu 1960'larda, her seferinde birkaç atom olarak üretti."]},
105:{occ:"synthetic",shape:"unknown",t:["Dubnium is not found in nature. It is named after Dubna, a Russian town where scientists smash atoms to make new elements.","Дубний в природе не встречается. Он назван в честь города Дубна, где учёные создают новые элементы, сталкивая атомы.","Dubniyum doğada bulunmaz. Adını, bilim insanlarının atomları çarpıştırarak yeni elementler yaptığı Rus şehri Dubna'dan alır."]},
106:{occ:"synthetic",shape:"unknown",t:["Seaborgium is not found in nature. It was first made in 1974 in the USA. Its few atoms break apart quickly.","Сиборгий в природе не встречается. Его впервые получили в 1974 году в США. Его атомов бывает лишь несколько, и они быстро распадаются.","Seaborgiyum doğada bulunmaz. İlk kez 1974'te ABD'de üretildi. Aynı anda yalnızca birkaç atomu olur ve hızla bozunur."]},
107:{occ:"synthetic",shape:"unknown",t:["Bohrium is not found in nature. Scientists in Darmstadt, Germany, first made it in 1981. Its atoms break apart in about a minute or less.","Борий в природе не встречается. Учёные в Дармштадте (Германия) впервые получили его в 1981 году. Его атомы распадаются примерно за минуту или быстрее.","Bohriyum doğada bulunmaz. Almanya'nın Darmstadt şehrindeki bilim insanları onu ilk kez 1981'de üretti. Atomları yaklaşık bir dakikada ya da daha çabuk bozunur."]},
108:{occ:"synthetic",shape:"unknown",t:["Hassium is not found in nature. It was first made in Germany in 1984 and named after Hesse, the German state where it was made.","Хассий в природе не встречается. Его впервые получили в Германии в 1984 году и назвали в честь земли Гессен.","Hassiyum doğada bulunmaz. İlk kez 1984'te Almanya'da üretildi ve adını Hessen eyaletinden aldı."]},
109:{occ:"synthetic",shape:"unknown",t:["Meitnerium is not found in nature. In 1982 scientists in Germany made just one single atom of it!","Мейтнерий в природе не встречается. В 1982 году учёные в Германии получили всего один его атом!","Meitneriyum doğada bulunmaz. 1982'de Almanya'daki bilim insanları ondan yalnızca tek bir atom üretti!"]},
110:{occ:"synthetic",shape:"unknown",t:["Darmstadtium is not found in nature. It was made in 1994 in Darmstadt, Germany, and named after that city. Its atoms vanish in seconds.","Дармштадтий в природе не встречается. Его получили в 1994 году в городе Дармштадт и назвали в его честь. Его атомы распадаются за секунды.","Darmstadtiyum doğada bulunmaz. 1994'te Almanya'nın Darmstadt şehrinde üretildi ve adını bu şehirden aldı. Atomları saniyeler içinde bozunur."]},
111:{occ:"synthetic",shape:"unknown",t:["Roentgenium is not found in nature. Scientists in Germany first made it in 1994: only a few atoms.","Рентгений в природе не встречается. Учёные в Германии впервые получили его в 1994 году — всего несколько атомов.","Röntgenyum doğada bulunmaz. Almanya'daki bilim insanları onu ilk kez 1994'te üretti: yalnızca birkaç atom."]},
112:{occ:"synthetic",shape:"unknown",t:["Copernicium is not found in nature. Scientists in Germany first made it in 1996. Very few atoms of it have ever been made.","Коперниций в природе не встречается. Учёные в Германии впервые получили его в 1996 году. Его атомов сделали совсем мало.","Kopernikyum doğada bulunmaz. Almanya'daki bilim insanları onu ilk kez 1996'da üretti. Bugüne kadar çok az atomu yapıldı."]},
113:{occ:"synthetic",shape:"unknown",t:["Nihonium is not found in nature. Scientists in Japan worked for nine years and made only three atoms of it!","Нихоний в природе не встречается. Учёные в Японии трудились девять лет и получили всего три его атома!","Nihonyum doğada bulunmaz. Japonya'daki bilim insanları dokuz yıl çalıştı ve ondan yalnızca üç atom üretti!"]},
114:{occ:"synthetic",shape:"unknown",t:["Flerovium is not found in nature. Scientists in Dubna, Russia, first made it in 1998, only a few atoms at a time.","Флеровий в природе не встречается. Учёные в Дубне впервые получили его в 1998 году, всего по нескольку атомов.","Flerovyum doğada bulunmaz. Rusya'daki Dubna'da bilim insanları onu ilk kez 1998'de, birkaç atom olarak üretti."]},
115:{occ:"synthetic",shape:"unknown",t:["Moscovium is not found in nature. It was made in 2003 in Dubna, near Moscow. Its atoms break apart in less than a second.","Московий в природе не встречается. Его получили в 2003 году в Дубне под Москвой. Его атомы распадаются меньше чем за секунду.","Moskovyum doğada bulunmaz. 2003'te Moskova yakınlarındaki Dubna'da üretildi. Atomları bir saniyeden kısa sürede bozunur."]},
116:{occ:"synthetic",shape:"unknown",t:["Livermorium is not found in nature. Scientists from Russia and the USA made it together in 2000. Its atoms last less than a second.","Ливерморий в природе не встречается. Учёные России и США вместе получили его в 2000 году. Его атомы живут меньше секунды.","Livermoryum doğada bulunmaz. Rus ve Amerikalı bilim insanları onu 2000'de birlikte üretti. Atomları bir saniyeden kısa yaşar."]},
117:{occ:"synthetic",shape:"unknown",t:["Tennessine is not found in nature. It was made in 2010 in Dubna, helped by scientists from Tennessee, USA. Only a few dozen atoms were made.","Теннессин в природе не встречается. Его получили в 2010 году в Дубне вместе с учёными из Теннесси (США). Сделано лишь несколько десятков атомов.","Tenesin doğada bulunmaz. 2010'da Dubna'da, ABD'nin Tennessee eyaletinden bilim insanlarının yardımıyla üretildi. Bugüne kadar yalnızca birkaç düzine atomu yapıldı."]},
118:{occ:"synthetic",shape:"unknown",t:["Oganesson is not found in nature. Scientists in Dubna made only about five atoms. Each broke apart in under a thousandth of a second.","Оганесон в природе не встречается. Учёные в Дубне получили всего около пяти атомов, и каждый распался меньше чем за тысячную долю секунды.","Oganesson doğada bulunmaz. Dubna'daki bilim insanları yalnızca beş kadar atom üretti; her biri saniyenin binde birinden kısa sürede bozundu."]}
};

const ZOOM=[
{id:"galaxy",m:1e21,topic:"space",name:["Milky Way galaxy","Галактика Млечный Путь","Samanyolu Galaksisi"],big:["Light takes 100,000 years to cross it","Свету нужно 100 000 лет, чтобы её пересечь","Işık onu 100.000 yılda geçer"],easy:["Our galaxy is a giant spiral of over 100 billion stars. The Sun is just one of them.","Наша галактика — огромная спираль из более чем 100 миллиардов звёзд. Солнце — лишь одна из них.","Evimiz olan galaksi, 100 milyardan fazla yıldızdan oluşan dev bir sarmal. Güneş bunlardan sadece biri."]},
{id:"solar",m:1.2e13,topic:"space",name:["Solar System","Солнечная система","Güneş Sistemi"],big:["Sunlight takes about 4 hours to reach Neptune","Свет Солнца летит до Нептуна около 4 часов","Güneş'in ışığı Neptün'e yaklaşık 4 saatte varır"],easy:["The Sun and the eight planets that circle around it. Earth is the third planet from the Sun.","Солнце и восемь планет, которые кружат вокруг него. Земля — третья планета от Солнца.","Güneş ve etrafında dönen sekiz gezegen. Dünya, Güneş'e en yakın üçüncü gezegendir."]},
{id:"earth",m:1.27e7,topic:"space",name:["Planet Earth","Планета Земля","Dünya gezegeni"],big:["A plane would fly around it in about 2 days","Самолёт облетел бы её примерно за 2 дня","Bir uçak onun etrafını yaklaşık 2 günde dolaşır"],easy:["Our home planet. It is the only place we know with oceans, air to breathe and life.","Наш родной дом. Это единственная известная нам планета с океанами, воздухом и жизнью.","Bizim evimiz. Okyanusları, havası ve canlıları olduğunu bildiğimiz tek gezegen."]},
{id:"child",m:1.2,topic:"body",name:["A child","Ребёнок","Bir çocuk"],big:["About as tall as 12 hands stacked up","Ростом примерно с 12 ладошек, одна над другой","Boyu üst üste yaklaşık 12 el kadar"],easy:["That is you! Your body is made of trillions of tiny cells that work together.","Это ты! Твоё тело состоит из триллионов крошечных клеток, которые работают вместе.","Bu sensin! Vücudun birlikte çalışan trilyonlarca minik hücreden oluşur."]},
{id:"hand",m:0.1,topic:"body",name:["A hand","Ладошка","Bir el"],big:["About as wide as an orange","Шириной примерно с апельсин","Yaklaşık bir portakal genişliğinde"],easy:["Your hand and wrist have 27 bones. Your fingers can feel a bump thinner than a hair!","В кисти руки 27 косточек. Пальцы чувствуют бугорок тоньше волоска!","Elinde ve bileğinde 27 kemik var. Parmakların saç telinden ince bir çıkıntıyı bile hisseder!"]},
{id:"hair",m:7e-5,topic:"cells",name:["Width of a hair","Толщина волоса","Saç telinin kalınlığı"],big:["About as thick as a sheet of paper","Тонкий, почти как лист бумаги","Yaklaşık bir kâğıt yaprağı kadar ince"],easy:["A hair is thin, but you can still see it. To see smaller things, you need a microscope!","Волос тонкий, но его ещё видно глазом. Всё, что меньше, видно только в микроскоп!","Saç teli incedir ama gözle görülür. Daha küçük şeyleri görmek için mikroskop gerekir!"]},
{id:"cell",m:2e-5,topic:"cells",name:["A cell","Клетка","Bir hücre"],big:["About 50 fit in a row across a pinhead","Около 50 клеток поместятся в ряд на булавочной головке","Bir toplu iğnenin başına yan yana yaklaşık 50 tane sığar"],easy:["Cells are the tiny building blocks of all living things. Each one is alive!","Клетки — крошечные кирпичики всего живого. Каждая клетка живая!","Hücreler tüm canlıların minik yapı taşlarıdır. Her biri canlıdır!"]},
{id:"bacteria",m:2e-6,topic:"cells",name:["A bacterium","Бактерия","Bir bakteri"],big:["About 10 fit in a row across one of your cells","Около 10 бактерий поместятся в ряд поперёк одной клетки","Bir hücrenin genişliğine yan yana yaklaşık 10 tane sığar"],easy:["A living thing made of just one cell. Trillions live in your tummy and help you digest food.","Живое существо всего из одной клетки. Триллионы бактерий живут у тебя в животе и помогают переваривать еду.","Tek bir hücreden oluşan bir canlı. Karnında trilyonlarcası yaşar ve yemeği sindirmene yardım eder."]},
{id:"dna",m:2e-9,topic:"body",name:["DNA","ДНК","DNA"],big:["A hair is 35,000 times thicker","Волос в 35 000 раз толще","Bir saç teli bundan 35.000 kat kalındır"],easy:["A twisted ladder inside your cells. It holds the instructions for building you!","Закрученная лесенка внутри твоих клеток. В ней записано, как построить тебя!","Hücrelerinin içinde kıvrık bir merdiven. Seni yapmanın tarifi onun içinde yazılı!"]},
{id:"molecule",m:3e-10,topic:"matter",name:["A water molecule","Молекула воды","Su molekülü"],big:["One drop of water has more molecules than the Milky Way has stars","В одной капле воды молекул больше, чем звёзд в Млечном Пути","Bir damla suda Samanyolu'ndaki yıldızlardan daha çok molekül vardır"],easy:["Two hydrogen atoms hold hands with one oxygen atom. That is H₂O, water!","Два атома водорода держатся за руки с одним атомом кислорода. Это H₂O, вода!","İki hidrojen atomu bir oksijen atomuyla el ele tutuşur. İşte H₂O, yani su!"]},
{id:"atom",m:1e-10,topic:"elements",name:["An atom","Атом","Bir atom"],big:["A million in a row are as wide as a hair","Миллион атомов в ряд — как толщина волоса","Yan yana bir milyon atom, bir saç teli kalınlığındadır"],easy:["Everything is made of atoms: you, the air and the stars. There are 118 kinds, called elements.","Всё на свете состоит из атомов: ты, воздух и звёзды. Есть 118 видов атомов, это химические элементы.","Her şey atomlardan oluşur: sen, hava ve yıldızlar. 118 çeşit atom vardır, bunlara element denir."]},
{id:"nucleus",m:1e-14,topic:"elements",name:["Atomic nucleus","Атомное ядро","Atom çekirdeği"],big:["If an atom were a stadium, the nucleus would be a pea","Если атом — стадион, то ядро — горошина в центре","Atom bir stadyum olsaydı, çekirdek ortasındaki bir bezelye olurdu"],easy:["The tiny center of an atom. Almost all of the atom's weight is packed inside it!","Крошечный центр атома. В нём спрятан почти весь вес атома!","Atomun minik merkezi. Atomun neredeyse bütün ağırlığı onun içindedir!"]}

const SPACET={
sysT:["The solar system","Солнечная система","Güneş Sistemi"],
sys:["The solar system is the Sun and everything that goes around it. Eight planets travel around the Sun on paths called orbits. Many moons, asteroids and comets are part of it too.","Солнечная система — это Солнце и всё, что вокруг него летает. Восемь планет движутся вокруг Солнца по своим путям — орбитам. А ещё в ней много спутников, астероидов и комет.","Güneş Sistemi, Güneş ve onun etrafında dolanan her şeydir. Sekiz gezegen, yörünge denen yollarda Güneş'in etrafında döner. Pek çok uydu, asteroit ve kuyrukluyıldız da Güneş Sistemi'ndedir."],
dayT:["Why do day and night happen?","Почему бывают день и ночь?","Gece ve gündüz neden olur?"],
day:["Earth spins like a top, once in about 24 hours. The side facing the Sun has day. The side facing away from the Sun has night.","Земля крутится, как юла, и делает один оборот примерно за 24 часа. На той стороне, что повёрнута к Солнцу, день. На другой стороне ночь.","Dünya bir topaç gibi kendi etrafında döner ve bir turu yaklaşık 24 saatte tamamlar. Güneş'e bakan tarafta gündüz olur. Güneş'e arkasını dönen tarafta ise gece olur."],
seasonT:["Why do we have seasons?","Почему меняются времена года?","Mevsimler neden olur?"],
season:["Seasons happen because Earth is tilted, not because it gets closer to the Sun. When your half of Earth leans toward the Sun, sunlight is stronger and days are longer, so it is summer. When it leans away, it is winter.","Времена года бывают потому, что Земля наклонена, а не потому, что она подлетает ближе к Солнцу. Когда твоя половина Земли наклонена к Солнцу, лучи греют сильнее и дни длиннее, и наступает лето. Когда она наклонена от Солнца, наступает зима.","Mevsimler, Dünya Güneş'e yaklaştığı için değil, Dünya'nın ekseni eğik olduğu için olur. Yaşadığın yarım küre Güneş'e doğru eğildiğinde ışınlar daha güçlü gelir ve günler uzar, yani yaz olur. Güneş'ten uzağa eğildiğinde kış olur."],
moonT:["Why does the Moon change shape?","Почему Луна меняет форму?","Ay neden şekil değiştirir?"],
moon:["The Moon does not glow by itself. Sunlight lights up half of it, and as it goes around Earth we see more or less of that bright half. The whole cycle takes about 29.5 days.","Луна сама не светится. Солнце освещает её половину, а пока Луна летает вокруг Земли, мы видим то больше, то меньше этой светлой половины. Весь круг занимает около 29,5 дня.","Ay kendi kendine ışık saçmaz. Güneş Ay'ın yarısını aydınlatır; Ay, Dünya'nın etrafında dolanırken bu aydınlık yarının bazen çoğunu, bazen azını görürüz. Ay'ın evrelerinin tamamı yaklaşık 29,5 gün sürer."],

easy:["A solid keeps its own shape. You can hold it in your hand.","Твёрдое тело сохраняет свою форму. Его можно взять в руку.","Katı kendi şeklini korur. Onu elinde tutabilirsin."],
sci:["A solid has a fixed shape and a fixed volume, because its particles are packed tightly and only wiggle in place.","У твёрдого тела есть своя форма и свой объём: его частицы плотно упакованы и только дрожат на месте.","Katının belirli bir şekli ve hacmi vardır, çünkü tanecikleri sıkıca dizilmiştir ve yalnızca yerinde titreşir."],

sci:["A liquid has a fixed volume but no fixed shape. Its particles stay close together but can slide past each other.","У жидкости есть свой объём, но нет своей формы. Её частицы находятся близко, но могут скользить друг мимо друга.","Sıvının belirli bir hacmi vardır ama belirli bir şekli yoktur. Tanecikleri birbirine yakındır ama birbirinin üzerinden kayabilir."],

sci:["A gas has no fixed shape or volume. Its particles are far apart and fly around fast, so a gas can be squeezed.","У газа нет ни своей формы, ни своего объёма. Его частицы далеко друг от друга и быстро летают, поэтому газ можно сжать.","Gazın belirli bir şekli ve hacmi yoktur. Tanecikleri birbirinden uzaktır ve hızla hareket eder, bu yüzden gaz sıkıştırılabilir."],

melt:{name:["Melting","Плавление","Erime"],from:"solid",to:"liquid",
easy:["When ice gets warm, it melts and turns into water.","Когда лёд нагревается, он тает и становится водой.","Buz ısınınca erir ve suya dönüşür."],
sci:["Melting is when a solid turns into a liquid as it is heated. Pure ice melts at 0 °C.","Плавление: твёрдое тело при нагревании становится жидкостью. Чистый лёд плавится при 0 °C.","Erime, katının ısı alarak sıvıya dönüşmesidir. Saf buz 0 °C sıcaklıkta erir."]},
freeze:{name:["Freezing","Замерзание","Donma"],from:"liquid",to:"solid",
easy:["When water gets very cold, it freezes and turns into ice.","Когда вода сильно остывает, она замерзает и становится льдом.","Su çok soğuyunca donar ve buza dönüşür."],
sci:["Freezing is when a liquid turns into a solid as it cools. Pure water freezes at 0 °C, and ice takes up more space than the water did.","Замерзание: жидкость при охлаждении становится твёрдым телом. Чистая вода замерзает при 0 °C, а лёд занимает больше места, чем вода.","Donma, sıvının ısı vererek katıya dönüşmesidir. Saf su 0 °C sıcaklıkta donar ve buz, suyun kapladığından daha fazla yer kaplar."]},
evap:{name:["Evaporation","Испарение","Buharlaşma"],from:"liquid",to:"gas",
easy:["A wet puddle slowly dries up. The water turns into invisible vapour in the air.","Лужа медленно высыхает. Вода превращается в невидимый пар в воздухе.","Islak bir su birikintisi yavaşça kurur. Su, havada görünmez buhara dönüşür."],
sci:["Evaporation happens at the surface of a liquid at any temperature. The fastest particles escape into the air. Warmth and wind make it quicker.","Испарение идёт с поверхности жидкости при любой температуре: самые быстрые частицы улетают в воздух. Тепло и ветер его ускоряют.","Buharlaşma, sıvının yüzeyinde her sıcaklıkta olur. En hızlı tanecikler havaya kaçar. Sıcaklık ve rüzgâr buharlaşmayı hızlandırır."]},
boil:{name:["Boiling","Кипение","Kaynama"],from:"liquid",to:"gas",
easy:["Very hot water boils. Big bubbles of vapour rise up inside it.","Очень горячая вода кипит. Внутри неё поднимаются большие пузыри пара.","Çok sıcak su kaynar. İçinde büyük buhar kabarcıkları yükselir."],
sci:["Boiling is fast evaporation inside the whole liquid, with bubbles of vapour. At sea level pure water boils at 100 °C.","Кипение: бурное парообразование во всей жидкости, с пузырями пара. На уровне моря чистая вода кипит при 100 °C.","Kaynama, sıvının her yerinde buhar kabarcıklarıyla olan hızlı buharlaşmadır. Deniz seviyesinde saf su 100 °C sıcaklıkta kaynar."]},
cond:{name:["Condensation","Конденсация","Yoğuşma"],from:"gas",to:"liquid",
easy:["Vapour touches a cold glass and turns back into tiny water drops.","Пар касается холодного стакана и снова становится капельками воды.","Buhar soğuk bir bardağa değince yeniden küçük su damlacıklarına dönüşür."],
sci:["Condensation is when a gas cools and turns into a liquid. Steam itself is invisible; the white cloud above a kettle is tiny droplets.","Конденсация: газ остывает и становится жидкостью. Сам пар невидим, а белое облачко над чайником состоит из крошечных капелек.","Yoğuşma, gazın soğuyarak sıvıya dönüşmesidir. Su buharının kendisi görünmez; çaydanlığın üstündeki beyaz bulut minicik damlacıklardır."]},
subl:{name:["Sublimation","Сублимация","Süblimleşme"],from:"solid",to:"gas",
easy:["Some solids turn straight into gas, without melting first. Dry ice does this.","Некоторые твёрдые тела сразу становятся газом, не тая. Так делает сухой лёд.","Bazı katılar önce erimeden doğrudan gaza dönüşür. Kuru buz böyle yapar."],
sci:["Sublimation is when a solid turns straight into a gas, skipping the liquid. Dry ice does it, and snow slowly sublimes on cold, dry, sunny days.","Сублимация: твёрдое тело сразу становится газом, минуя жидкость. Так ведёт себя сухой лёд, и снег тоже понемногу испаряется в морозный сухой день.","Süblimleşme, katının sıvı olmadan doğrudan gaza dönüşmesidir. Kuru buz böyle davranır; kar da soğuk, kuru ve güneşli günlerde yavaşça süblimleşir."]},
depo:{name:["Deposition","Десублимация","Kırağılaşma"],from:"gas",to:"solid",
easy:["On a frosty night, vapour turns straight into ice. We call it frost.","Морозной ночью пар сразу становится льдом. Это иней.","Soğuk bir gecede buhar doğrudan buza dönüşür. Buna kırağı denir."],
sci:["Deposition is when a gas turns straight into a solid. Frost on windows and grass forms when water vapour freezes into ice crystals.","Десублимация: газ сразу становится твёрдым телом. Иней на окнах и траве появляется, когда водяной пар превращается в кристаллики льда.","Kırağılaşma, gazın doğrudan katıya dönüşmesidir. Camlarda ve otlarda kırağı, su buharı buz kristallerine dönüşünce oluşur."]}

easy:["The Sun warms seas, lakes and puddles. Water rises into the air as invisible vapour.","Солнце греет моря, озёра и лужи. Вода поднимается в воздух невидимым паром.","Güneş denizleri, gölleri ve su birikintilerini ısıtır. Su, görünmez buhar olarak havaya yükselir."]},
cond:{name:["Condensation: clouds form","Конденсация: появляются облака","Yoğuşma: bulutlar oluşur"],
easy:["High in the sky it is cold. Vapour turns into tiny drops, and they make clouds.","Высоко в небе холодно. Пар становится крошечными капельками, и из них получаются облака.","Gökyüzünde yukarılar soğuktur. Buhar minicik damlacıklara dönüşür ve bulutları oluşturur."]},
prec:{name:["Precipitation","Осадки","Yağış"],
easy:["Drops join and get heavy. They fall as rain, or as snow when it is cold.","Капли сливаются и тяжелеют. Они падают дождём, а в холод снегом.","Damlacıklar birleşip ağırlaşır. Yağmur olarak, soğukta da kar olarak düşer."]},
coll:{name:["Collection","Сбор воды","Toplanma"],
easy:["Water gathers in rivers, lakes and seas, and soaks into the ground. Then it starts again.","Вода собирается в реках, озёрах и морях и уходит под землю. И всё начинается снова.","Su nehirlerde, göllerde, denizlerde toplanır ve toprağın altına sızar. Sonra her şey yeniden başlar."]}
};
const MATTERT={
whatT:["What is everything made of?","Из чего всё состоит?","Her şey neyden yapılmıştır?"],
what:["Everything around us is made of tiny particles called atoms and molecules. They are far too small to see, even with a magnifying glass, and they never stop moving.","Всё вокруг состоит из крошечных частиц: атомов и молекул. Они такие маленькие, что их не видно даже в лупу, и они всё время движутся.","Çevremizdeki her şey atom ve molekül denen minicik taneciklerden oluşur. Bunlar büyüteçle bile görülemeyecek kadar küçüktür ve hiç durmadan hareket eder."],
partT:["How do particles behave?","Как ведут себя частицы?","Tanecikler nasıl davranır?"],
part:["In a solid, particles sit close together and wiggle in place. In a liquid, they stay close but slide past each other. In a gas, they are far apart and fly around fast.","В твёрдом теле частицы плотно прижаты и дрожат на месте. В жидкости они близко, но скользят друг мимо друга. В газе они далеко друг от друга и быстро летают.","Katıda tanecikler birbirine çok yakındır ve yerinde titreşir. Sıvıda yakındırlar ama birbirinin üzerinden kayarlar. Gazda birbirinden uzaktırlar ve hızla hareket ederler."],
heatT:["Heating and cooling","Нагревание и охлаждение","Isınma ve soğuma"],
heat:["Heating makes particles move faster, so a solid can melt and a liquid can turn into gas. Cooling slows them down, so a gas can turn into liquid and a liquid can freeze.","Нагревание заставляет частицы двигаться быстрее: твёрдое тело может расплавиться, а жидкость стать газом. Охлаждение замедляет их: газ может стать жидкостью, а жидкость замёрзнуть.","Isıtınca tanecikler daha hızlı hareket eder; katı eriyebilir, sıvı gaza dönüşebilir. Soğutunca yavaşlarlar; gaz sıvıya dönüşebilir, sıvı donabilir."],
cycleT:["The water cycle","Круговорот воды","Su döngüsü"],
cycle:["Water evaporates, forms clouds, falls as rain or snow and collects in rivers and seas. The same water has gone round and round like this for billions of years, so you may drink water a dinosaur once drank!","Вода испаряется, собирается в облака, выпадает дождём или снегом и стекает в реки и моря. Одна и та же вода ходит по этому кругу миллиарды лет, так что, может быть, ты пьёшь воду, которую когда-то пил динозавр!","Su buharlaşır, bulut olur, yağmur ya da kar olarak yağar ve nehirlerde, denizlerde toplanır. Aynı su milyarlarca yıldır bu döngüde dolaşıyor; belki de bir zamanlar bir dinozorun içtiği suyu içiyorsun!"]}
;
const BODY={
brain:{name:["Brain","Мозг","Beyin"],job:["The boss","Главный командир","Komutan"],
easy:["Your brain is inside your head. It thinks, remembers and tells your body what to do.","Мозг живёт в голове. Он думает, помнит и говорит телу, что делать.","Beynin başının içindedir. Düşünür, hatırlar ve vücuduna ne yapacağını söyler."],
sci:["The brain has about 86 billion nerve cells called neurons. They send tiny electric signals, and all parts of the brain work every day.","В мозге около 86 миллиардов нервных клеток, их называют нейронами. Они передают крошечные электрические сигналы, и все части мозга работают каждый день.","Beyinde nöron denen yaklaşık 86 milyar sinir hücresi vardır. Nöronlar küçük elektrik sinyalleri gönderir ve beynin bütün bölümleri her gün çalışır."]},
heart:{name:["Heart","Сердце","Kalp"],job:["The pump","Насос","Pompa"],
easy:["Your heart is a strong muscle. It pumps blood all around your body, day and night.","Сердце — сильная мышца. Оно качает кровь по всему телу днём и ночью.","Kalbin güçlü bir kastır. Gece gündüz kanı bütün vücuduna pompalar."],
sci:["An adult heart beats about 60 to 100 times a minute at rest, and a child's beats faster. Blood is always red, darker red in veins.","Сердце взрослого в покое бьётся примерно 60–100 раз в минуту, а у детей чаще. Кровь всегда красная, в венах она темнее.","Yetişkin kalbi dinlenirken dakikada yaklaşık 60 ile 100 kez atar, çocuklarınki daha hızlı atar. Kan her zaman kırmızıdır, toplardamarlarda daha koyu kırmızıdır."]},
lungs:{name:["Lungs","Лёгкие","Akciğerler"],job:["Air balloons","Воздушные шарики","Hava balonları"],
easy:["You have two lungs in your chest. They fill with air like balloons when you breathe in.","В груди у тебя два лёгких. Когда ты вдыхаешь, они наполняются воздухом, как шарики.","Göğsünde iki akciğer var. Nefes aldığında balon gibi havayla dolarlar."],
sci:["Lungs move oxygen from the air into your blood and push carbon dioxide out. Inside are millions of tiny air sacs called alveoli.","Лёгкие передают кислород из воздуха в кровь и выводят углекислый газ. Внутри них миллионы крошечных пузырьков, их называют альвеолами.","Akciğerler havadaki oksijeni kana geçirir ve karbondioksiti dışarı atar. İçlerinde alveol denen milyonlarca küçük hava kesesi vardır."]},
stomach:{name:["Stomach","Желудок","Mide"],job:["The mixer","Миксер","Mikser"],
easy:["Your stomach is a stretchy bag. It squeezes and mixes your food into a soft mush.","Желудок — мешочек, который умеет растягиваться. Он сжимается и перемешивает еду в мягкую кашицу.","Miden esneyen bir torba gibidir. Yemeği sıkar ve karıştırıp yumuşak bir lapa yapar."],
sci:["The stomach makes strong acid and enzymes that start breaking food down. A thick layer of mucus protects its own walls.","Желудок выделяет сильную кислоту и ферменты, которые начинают расщеплять еду. Толстый слой слизи защищает его стенки.","Mide, yemeği parçalamaya başlayan güçlü bir asit ve enzimler üretir. Kalın bir mukus tabakası midenin kendi duvarlarını korur."]},
intestines:{name:["Intestines","Кишечник","Bağırsaklar"],job:["The food tube","Трубка для еды","Besin tüpü"],
easy:["Your intestines are a long, folded tube. They take the good parts of food into your body.","Кишечник — длинная свёрнутая трубка. Он забирает из еды всё полезное для тела.","Bağırsakların uzun ve kıvrımlı bir tüptür. Besinlerin yararlı kısımlarını vücuduna alır."],
sci:["The small intestine is about 6 metres long in adults. Tiny finger-like villi pass nutrients into the blood, and the large intestine takes back water.","Тонкая кишка у взрослого длиной около 6 метров. Крошечные ворсинки передают питательные вещества в кровь, а толстая кишка забирает воду.","Yetişkinlerde ince bağırsak yaklaşık 6 metre uzunluğundadır. Parmak gibi küçük villuslar besinleri kana geçirir, kalın bağırsak ise suyu geri alır."]},
liver:{name:["Liver","Печень","Karaciğer"],job:["Cleaner and storeroom","Чистильщик и кладовая","Temizleyici ve depo"],
easy:["Your liver is a big organ under your ribs. It cleans your blood and stores energy.","Печень — большой орган под рёбрами. Она очищает кровь и хранит запас энергии.","Karaciğerin kaburgalarının altında büyük bir organdır. Kanını temizler ve enerji depolar."],
sci:["The liver is the largest organ inside the body and does hundreds of jobs. It makes bile to digest fat and can regrow lost parts.","Печень — самый большой внутренний орган, у неё сотни задач. Она делает жёлчь для переваривания жира и может отрастить потерянные части.","Karaciğer vücudun içindeki en büyük organdır ve yüzlerce iş yapar. Yağları sindirmek için safra yapar ve kaybettiği parçaları yeniden büyütebilir."]},
kidneys:{name:["Kidneys","Почки","Böbrekler"],job:["Water filters","Фильтры для воды","Su filtreleri"],
easy:["You have two kidneys, shaped like beans. They clean your blood and make pee.","У тебя две почки, похожие на фасолины. Они очищают кровь и делают мочу.","İki böbreğin var, fasulye şeklindeler. Kanını temizler ve çişi yaparlar."],
sci:["Each kidney has about a million tiny filters called nephrons. Together they clean all your blood many times a day and remove waste as urine.","В каждой почке около миллиона крошечных фильтров, их называют нефронами. Вместе они много раз в день очищают всю кровь и выводят отходы с мочой.","Her böbrekte nefron denen yaklaşık bir milyon küçük filtre vardır. Birlikte bütün kanı günde birçok kez temizler ve atıkları idrarla atarlar."]},
bones:{name:["Skeleton","Скелет","İskelet"],job:["The frame","Каркас","Vücudun çatısı"],
easy:["Your skeleton is made of bones. It holds you up and protects your brain and heart.","Скелет состоит из костей. Он держит тело и защищает мозг и сердце.","İskeletin kemiklerden yapılmıştır. Seni dik tutar, beynini ve kalbini korur."],
sci:["Adults have 206 bones, but babies are born with about 270 to 300. Some join together as you grow. Bones are alive and make blood cells.","У взрослого 206 костей, а малыш рождается примерно с 270–300. Пока ты растёшь, некоторые срастаются. Кости живые и делают клетки крови.","Yetişkinlerde 206 kemik vardır, bebekler ise yaklaşık 270 ile 300 kemikle doğar. Büyüdükçe bazıları birleşir. Kemikler canlıdır ve kan hücreleri yapar."]},
muscles:{name:["Muscles","Мышцы","Kaslar"],job:["The movers","Двигатели","Hareket ettiriciler"],
easy:["Muscles pull on your bones to make you move. They help you run, jump and smile.","Мышцы тянут кости, и ты двигаешься. Они помогают бегать, прыгать и улыбаться.","Kaslar kemiklerini çekerek seni hareket ettirir. Koşmana, zıplamana ve gülümsemene yardım ederler."],
sci:["You have more than 600 muscles. Muscles can only pull, not push, so they often work in pairs. Your heart is a muscle that never rests.","У тебя больше 600 мышц. Мышцы умеют только тянуть, а не толкать, поэтому часто работают парами. Сердце — мышца, которая никогда не отдыхает.","Vücudunda 600'den fazla kas vardır. Kaslar sadece çekebilir, itemez, bu yüzden çoğu zaman çiftler hâlinde çalışır. Kalbin hiç dinlenmeyen bir kastır."]},
skin:{name:["Skin","Кожа","Deri"],job:["The raincoat","Защитный плащ","Koruyucu kalkan"],
easy:["Skin covers your whole body. It keeps germs and water out and helps you feel touch.","Кожа покрывает всё тело. Она не пускает внутрь микробов и воду и помогает чувствовать прикосновения.","Deri bütün vücudunu kaplar. Mikropları ve suyu dışarıda tutar, dokunmayı hissetmene yardım eder."],
sci:["Skin is the largest organ of the body. It sweats to cool you down, and its outer layer is replaced with new cells about every month.","Кожа — самый большой орган тела. Она потеет, чтобы тебя охладить, а её верхний слой обновляется примерно каждый месяц.","Deri vücudun en büyük organıdır. Seni serinletmek için terler ve dış tabakası yaklaşık her ay yeni hücrelerle yenilenir."]},
eyes:{name:["Eyes","Глаза","Gözler"],job:["The cameras","Камеры","Kameralar"],
easy:["Your eyes catch light so you can see. They see colours, shapes and movement.","Глаза ловят свет, и ты видишь. Они различают цвета, формы и движение.","Gözlerin ışığı yakalar, böylece görebilirsin. Renkleri, şekilleri ve hareketi görürler."],
sci:["Light passes through the lens to the retina, which turns it into nerve signals. The picture lands upside down, and your brain flips it.","Свет проходит через хрусталик на сетчатку, а она превращает его в нервные сигналы. Картинка получается перевёрнутой, и мозг её переворачивает.","Işık mercekten geçip retinaya ulaşır, retina onu sinir sinyallerine çevirir. Görüntü ters düşer ve beynin onu düzeltir."]},
ears:{name:["Ears","Уши","Kulaklar"],job:["The microphones","Микрофоны","Mikrofonlar"],
easy:["Your ears catch sounds. They also help you keep your balance.","Уши ловят звуки. А ещё они помогают держать равновесие.","Kulakların sesleri yakalar. Dengeni korumana da yardım ederler."],
sci:["Sound makes your eardrum shake, and three tiny bones pass the shaking on. The stirrup in your ear is the smallest bone in your body.","Звук заставляет дрожать барабанную перепонку, а три крошечные косточки передают дрожь дальше. Стремечко в ухе — самая маленькая кость тела.","Ses kulak zarını titretir ve üç küçük kemik bu titreşimi iletir. Kulaktaki üzengi kemiği vücudun en küçük kemiğidir."]}
};
const DNA={
body:{name:["Body","Тело","Vücut"],
easy:["Your body is made of trillions of tiny cells, too small to see.","Твоё тело состоит из триллионов крошечных клеток. Без микроскопа их не видно.","Vücudun trilyonlarca küçük hücreden yapılmıştır. Hücreler gözle görülemeyecek kadar küçüktür."]},
cell:{name:["Cell","Клетка","Hücre"],
easy:["A cell is a tiny living building block. Most cells have a nucleus in the middle.","Клетка — крошечный живой кирпичик. У большинства клеток внутри есть ядро.","Hücre küçük, canlı bir yapı taşıdır. Çoğu hücrenin içinde bir çekirdek vardır."]},
nucleus:{name:["Nucleus","Ядро","Çekirdek"],
easy:["The nucleus is the control room of the cell. It keeps 46 chromosomes.","Ядро — пульт управления клетки. В нём хранятся 46 хромосом.","Çekirdek hücrenin kontrol odasıdır. İçinde 46 kromozom saklanır."]},
chromosome:{name:["Chromosome","Хромосома","Kromozom"],
easy:["A chromosome is a very long thread of DNA, wound up tightly like thread on a spool.","Хромосома — очень длинная нить ДНК, туго смотанная, как нитки на катушке.","Kromozom, makaraya sarılmış ip gibi sıkıca sarılmış çok uzun bir DNA ipliğidir."]},
dna:{name:["DNA","ДНК","DNA"],
easy:["DNA is a twisted ladder called a double helix. Its steps use four letters: A, T, G and C.","ДНК — закрученная лесенка, её называют двойной спиралью. Её ступеньки записаны четырьмя буквами: A, T, G и C.","DNA, çift sarmal denen bükülmüş bir merdivendir. Basamakları dört harfle yazılır: A, T, G ve C."]},
gene:{name:["Gene","Ген","Gen"],
easy:["A gene is one instruction in your DNA, like part of the recipe for your eye colour.","Ген — одна инструкция в ДНК, например часть рецепта цвета твоих глаз.","Gen, DNA'ndaki tek bir talimattır. Örneğin göz renginin tarifinin bir parçası olabilir."]}

const BODYT={
whatT:["What is your body made of?","Из чего состоит тело?","Vücudun nelerden oluşur?"],
what:["Your body has organs, like the heart, lungs and brain. They work together in teams called systems, like the team that digests food.","В теле есть органы: сердце, лёгкие, мозг и другие. Они работают вместе командами, которые называются системами. Например, одна команда переваривает еду.","Vücudunda kalp, akciğerler ve beyin gibi organlar vardır. Organlar sistem denen takımlarda birlikte çalışır. Örneğin bir takım besinleri sindirir."],
dnaT:["DNA: your instruction book","ДНК: твоя книга инструкций","DNA: talimat kitabın"],
dna:["Almost every cell keeps a copy of DNA, the instruction book for building you. Half came from your mum and half from your dad.","Почти в каждой клетке есть копия ДНК. Это книга инструкций, по которой строится твоё тело. Половина досталась тебе от мамы, половина от папы.","Neredeyse her hücrende DNA'nın bir kopyası vardır. DNA seni yapmak için bir talimat kitabıdır. Yarısı annenden, yarısı babandan gelir."],
sizeT:["Wow fact!","Ого!","İnanılmaz ama gerçek!"],
size:["If you unwound all the DNA from just one of your cells, it would be about 2 metres long!","Если размотать всю ДНК из одной твоей клетки, получится нить длиной около 2 метров!","Tek bir hücrendeki bütün DNA'yı açıp uzatsan, yaklaşık 2 metre uzunluğunda olurdu!"]
