<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3550f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Science">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script src="vendor/peerjs.min.js"></script>
</head>
<body>
<title>Element Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Onest:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a child's science kit, bright and clear, printed rather than squishy
   IDEA a classroom wall chart: crisp coloured cells, ruled edges, one sticker star per element the child has read
   PICTURE the periodic table itself, full width; every cell opens a spinning 3D atom or molecule
   COLOUR white or night ground, cobalt header band, ten flat category colours with darker edges, gold for stars
   TYPE Onest for interface, symbols and numbers; Andika (a typeface made for early readers) for every word the child reads
   LAYOUT laptop or tablet: header band, game row, the table across the full width, legend and progress below; phone: table scrolls in its own box */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#10121c);--ink:light-dark(#171a2e,#eef0f8);--soft:light-dark(#f3f4f8,#1a1d2b);--line:light-dark(#d6d9e4,#2e3247);--mute:light-dark(#545a72,#a7adc6);--brand:#2f4be0;--star:#ffb300;--tink:#171a2e;--sya:light-dark(#1d5fd0,#7cb4ff);--syb:light-dark(#d02f63,#ff8fb1);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r1:3px;--r2:6px;--r3:10px;--ui:Onest,system-ui,sans-serif;--read:Andika,Onest,system-ui,sans-serif;--edge:color-mix(in srgb,var(--c) 72%,#000)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--ui);overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--star);outline-offset:2px}
.c-alk{--c:#ff6b6b}.c-ae{--c:#ffa94d}.c-tm{--c:#ffd43b}.c-ptm{--c:#a9e34b}.c-mtl{--c:#63e6be}.c-nm{--c:#4dabf7}.c-hal{--c:#b197fc}.c-ng{--c:#f783ac}.c-lan{--c:#ffc078}.c-act{--c:#e599f7}
/* header */
.top{position:sticky;top:0;z-index:10;transition:transform .25s;background:var(--brand);color:#fff;margin-top:calc(-1*env(safe-area-inset-top,0px));padding:calc(env(safe-area-inset-top,0px) + var(--s3)) max(4vw,16px,env(safe-area-inset-right,0px)) var(--s3) max(4vw,16px,env(safe-area-inset-left,0px))}
.top.away{transform:translateY(-100%)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s5);justify-content:space-between}
h1{margin:0;font-size:clamp(24px,3vw,34px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.ctrls{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.14);border-radius:var(--r2);padding:3px}
.seg button{padding:0 var(--s3);border-radius:4px;font-weight:700;font-size:15px;min-height:36px;white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:var(--brand)}
.stars{display:flex;align-items:center;gap:var(--s2);background:#fff;color:var(--tink);border-radius:var(--r2);padding:0 var(--s3);min-height:42px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.stars svg{width:20px;height:20px;fill:var(--star)}
.gear{width:42px;height:42px;border-radius:var(--r2);background:rgba(255,255,255,.14);display:grid;place-items:center}
.gear svg{width:22px;height:22px;fill:#fff}
.tocell{color:#fff}.tocell .ic{fill:none;stroke:#fff}
main{padding:var(--s5) max(4vw,16px,env(safe-area-inset-right,0px)) var(--s6) max(4vw,16px,env(safe-area-inset-left,0px));display:grid;gap:var(--s5)}
/* shared controls */
.pill{background:var(--brand);color:#fff;border-radius:var(--r2);padding:0 var(--s4);font-weight:700;min-height:44px;white-space:nowrap}
.pill.alt{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.qp{color:var(--mute);font-weight:600;font-size:15px}
.qword{font-family:var(--read);font-size:clamp(34px,5.4vw,56px);font-weight:700;line-height:1.1}
.rst{justify-self:start;background:#ffe3e3;color:#a11;padding:0 var(--s4);min-height:44px;border-radius:var(--r2);font-weight:700}
.vnote{color:#a35200;font-size:14px}
.help{color:var(--mute);font-size:15px;margin:0}
.help b{color:var(--ink)}
/* prompt bars: quiz and game goals share one layout */
.quiz{position:sticky;top:var(--hdr,0px);z-index:5;transition:top .25s;box-shadow:0 0 0 1px var(--line),0 6px 12px rgba(0,0,0,.06)}
.quiz,.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:var(--s4);row-gap:var(--s1);background:var(--soft);border-radius:var(--r3);padding:var(--s3) var(--s4) var(--s3) var(--s5)}
.quiz .qp,.goal .qp,.quiz .qword,.goal .qword{grid-column:1}
.qbtns,.gb{grid-column:2;grid-row:1/3;display:flex;flex-wrap:wrap;gap:var(--s2);justify-content:flex-end}
.qmsg{grid-column:1/-1;font-size:19px;font-weight:700}
.qmsg:empty{display:none}
.qmsg.ok,.bmsg.ok{color:#2b8a3e}.qmsg.bad{color:#c92a2a}
.goal .qword{font-size:clamp(30px,4vw,44px)}
/* games row */
.shelf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s3)}
@media(max-width:1100px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}
.game{display:flex;align-items:center;gap:var(--s2);border-radius:var(--r2);padding:0 var(--s3);background:var(--g);color:var(--tink);text-align:left;font-weight:700;font-size:15px;line-height:1.15;min-height:46px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--g) 70%,#000)}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.game .ic{width:22px;height:22px}
.ls{display:none}
.g5{--g:#74c0fc}.g6{--g:#c0eb75}.g1{--g:#ffd43b}.g2{--g:#63e6be}.g3{--g:#ffa94d}.g4{--g:#b197fc}
/* the table */
.scroll{overflow-x:auto;padding-bottom:var(--s1)}
.pt{display:grid;grid-template-columns:repeat(18,minmax(38px,1fr));grid-template-rows:repeat(7,auto) var(--s4) auto auto;gap:3px;min-width:740px}
.el{container-type:inline-size;position:relative;aspect-ratio:1/1.1;background:var(--c,#ccc);color:var(--tink);border-radius:var(--r1);box-shadow:inset 0 0 0 1px var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;transition:transform .15s,opacity .2s}
.el:active{transform:scale(.93)}
.el small{position:absolute;top:3px;left:5px;font-size:11px;font-weight:600;opacity:.8;font-variant-numeric:tabular-nums}
.el b{font-size:clamp(14px,38cqi,28px);font-weight:700;line-height:1;letter-spacing:-.01em}
.el i{font-style:normal;font-size:clamp(8px,14cqi,12px);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@container (max-width:42px){.el i{display:none}}
.pt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tip{position:fixed;z-index:30;pointer-events:none;display:flex;align-items:baseline;gap:var(--s2);background:var(--ink);color:var(--bg);border-radius:var(--r2);padding:var(--s2) var(--s3);box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap}
.tip small{font-size:13px;opacity:.75}
.tip b{font-size:18px}
.tip span{font-family:var(--read);font-size:22px;font-weight:700}
.tip .sy .s:nth-child(odd){color:light-dark(#9cc3ff,#1d5fd0)}
.tip .sy .s:nth-child(even){color:light-dark(#ffa3c0,#d02f63)}
@container (max-width:46px){.el small{position:static;font-size:10px;line-height:1;margin-bottom:2px}.el b{font-size:15px}}
.el.ph{opacity:.7;font-size:12px;font-weight:600;cursor:pointer}
.flab{align-self:center;justify-self:end;font-size:12px;font-weight:700;color:var(--mute);padding:0 var(--s1);min-height:32px;white-space:nowrap}
.key{align-self:center;justify-self:center;display:flex;align-items:center;gap:var(--s4);max-width:100%;padding:0 var(--s2);font-size:clamp(11px,1.25vw,15px);line-height:1.3}
.kt{flex:none;width:clamp(52px,6.5vw,78px);aspect-ratio:1/1.1;background:var(--c);color:var(--tink);border-radius:var(--r1);box-shadow:inset 0 0 0 1px var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.kt small{position:absolute;top:3px;left:6px;font-size:clamp(10px,1.1vw,13px);font-weight:600}
.kt b{font-size:clamp(20px,2.6vw,32px);font-weight:700;line-height:1}
.kt i{font-style:normal;font-size:clamp(8px,.95vw,12px);font-weight:600;max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kl{display:grid;gap:1px;min-width:0}
.kl>b{font-weight:700;margin-bottom:2px}
.kl span{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kl em{font-style:normal;font-weight:700;color:var(--ink);display:inline-block;min-width:1.6em}
.kl .kn{font-family:var(--read);min-width:0}
.kl .kc{width:.9em;height:.9em;min-width:0;border-radius:2px;background:var(--c);vertical-align:-1px;box-shadow:inset 0 0 0 1px var(--edge)}
.kf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s1) var(--s3);align-items:center;max-width:560px}
.kf b{display:flex;align-items:center;gap:6px;font-weight:700}
.kf b i{width:12px;height:12px;border-radius:2px;background:var(--c);box-shadow:inset 0 0 0 1px var(--edge)}
.kf p{grid-column:1;margin:0;color:var(--ink)}
.kf .pill{grid-column:2;grid-row:1/3;min-height:36px}
.el.got::after{content:"";position:absolute;top:-6px;right:-6px;width:18px;height:18px;background:var(--star);clip-path:polygon(50% 0,63% 35%,100% 38%,71% 60%,80% 98%,50% 77%,20% 98%,29% 60%,0 38%,37% 35%)}
.pt[data-hl] .el:not(.hl){opacity:.22}
.el.right{animation:pop .6s}
.el.wrong{animation:shake .4s}
@keyframes pop{40%{transform:scale(1.3);box-shadow:0 0 0 5px #51cf66}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.under{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:var(--s5);align-items:start}
.legend{display:flex;flex-wrap:wrap;gap:var(--s2)}
.legend button{display:flex;align-items:center;gap:var(--s2);border-radius:var(--r2);padding:0 var(--s3);font-weight:600;font-size:15px;min-height:40px;box-shadow:inset 0 0 0 1px var(--line)}
.legend button::before{content:"";width:14px;height:14px;border-radius:var(--r1);background:var(--c);box-shadow:inset 0 0 0 1px var(--edge)}
.legend[data-hl] button:not(.on){opacity:.4}
.legend button.on{box-shadow:inset 0 0 0 2px var(--ink)}
.prog{border-top:3px solid var(--star);padding-top:var(--s2)}
.prog b{font-size:17px;font-weight:700}
.bar{height:10px;background:var(--soft);border-radius:var(--r1);margin-top:var(--s2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--star);transition:width .4s}
/* full-screen sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:0 max(4vw,16px,env(safe-area-inset-right,0px)) calc(var(--s6) + env(safe-area-inset-bottom,0px)) max(4vw,16px,env(safe-area-inset-left,0px))}
.sheet{--sbh:74px}
.sheet.barup{--sbh:12px}
.sbar{position:sticky;top:0;z-index:2;transition:transform .25s;background:var(--bg);display:flex;align-items:center;gap:var(--s2);padding:calc(env(safe-area-inset-top,0px) + var(--s3)) 0 var(--s3);margin-bottom:var(--s2);border-bottom:1px solid var(--line)}
.sbar .nav{display:flex;gap:var(--s2)}
.sl{background:var(--soft);margin-left:auto}
.sl button[aria-pressed=true]{background:var(--brand);color:#fff}
.sheet.barup .sbar{transform:translateY(-110%)}
.sbar .nav button{width:40px;height:40px;border-radius:var(--r2);box-shadow:inset 0 0 0 1.5px var(--line);font-size:24px;font-weight:700;line-height:1}
.dgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--s6);align-items:start;padding-top:var(--s3)}
.view{position:sticky;top:var(--sbh);transition:top .25s;height:calc(100svh - 108px);min-height:380px;border-radius:var(--r3);overflow:hidden;background:radial-gradient(circle at 50% 42%,#25306c,#0a0d20 75%);touch-action:none;user-select:none}
.sheet.noview .dgrid{grid-template-columns:minmax(0,1fr);max-width:1000px;margin:0 auto}
.sheet.noview .view{display:none}
.view canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.vcap{text-shadow:0 1px 3px rgba(0,0,0,.85);position:absolute;left:var(--s5);right:var(--s5);bottom:var(--s4);color:#fff;pointer-events:none;display:grid;gap:2px}
.vcap b{font-size:21px;font-weight:700}
.vcap span{font-size:15px;color:#c8cff5}
.vhint{position:absolute;top:var(--s3);left:var(--s5);color:#aab3e8;font-size:14px;pointer-events:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:var(--s5)}
/* panels: one rhythm for every column */
.info,.panel{display:grid;gap:var(--s4);align-content:start}
.panel h2{margin:0;font-size:clamp(28px,3.4vw,40px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
h3{margin:var(--s2) 0 calc(-1*var(--s2));font-size:19px;font-weight:700}
.namecard{display:flex;gap:var(--s5);align-items:center}
.bigtile{flex:none;width:112px;height:124px;border-radius:var(--r2);background:var(--c,var(--soft));color:var(--tink);display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 1.5px var(--edge,var(--line))}
.bigtile small{position:absolute;top:var(--s2);left:var(--s3);font-size:17px;font-weight:700}
.bigtile b{font-size:56px;font-weight:700;letter-spacing:-.02em}
.name{font-family:var(--read);font-size:clamp(38px,5.2vw,62px);font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.name span{border-radius:var(--r1);transition:background .1s}
.name span.lit{background:color-mix(in srgb,var(--star) 55%,transparent)}
.sy .s:nth-child(odd){color:var(--sya)}
.sy .s:nth-child(even){color:var(--syb)}
.cat{display:inline-flex;align-items:center;gap:6px;margin-top:var(--s2);font-weight:600;font-size:15px;color:var(--mute)}
.cat::before{content:"";width:14px;height:14px;border-radius:var(--r1);background:var(--c);box-shadow:inset 0 0 0 1px var(--edge)}
.readrow{display:flex;flex-wrap:wrap;gap:var(--s3)}
.listen,.iread{position:relative;overflow:hidden;display:flex;align-items:center;gap:var(--s3);border-radius:var(--r2);padding:0 var(--s5);min-height:56px;font-size:19px;font-weight:700}
.listen{background:var(--brand);color:#fff}
.listen svg,.iread svg{width:26px;height:26px;fill:currentColor;flex:none}
.listen:disabled{background:var(--soft);color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--line);cursor:default}
.listen .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--brand) 20%,transparent)}
.listen:disabled .fill{animation:fillup var(--wait,4s) linear forwards}
@keyframes fillup{to{width:100%}}
.listen>*:not(.fill){position:relative}
.iread{background:var(--star);color:var(--tink)}
.iread.done{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.iread.done svg{fill:var(--star)}
.note{color:var(--mute);margin:calc(-1*var(--s2)) 0 0;font-size:15px}
.note.warn{color:#c25e00}
.fact{background:var(--soft);border-radius:var(--r3);padding:var(--s4) var(--s5);display:grid;gap:var(--s3);justify-items:start}
.fact .qp{margin-bottom:calc(-1*var(--s2))}
.words{font-family:var(--read);font-size:clamp(21px,2.3vw,25px);line-height:1.5;font-weight:400}
.words button{padding:0 2px;border-radius:var(--r1)}
.words button.on{background:var(--star);color:var(--tink)}
.along{display:inline-flex;align-items:center;gap:var(--s2);background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--r2);padding:0 var(--s4);font-weight:700;min-height:44px}
.along svg{width:18px;height:18px;fill:currentColor}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.stats div{background:var(--bg);padding:var(--s3) var(--s4)}
.stats span{display:block;color:var(--mute);font-size:14px;font-weight:500}
.stats b{font-size:23px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.stats .p b{color:#e03131}.stats .e b{color:#1c7ed6}
.stats .wide{grid-column:1/-1}
.stats .wide b{white-space:normal;font-size:20px}
.hrow{display:flex;align-items:center;gap:var(--s3);margin:var(--s2) 0 calc(-1*var(--s2))}
.hrow h3{margin:0}
.qbtn{font-size:15px;font-weight:700;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--r2);padding:0 var(--s3);min-height:36px}
.sxfig{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--s5);align-items:center;background:var(--soft);border-radius:var(--r3);padding:var(--s4)}
#sx-svg{width:100%;max-width:420px;aspect-ratio:1;display:block;margin:0 auto}
#sx-svg .sxl{fill:var(--ink);paint-order:stroke;stroke:var(--soft);stroke-width:3px}
.spin{transform-box:view-box;transform-origin:50% 50%;animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sxside{display:grid;gap:var(--s3);justify-items:start}
.sxnav{display:flex;align-items:center;gap:var(--s3)}
.sxnav .pill{font-size:24px;width:48px;padding:0}
.sxel{display:flex;align-items:center;gap:var(--s3)}
.sxel .kt{width:58px}
.sxn{font-family:var(--read);font-size:28px;font-weight:700}
@media(max-width:640px){.sxfig{grid-template-columns:minmax(0,1fr);gap:var(--s3)}#sx-svg{max-width:300px}}
.stab{margin-top:var(--s1);font-weight:700;font-size:15px}
.stab.st-s{color:#2b8a3e}.stab.st-u{color:#c92a2a}.stab.st-q{color:var(--mute)}
.stab.st-s::before{content:"✓ "}.stab.st-u::before{content:"✗ "}
#camv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.view.cam{background:#000}
.cambtn{position:absolute;top:var(--s2);right:var(--s2);z-index:2;width:44px;height:44px;border-radius:var(--r2);background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.duset{display:grid;gap:var(--s3);background:var(--soft);border-radius:var(--r3);padding:var(--s4)}
.durow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4)}
.durow>b{min-width:7em}
.duseg{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.duseg button[aria-pressed=true]{background:var(--brand);color:#fff}
.dufc{display:flex;align-items:center;gap:var(--s2)}
.dufc input{width:22px;height:22px}
.dunet{display:grid;gap:var(--s2)}
.dujoin{display:inline-flex;gap:var(--s2)}
.dujoin input{width:6.5em;font:inherit;font-size:20px;letter-spacing:.2em;text-align:center;border:1.5px solid var(--line);border-radius:var(--r2);background:var(--bg);color:var(--ink);min-height:44px}

.tray{display:flex;flex-wrap:wrap;gap:var(--s2);min-height:48px;align-items:center;padding:var(--s2);border-radius:var(--r2);background:var(--soft)}
.tray .help{padding-left:var(--s2)}
.tray button{display:flex;align-items:center;gap:var(--s2);background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--r2);padding:0 var(--s3);font-weight:700;font-size:18px;min-height:44px}
.tray i{width:18px;height:18px;border-radius:50%;background:var(--c);display:inline-block;box-shadow:0 0 0 1.5px var(--line)}
/* find it at home */
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,42vw),1fr));gap:var(--s3)}
.hcard{box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--r3);padding:var(--s4);display:grid;gap:var(--s3);grid-template-rows:auto auto 1fr auto;align-content:start}
.hcard .em{width:52px;height:52px;border-radius:var(--r2);background:var(--soft);display:grid;place-items:center;color:var(--brand)}
.hcard .em .ic{width:30px;height:30px}
.hcard .em.gold{color:#b8860b;background:#fff3c4}
.homes .ic.gold{color:#b8860b}
.homes button{display:inline-flex;align-items:center;gap:var(--s2)}
.homes .ic{width:20px;height:20px;color:var(--brand)}
.hcard .it{font-family:var(--read);font-size:25px;font-weight:700;line-height:1.15;text-align:left;min-height:44px}
.hcard .els{display:flex;flex-wrap:wrap;gap:var(--s1);align-content:start}
.hcard .els button{display:flex;align-items:center;gap:6px;border-radius:var(--r1);padding:2px var(--s2);font-weight:600;font-size:14px;min-height:40px;box-shadow:inset 0 0 0 1px var(--line)}
.hcard .els button::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c);box-shadow:inset 0 0 0 1px var(--edge)}
.hcard.found{box-shadow:inset 0 0 0 2px #51cf66;background:color-mix(in srgb,#51cf66 10%,transparent)}
.hcard .fb{justify-self:stretch}
/* which is heavier */
.scale{width:100%;max-width:620px;height:auto;display:block;margin:0 auto}
.hpick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s3)}
.hpick button{border-radius:var(--r2);padding:var(--s4);background:var(--c);color:var(--tink);display:grid;justify-items:center;gap:var(--s1);box-shadow:inset 0 0 0 1.5px var(--edge)}
.hpick b{font-size:46px;font-weight:700;line-height:1}
.hpick button>span{font-family:var(--read);font-size:22px;font-weight:700;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);border-radius:var(--r1);padding:2px var(--s3);margin:var(--s1) 0;max-width:100%}
.hpick small{font-size:15px;font-weight:600;min-height:21px;font-variant-numeric:tabular-nums}
#w-next{justify-self:start}
/* grown-ups */
.grown section{box-shadow:inset 0 0 0 1.5px var(--line);border-radius:var(--r3);padding:var(--s4) var(--s5);display:grid;gap:var(--s3)}
.grown h3{margin:0}
.grown label{display:flex;gap:var(--s3);align-items:center}
.grown input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--brand)}
.grown select{font:inherit;font-size:16px;padding:0 var(--s2);min-height:44px;border-radius:var(--r2);border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.grown p{margin:0}
.vrow{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:var(--s3);align-items:center}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.rep div{background:var(--bg);padding:var(--s3) var(--s4)}
.rep span{display:block;color:var(--mute);font-size:14px;font-weight:500}
.rep b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tricky{display:flex;flex-wrap:wrap;gap:var(--s2)}
.tricky span{font-family:var(--read);background:var(--soft);border-radius:var(--r1);padding:2px var(--s3);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(var(--s6) + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--star);color:var(--tink);font-weight:800;font-size:21px;padding:var(--s3) var(--s5);border-radius:var(--r2);z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:up .3s}
@keyframes up{from{transform:translate(-50%,20px);opacity:0}}

/* syllables for reading: Turkish rule (the consonant right before a vowel starts the syllable); Russian reading rule (a lone consonant starts the next syllable, in a group all but the last stay with the previous one, ь/ъ stay with their consonant) */
const VOW={ru:'аеёиоуыэюяАЕЁИОУЫЭЮЯ',tr:'aeıioöuüâîûAEIİOÖUÜÂÎÛ'};
function syllables(w,lang){
  const V=VOW[lang];if(!V)return[w];
  const vi=[];for(let i=0;i<w.length;i++)if(V.includes(w[i]))vi.push(i);
  if(vi.length<2)return[w];
  const cuts=vi.slice(0,-1).map((a,j)=>{const b=vi[j+1],lo=w.slice(a+1,b).toLowerCase(),n=lo.length;let k=0;
    if(lang==='tr')k=n?n-1:0;
    else{const us=[];for(const ch of w.slice(a+1,b)){if('ьъЬЪ'.includes(ch)&&us.length)us[us.length-1]+=ch;else us.push(ch)}k=us.length>1?us.slice(0,-1).join('').length:0}
    return a+1+k});
  const out=[];let p=0;cuts.forEach(c=>{out.push(w.slice(p,c));p=c});out.push(w.slice(p));return out.filter(Boolean);
}

88:["Radium glows faintly in the dark. Long ago it was used on clock hands, until people learned it was dangerous.","Радий слабо светится в темноте. Раньше им красили стрелки часов, пока не узнали, что он опасен.","Radyum karanlıkta hafifçe parlar. Eskiden saat ibrelerinde kullanılırdı, sonra tehlikeli olduğu anlaşıldı."],
90:["Thorium is named after Thor, the Norse god of thunder.","Торий назван в честь Тора, скандинавского бога грома.","Toryum, adını İskandinav gök gürültüsü tanrısı Thor'dan alır."],
94:["Plutonium is named after the dwarf planet Pluto. It powers some space probes far from the Sun.","Плутоний назван в честь карликовой планеты Плутон. Он даёт энергию космическим аппаратам вдали от Солнца.","Plütonyum, adını cüce gezegen Plüton'dan alır. Güneş'ten çok uzaktaki bazı uzay araçlarına enerji verir."],
95:["Americium is named after America. A tiny bit of it is inside many smoke alarms.","Америций назван в честь Америки. Крупинка америция есть во многих датчиках дыма.","Amerikyum, adını Amerika'dan alır. Birçok duman alarmının içinde çok az amerikyum vardır."],
98:["Californium is named after California, where it was first made in a lab.","Калифорний назван в честь Калифорнии. Там его впервые сделали в лаборатории.","Kaliforniyum, adını Kaliforniya'dan alır. İlk kez orada bir laboratuvarda yapıldı."],
99:["Einsteinium is named after Albert Einstein. Scientists have made only tiny specks of it.","Эйнштейний назван в честь Альберта Эйнштейна. Учёные сделали его совсем-совсем мало.","Aynştaynyum, adını Albert Einstein'dan alır. Bilim insanları ondan sadece minicik parçalar yapabildi."],
102:["Nobelium is named after Alfred Nobel, the man behind the Nobel Prize. It lasts only a short time.","Нобелий назван в честь Альфреда Нобеля, в честь которого названа Нобелевская премия. Он быстро распадается.","Nobelyum, adını Nobel Ödülü'nü kuran Alfred Nobel'den alır. Çok kısa süre dayanır."],
104:["Rutherfordium is named after Ernest Rutherford, who found the center of the atom. It lasts only a short time.","Резерфордий назван в честь Эрнеста Резерфорда. Он открыл ядро атома. Резерфордий быстро распадается.","Rutherfordiyum, adını atomun çekirdeğini bulan Ernest Rutherford'dan alır. Çok kısa süre dayanır."],
118:["Oganesson is the heaviest element ever made. It is named after Yuri Oganessian, a scientist who helped make it.","Оганесон — самый тяжёлый элемент, который сделали люди. Он назван в честь учёного Юрия Оганесяна.","Oganesson, insanların yaptığı en ağır elementtir. Adını, onu yapan bilim insanlarından Yuri Oganessian'dan alır."]
};
const FACT_SCI={
1:["Hydrogen is the most common element in the universe. In the Sun's core, hydrogen nuclei fuse into helium, releasing the energy that becomes sunlight.","Водород — самый распространённый элемент во Вселенной. В ядре Солнца ядра водорода сливаются в гелий, и выделяется энергия, которая становится солнечным светом.","Hidrojen evrendeki en yaygın elementtir. Güneş'in merkezinde hidrojen çekirdekleri birleşip helyuma dönüşür ve güneş ışığına dönüşen enerji açığa çıkar."],
2:["Helium was discovered in the Sun's spectrum in 1868, before it was found on Earth. Liquid helium, at minus 269 °C, cools the magnets in MRI scanners.","Гелий открыли в спектре Солнца в 1868 году, раньше, чем нашли на Земле. Жидкий гелий при минус 269 °C охлаждает магниты в аппаратах МРТ.","Helyum 1868'de, Dünya'da bulunmadan önce Güneş'in ışık tayfında keşfedildi. Eksi 269 °C'deki sıvı helyum, MR cihazlarının mıknatıslarını soğutur."],
3:["Lithium is the lightest metal and even floats on oil. In lithium-ion batteries, lithium ions move between electrodes to store energy for phones and electric cars.","Литий — самый лёгкий металл, он плавает даже в масле. В литий-ионных аккумуляторах ионы лития переходят между электродами и запасают энергию для телефонов и электромобилей.","Lityum en hafif metaldir ve yağda bile yüzer. Lityum iyon pillerde lityum iyonları elektrotlar arasında gidip gelerek telefonlar ve elektrikli arabalar için enerji depolar."],
6:["A carbon atom can form four bonds, so carbon builds huge molecules like DNA. Diamond and graphite are both pure carbon; only the arrangement of their atoms differs.","Атом углерода образует четыре связи, поэтому из углерода строятся огромные молекулы, например ДНК. Алмаз и графит — чистый углерод, они отличаются только расположением атомов.","Karbon atomu dört bağ yapabilir, bu yüzden DNA gibi dev moleküller kurar. Elmas ve grafit ikisi de saf karbondur; sadece atomlarının dizilişi farklıdır."],
7:["Nitrogen makes up about 78% of the air. The Haber process turns nitrogen from the air into ammonia for fertilizer, which helps feed billions of people.","Азот составляет около 78% воздуха. Процесс Габера превращает азот из воздуха в аммиак для удобрений, и это помогает кормить миллиарды людей.","Azot havanın yaklaşık %78'ini oluşturur. Haber yöntemi havadaki azotu gübre için amonyağa çevirir ve bu, milyarlarca insanın beslenmesine yardım eder."],
8:["Almost all the oxygen in our air was made by photosynthesis. Ozone (O3), a molecule of three oxygen atoms, blocks harmful ultraviolet light high in the atmosphere.","Почти весь кислород в воздухе появился благодаря фотосинтезу. Озон (O3), молекула из трёх атомов кислорода, высоко в атмосфере задерживает опасные ультрафиолетовые лучи.","Havadaki oksijenin neredeyse tamamı fotosentezle oluştu. Üç oksijen atomlu ozon (O3), atmosferin yükseklerinde zararlı morötesi ışınları engeller."],
9:["Fluorine is the most reactive element and pulls electrons from almost anything. Fluoride in toothpaste makes tooth enamel stronger and more resistant to decay.","Фтор — самый активный элемент: он отнимает электроны почти у любого вещества. Фторид в зубной пасте делает эмаль зубов крепче и защищает её от кариеса.","Flor en tepkin elementtir ve neredeyse her maddeden elektron koparır. Diş macunundaki florür, diş minesini güçlendirir ve çürümeye karşı korur."],
10:["Neon is a noble gas that forms no stable compounds. In a neon sign, electricity excites neon atoms, and they give off their own red-orange light.","Неон — благородный газ, он не образует устойчивых соединений. В неоновой вывеске электричество возбуждает атомы неона, и они испускают красно-оранжевый свет.","Neon soy bir gazdır ve kararlı bileşik oluşturmaz. Neon tabelalarda elektrik neon atomlarını uyarır ve atomlar kırmızı-turuncu ışık yayar."],
11:["Sodium reacts so violently with water that it can explode. Yet combined with chlorine, a toxic gas, it forms harmless table salt, sodium chloride.","Натрий так бурно реагирует с водой, что может взорваться. А вместе с ядовитым газом хлором он образует безопасную поваренную соль — хлорид натрия.","Sodyum suyla o kadar şiddetli tepkimeye girer ki patlayabilir. Zehirli bir gaz olan klorla birleşince ise zararsız sofra tuzunu, yani sodyum klorürü oluşturur."],
12:["Magnesium burns with a dazzling white light and was used in early camera flashes. In plants, a magnesium atom sits at the center of every chlorophyll molecule.","Магний горит ослепительно белым пламенем, его использовали в первых фотовспышках. В растениях атом магния находится в центре каждой молекулы хлорофилла.","Magnezyum göz kamaştırıcı beyaz bir ışıkla yanar ve ilk fotoğraf flaşlarında kullanıldı. Bitkilerde her klorofil molekülünün merkezinde bir magnezyum atomu bulunur."],
13:["Aluminium is the most common metal in Earth's crust, yet it was once more precious than gold. An electrolysis process invented in 1886 finally made it cheap.","Алюминий — самый распространённый металл в земной коре, но когда-то он ценился дороже золота. Дешёвым его сделал способ получения электролизом, изобретённый в 1886 году.","Alüminyum yer kabuğunda en çok bulunan metaldir ama bir zamanlar altından değerliydi. 1886'da bulunan bir elektroliz yöntemi onu sonunda ucuzlattı."],
14:["Silicon is a semiconductor: adding tiny amounts of other elements controls how it conducts electricity. Billions of silicon transistors fit on a single computer chip.","Кремний — полупроводник: крошечные добавки других элементов управляют тем, как он проводит ток. На одном компьютерном чипе помещаются миллиарды кремниевых транзисторов.","Silisyum bir yarı iletkendir: içine çok az başka element katılarak elektriği nasıl ileteceği ayarlanır. Tek bir bilgisayar çipine milyarlarca silisyum transistör sığar."],
15:["Phosphorus was discovered in 1669 by Hennig Brand, who boiled down urine. White phosphorus glows in the dark because it slowly reacts with oxygen in the air.","Фосфор открыл в 1669 году Хенниг Бранд, выпаривая мочу. Белый фосфор светится в темноте, потому что медленно реагирует с кислородом воздуха.","Fosforu 1669'da Hennig Brand, idrarı kaynatarak keşfetti. Beyaz fosfor, havadaki oksijenle yavaşça tepkimeye girdiği için karanlıkta parlar."],
16:["Sulfur compounds give rotten eggs and skunks their smell. Sulfuric acid is one of the most produced chemicals in the world and is used to make fertilizers.","Соединения серы дают запах тухлым яйцам и скунсам. Серная кислота — одно из самых производимых химических веществ в мире, из неё делают удобрения.","Çürük yumurta ve kokarca kokusu kükürt bileşiklerinden gelir. Sülfürik asit dünyada en çok üretilen kimyasallardan biridir ve gübre yapımında kullanılır."],
17:["Chlorine is added to drinking water and swimming pools to kill germs. Your stomach makes hydrochloric acid, HCl, to help digest food.","Хлор добавляют в питьевую воду и бассейны, чтобы убивать микробы. Желудок вырабатывает соляную кислоту, HCl, чтобы переваривать пищу.","Mikropları öldürmek için içme suyuna ve havuzlara klor eklenir. Midemiz, yiyecekleri sindirmek için hidroklorik asit (HCl) üretir."],
18:["Argon makes up almost 1% of air, and most of it came from the decay of radioactive potassium-40 in rocks. Its name means lazy in Greek, because it hardly reacts.","Аргон составляет почти 1% воздуха, и большая его часть появилась при распаде радиоактивного калия-40 в горных породах. По-гречески его название значит «ленивый»: он почти не вступает в реакции.","Argon havanın yaklaşık %1'ini oluşturur ve çoğu kayalardaki radyoaktif potasyum-40'ın bozunmasından gelir. Adı Yunancada tembel demektir, çünkü neredeyse hiç tepkimeye girmez."],
19:["Nerve cells send signals by moving potassium and sodium ions across their membranes. Bananas are rich in potassium, including a tiny share of naturally radioactive potassium-40.","Нервные клетки передают сигналы, перемещая ионы калия и натрия через свою оболочку. В бананах много калия, включая крошечную долю природного радиоактивного калия-40.","Sinir hücreleri, zarlarından potasyum ve sodyum iyonlarını geçirerek sinyal gönderir. Muz potasyumca zengindir; bunun çok küçük bir kısmı doğal radyoaktif potasyum-40'tır."],
20:["About 99% of the calcium in your body is in bones and teeth, as calcium phosphate. Seashells, natural chalk and marble are made of calcium carbonate.","Около 99% кальция в организме находится в костях и зубах в виде фосфата кальция. Ракушки, природный мел и мрамор состоят из карбоната кальция.","Vücudumuzdaki kalsiyumun yaklaşık %99'u kemik ve dişlerde, kalsiyum fosfat olarak bulunur. Deniz kabukları, doğal tebeşir ve mermer kalsiyum karbonattan oluşur."],
22:["Titanium is as strong as many steels but about 45% lighter. It bonds well with bone, so it is used for artificial hip joints and dental implants.","Титан прочен, как многие стали, но примерно на 45% легче. Он хорошо срастается с костью, поэтому из него делают искусственные суставы и зубные импланты.","Titanyum birçok çelik kadar güçlüdür ama yaklaşık %45 daha hafiftir. Kemikle iyi kaynaştığı için yapay kalça eklemleri ve diş implantları yapımında kullanılır."],
24:["Stainless steel contains at least 10.5% chromium, which forms an invisible oxide layer that stops rust. Chromium ions also give rubies their red color.","Нержавеющая сталь содержит не меньше 10,5% хрома: он образует невидимую оксидную плёнку, которая защищает от ржавчины. Ионы хрома придают рубинам красный цвет.","Paslanmaz çelikte en az %10,5 krom bulunur; krom, pası durduran görünmez bir oksit tabakası oluşturur. Yakutların kırmızı rengi de krom iyonlarından gelir."],
26:["Earth's core is made mostly of iron and nickel. In your blood, the iron in hemoglobin carries oxygen from your lungs to every cell.","Ядро Земли состоит в основном из железа и никеля. В крови железо в составе гемоглобина переносит кислород от лёгких ко всем клеткам.","Dünya'nın çekirdeği çoğunlukla demir ve nikelden oluşur. Kanımızda hemoglobindeki demir, oksijeni akciğerlerden bütün hücrelere taşır."],
28:["Iron meteorites are an alloy of iron and nickel. Today nickel is also a key metal in many electric car batteries.","Железные метеориты — это сплав железа и никеля. Сегодня никель также важен для аккумуляторов многих электромобилей.","Demir göktaşları, demir ve nikel alaşımıdır. Bugün nikel, birçok elektrikli araba bataryası için de önemli bir metaldir."],
29:["Copper conducts electricity better than any metal except silver, so it is used in wires. The Statue of Liberty is green because its copper surface reacted with the air.","Медь проводит ток лучше всех металлов, кроме серебра, поэтому из неё делают провода. Статуя Свободы зелёная, потому что её медная поверхность прореагировала с воздухом.","Bakır, gümüş dışındaki tüm metallerden daha iyi elektrik iletir; bu yüzden kablolarda kullanılır. Özgürlük Heykeli, bakır yüzeyi havayla tepkimeye girdiği için yeşildir."],
30:["A zinc coating protects steel from rust even when scratched, because the zinc corrodes first. This process is called galvanizing.","Слой цинка защищает сталь от ржавчины даже с царапинами, потому что первым разрушается цинк. Такой процесс называется цинкованием.","Çeliğin üzerine kaplanan çinko, çizilse bile onu pastan korur, çünkü önce çinko aşınır. Bu işleme galvanizleme denir."],
33:["Arsenic was a famous poison in history. Today gallium arsenide is a semiconductor used in LEDs, lasers and the solar panels of satellites.","Мышьяк был знаменитым ядом в истории. Сегодня арсенид галлия — полупроводник, из которого делают светодиоды, лазеры и солнечные батареи спутников.","Arsenik tarihte ünlü bir zehirdi. Bugün galyum arsenür, LED'lerde, lazerlerde ve uyduların güneş panellerinde kullanılan bir yarı iletkendir."],
35:["Bromine is one of only two elements that are liquid at room temperature; the other is mercury. Its name comes from the Greek word for stench.","Бром — один из двух элементов, жидких при комнатной температуре; второй — ртуть. Его название происходит от греческого слова «зловоние».","Brom, oda sıcaklığında sıvı olan iki elementten biridir; diğeri cıvadır. Adı, Yunancada pis koku anlamına gelen kelimeden gelir."],
36:["From 1960 to 1983, the meter was officially defined using the orange light of krypton-86. Krypton was discovered in 1898 by separating liquefied air.","С 1960 по 1983 год метр официально определяли через оранжевый свет криптона-86. Криптон открыли в 1898 году, разделяя сжиженный воздух.","1960'tan 1983'e kadar metre, kripton-86'nın turuncu ışığıyla tanımlandı. Kripton 1898'de sıvılaştırılmış havanın ayrıştırılmasıyla keşfedildi."],
47:["Silver conducts electricity and heat better than any other metal. Silver ions kill bacteria, so silver is used in some wound dressings.","Серебро лучше всех металлов проводит электричество и тепло. Ионы серебра убивают бактерии, поэтому серебро добавляют в некоторые повязки.","Gümüş, elektriği ve ısıyı en iyi ileten metaldir. Gümüş iyonları bakterileri öldürür, bu yüzden bazı yara örtülerinde kullanılır."],
50:["Mixing tin with copper makes bronze, which gave the Bronze Age its name. Below about 13 °C, tin can slowly crumble into grey powder, called tin pest.","Сплав олова с медью — бронза, в честь неё назван бронзовый век. Ниже 13 °C олово может медленно рассыпаться в серый порошок — это «оловянная чума».","Kalay bakırla karıştırılınca tunç (bronz) olur; Tunç Çağı adını bundan alır. Kalay yaklaşık 13 °C'nin altında yavaşça gri bir toza dönüşebilir; buna kalay vebası denir."],
53:["Your thyroid gland uses iodine to make hormones that control growth, so iodine is added to table salt. Iodine turns starch dark blue-black, a classic lab test.","Щитовидная железа использует йод, чтобы делать гормоны, управляющие ростом, поэтому йод добавляют в соль. Йод окрашивает крахмал в тёмно-синий цвет — это известный опыт.","Tiroit bezi, büyümeyi düzenleyen hormonları yapmak için iyot kullanır; bu yüzden sofra tuzuna iyot eklenir. İyot nişastayı koyu mavi-siyaha boyar; bu, bilinen bir laboratuvar deneyidir."],
54:["Xenon was long thought to be totally unreactive, but in 1962 Neil Bartlett made the first noble gas compound with it. Xenon ion engines push spacecraft such as NASA's Dawn.","Ксенон долго считали совсем инертным, но в 1962 году Нил Бартлетт получил с ним первое соединение благородного газа. Ксеноновые ионные двигатели разгоняют космические аппараты, например «Dawn».","Ksenonun hiç tepkimeye girmediği sanılıyordu, ama 1962'de Neil Bartlett onunla ilk soy gaz bileşiğini yaptı. Ksenonlu iyon motorları, NASA'nın Dawn aracı gibi uzay araçlarını iter."],
55:["The second is defined using cesium-133 atoms: one second is exactly 9,192,631,770 cycles of the microwave radiation they absorb and emit.","Секунда определяется через атомы цезия-133: это ровно 9 192 631 770 колебаний микроволнового излучения, которое они поглощают и испускают.","Saniye, sezyum-133 atomlarıyla tanımlanır: bir saniye, bu atomların soğurduğu ve yaydığı mikrodalga ışınımın tam 9.192.631.770 titreşimidir."],
74:["Tungsten has the highest melting point of all metals, 3422 °C, so it was used for light bulb filaments. Its symbol W comes from its other name, wolfram.","У вольфрама самая высокая температура плавления среди металлов — 3422 °C, поэтому из него делали нити ламп накаливания. Его символ W — от латинского названия Wolframium.","Tungsten, 3422 °C ile metaller arasında en yüksek erime noktasına sahiptir; bu yüzden ampul tellerinde kullanıldı. W simgesi, diğer adı olan volframdan gelir."],
78:["Platinum is a catalyst: it speeds up chemical reactions without being used up. In car catalytic converters, it helps turn toxic exhaust gases into less harmful ones.","Платина — катализатор: она ускоряет химические реакции, а сама не расходуется. В автомобильных катализаторах она помогает превращать ядовитые газы в менее вредные.","Platin bir katalizördür: kimyasal tepkimeleri hızlandırır ama kendisi harcanmaz. Arabaların katalitik dönüştürücülerinde zehirli egzoz gazlarını daha az zararlı gazlara çevirmeye yardım eder."],
79:["Gold forms in extreme cosmic events such as collisions of neutron stars. It is so malleable that one gram can be hammered into a sheet about one square meter in size.","Золото рождается при мощных космических событиях, например при столкновении нейтронных звёзд. Оно такое ковкое, что из одного грамма можно выковать лист площадью около квадратного метра.","Altın, nötron yıldızlarının çarpışması gibi çok güçlü kozmik olaylarda oluşur. O kadar dövülebilir ki bir gram altından yaklaşık bir metrekarelik yaprak yapılabilir."],
80:["Mercury is the only metal that is liquid at room temperature. Its vapor is toxic, so mercury thermometers have mostly been replaced by digital ones.","Ртуть — единственный металл, жидкий при комнатной температуре. Её пары ядовиты, поэтому ртутные градусники в основном заменили электронными.","Cıva, oda sıcaklığında sıvı olan tek metaldir. Buharı zehirli olduğu için cıvalı termometrelerin yerini çoğunlukla dijital termometreler aldı."],
82:["Lead is dense and absorbs X-rays, so patients wear lead aprons for dental X-rays. Lead was removed from paint and petrol in most countries because it harms the brain.","Свинец плотный и задерживает рентгеновские лучи, поэтому при снимке зубов надевают свинцовый фартук. Почти во всех странах свинец убрали из красок и бензина, потому что он вредит мозгу.","Kurşun yoğundur ve röntgen ışınlarını tutar; bu yüzden diş röntgeninde kurşunlu önlük giyilir. Beyne zarar verdiği için çoğu ülkede boya ve benzinden çıkarıldı."],
86:["Radon is a radioactive noble gas produced when uranium in rocks decays. It can build up in basements, so many countries test homes for it.","Радон — радиоактивный благородный газ, который образуется при распаде урана в горных породах. Он может скапливаться в подвалах, поэтому во многих странах дома проверяют на радон.","Radon, kayalardaki uranyum bozunduğunda oluşan radyoaktif bir soy gazdır. Bodrumlarda birikebileceği için birçok ülkede evlerde radon ölçülür."],
88:["Marie and Pierre Curie discovered radium in 1898, and Marie later processed tonnes of uranium ore to isolate it. She became the first person to win two Nobel Prizes.","Мария и Пьер Кюри открыли радий в 1898 году, а потом Мария переработала тонны урановой руды, чтобы его выделить. Она первой в мире получила две Нобелевские премии.","Marie ve Pierre Curie radyumu 1898'de keşfetti; Marie daha sonra onu ayırmak için tonlarca uranyum cevheri işledi. İki Nobel Ödülü kazanan ilk insan oldu."],
92:["Uranium was named after the planet Uranus. Splitting the nuclei in 1 kg of uranium-235 releases about as much energy as burning 3,000 tonnes of coal.","Уран назван в честь планеты Уран. Деление ядер в 1 кг урана-235 даёт примерно столько же энергии, сколько сжигание 3000 тонн угля.","Uranyum, adını Uranüs gezegeninden alır. 1 kg uranyum-235'in çekirdekleri bölündüğünde, yaklaşık 3000 ton kömür yakmak kadar enerji açığa çıkar."],
94:["Plutonium-238 stays hot from its own radioactive decay. Generators that turn this heat into electricity power the Voyager probes and the Perseverance rover on Mars.","Плутоний-238 нагревается от собственного радиоактивного распада. Генераторы, превращающие это тепло в электричество, питают зонды «Вояджер» и марсоход «Персеверанс».","Plütonyum-238 kendi radyoaktif bozunmasıyla ısınır. Bu ısıyı elektriğe çeviren jeneratörler, Voyager sondalarına ve Mars'taki Perseverance aracına güç verir."],
43:["Technetium, discovered in 1937, was the first element made artificially; its name comes from the Greek for artificial. Technetium-99m is used in tens of millions of medical scans each year.","Технеций, открытый в 1937 году, — первый искусственно полученный элемент; его название по-гречески значит «искусственный». Технеций-99m используют в десятках миллионов медицинских обследований в год.","1937'de keşfedilen teknesyum, yapay olarak üretilen ilk elementtir; adı Yunancada yapay demektir. Teknesyum-99m her yıl on milyonlarca tıbbi taramada kullanılır."],
61:["Promethium has no stable isotopes, so almost none exists naturally on Earth. It is named after Prometheus, who in Greek myth stole fire from the gods.","У прометия нет стабильных изотопов, поэтому в природе его почти нет. Он назван в честь Прометея, который, по греческому мифу, украл огонь у богов.","Prometyumun kararlı izotopu yoktur, bu yüzden Dünya'da doğal olarak neredeyse hiç bulunmaz. Adını, Yunan mitolojisinde tanrılardan ateşi çalan Prometheus'tan alır."],
99:["Einsteinium was first found in 1952 in debris from the first hydrogen bomb test. Scientists have only ever made tiny amounts, far less than a gram.","Эйнштейний впервые нашли в 1952 году в остатках после испытания первой водородной бомбы. Учёные получали его лишь в крошечных количествах, гораздо меньше грамма.","Aynştaynyum ilk kez 1952'de, ilk hidrojen bombası denemesinin kalıntılarında bulundu. Bilim insanları ondan bugüne kadar bir gramdan çok daha az üretebildi."],
101:["Mendelevium is named after Dmitri Mendeleev, who created the periodic table in 1869. When it was first made in 1955, scientists produced only about 17 atoms.","Менделевий назван в честь Дмитрия Менделеева, создавшего периодическую таблицу в 1869 году. Когда его впервые получили в 1955 году, учёные сделали всего около 17 атомов.","Mendelevyum, 1869'da periyodik tabloyu oluşturan Dmitri Mendeleyev'in adını taşır. 1955'te ilk kez üretildiğinde bilim insanları yalnızca yaklaşık 17 atom elde etti."],
104:["Rutherfordium is the first element after the actinides. Soviet and American teams argued for years over its name, until IUPAC settled it in 1997.","Резерфордий — первый элемент после актиноидов. Советские и американские учёные долго спорили о его названии (в СССР его называли курчатовием), пока ИЮПАК не решил вопрос в 1997 году.","Rutherfordiyum, aktinitlerden sonraki ilk elementtir. Sovyet ve Amerikan ekipleri adı konusunda yıllarca tartıştı; IUPAC konuyu 1997'de çözdü."],
111:["Roentgenium is named after Wilhelm Röntgen, who discovered X-rays. It was first made in Germany in 1994 by firing nickel nuclei at bismuth.","Рентгений назван в честь Вильгельма Рентгена, открывшего рентгеновские лучи. Его впервые получили в Германии в 1994 году, обстреливая висмут ядрами никеля.","Röntgenyum, X ışınlarını keşfeden Wilhelm Röntgen'in adını taşır. İlk kez 1994'te Almanya'da bizmut, nikel çekirdekleriyle bombardıman edilerek üretildi."],
113:["Nihonium was the first element discovered in Asia, by Japanese scientists at RIKEN. Its name comes from Nihon, one of the Japanese names for Japan.","Нихоний — первый элемент, открытый в Азии, его нашли японские учёные из института RIKEN. Название происходит от слова «Нихон» — так японцы называют Японию.","Nihonyum, Asya'da keşfedilen ilk elementtir; onu RIKEN'deki Japon bilim insanları buldu. Adı, Japoncada Japonya anlamına gelen Nihon kelimesinden gelir."],
117:["Tennessine was made in 2010 in Dubna, Russia, by firing calcium-48 nuclei at berkelium produced in the USA. It is named after Tennessee, home of Oak Ridge National Laboratory.","Теннессин получили в 2010 году в Дубне, обстреливая ядрами кальция-48 берклий, сделанный в США. Он назван в честь штата Теннесси, где находится Ок-Риджская национальная лаборатория.","Tennessin 2010'da Rusya'nın Dubna şehrinde, ABD'de üretilen berkelyumun kalsiyum-48 çekirdekleriyle bombardıman edilmesiyle yapıldı. Adını Oak Ridge Ulusal Laboratuvarı'nın bulunduğu Tennessee eyaletinden alır."],
118:["Oganesson sits in the noble gas column, but calculations suggest it may be a solid and more reactive than other noble gases. Only about five of its atoms have ever been detected.","Оганесон стоит в столбце благородных газов, но расчёты показывают, что он может быть твёрдым и более активным, чем другие благородные газы. Всего удалось зарегистрировать около пяти его атомов.","Oganesson soy gazlar sütunundadır, ama hesaplamalar onun katı ve diğer soy gazlardan daha tepkin olabileceğini gösteriyor. Şimdiye kadar yalnızca yaklaşık beş atomu tespit edildi."]
};
