# Publishes the kids' science apps to GitHub Pages:
#   https://obulat.github.io/obulat/science-explorer/
# element-explorer/ and cell-explorer/ only redirect there, for old links and installed copies
name: Publish science apps

on:
  push:
    branches: [main]
    paths: ['science-explorer/**', 'element-explorer/**', 'cell-explorer/**', 'site-index.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the app's script parses
        # one stray quote in a translation blanks the whole app, so fail before deploying
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' science-explorer/index.html | sed '1d;$d' > "$RUNNER_TEMP/app.js"
          node --check "$RUNNER_TEMP/app.js"
      - name: Assemble the site
        run: |
          mkdir -p _site/science-explorer
          rsync -a --exclude tools --exclude .gitignore --exclude app.html science-explorer/ _site/science-explorer/
          mkdir -p _site/element-explorer && cp element-explorer/index.html element-explorer/sw.js _site/element-explorer/
          mkdir -p _site/cell-explorer && cp cell-explorer/index.html _site/cell-explorer/
          cp site-index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}science-explorer/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
