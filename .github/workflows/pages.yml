# Publishes the kids' science apps to GitHub Pages:
#   https://obulat.github.io/obulat/element-explorer/
#   https://obulat.github.io/obulat/cell-explorer/
name: Publish science apps

on:
  push:
    branches: [master]
    paths: ['element-explorer/**', 'cell-explorer/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/element-explorer
          rsync -a --exclude tools --exclude .gitignore --exclude app.html element-explorer/ _site/element-explorer/
          mkdir -p _site/cell-explorer && cp cell-explorer/index.html _site/cell-explorer/
          cp site-index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}element-explorer/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
