# Publishes Element Explorer to GitHub Pages:
#   https://obulat.github.io/obulat/element-explorer/
name: Publish Element Explorer

on:
  push:
    branches: [master]
    paths: ['element-explorer/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/element-explorer
          rsync -a --exclude tools --exclude .gitignore --exclude app.html element-explorer/ _site/element-explorer/
          # The site root forwards to the app
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=element-explorer/"><title>Element Explorer</title><a href="element-explorer/">Element Explorer</a>\n' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}element-explorer/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
